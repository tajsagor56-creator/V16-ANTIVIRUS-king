name: V16 Antivirus APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Java Setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Project Check
        run: |
          echo "================================"
          echo "V16 ANTIVIRUS"
          echo "================================"
          python --version
          java -version
          ls -la

      - name: Python Syntax Check
        run: |
          python -m py_compile main.py
          echo "main.py syntax ঠিক আছে"

      - name: Buildozer Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.6.0
          python -m pip install cython==0.29.37

      - name: Buildozer Version
        run: |
          buildozer --version
