name: V16 Antivirus APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            curl \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.6.0
          pip install cython==0.29.37
          pip install virtualenv

      - name: Test Python
        run: |
          python -m py_compile main.py
          echo "main.py syntax OK"

      - name: Clean
        run: |
          rm -rf .buildozer
          rm -rf bin
          mkdir -p bin

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          echo "=============================="
          echo "ANDROID SDK"
          echo "=============================="

          rm -rf "$SDK_ROOT"

          mkdir -p "$SDK_ROOT"
          mkdir -p "$SDK_ROOT/cmdline-tools"

          echo "Downloading Android command line tools..."

          curl -L --fail \
            -o "$HOME/cmdline-tools.zip" \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"

          mkdir -p "$HOME/android-tools"

          unzip -q \
            "$HOME/cmdline-tools.zip" \
            -d "$HOME/android-tools"

          mkdir -p "$SDK_ROOT/cmdline-tools/latest"

          cp -r \
            "$HOME/android-tools/cmdline-tools/." \
            "$SDK_ROOT/cmdline-tools/latest/"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$SDK_ROOT" -name sdkmanager -print
            exit 1
          fi

          chmod +x "$SDKMANAGER"

          echo "sdkmanager found:"
          "$SDKMANAGER" --version

          mkdir -p "$SDK_ROOT/licenses"

          printf '%s\n' \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            > "$SDK_ROOT/licenses/android-sdk-license"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          AIDL="$SDK_ROOT/build-tools/35.0.0/aidl"

          if [ ! -f "$AIDL" ]; then
            echo "ERROR: AIDL not found"
            find "$SDK_ROOT/build-tools" -name aidl -print
            exit 1
          fi

          chmod +x "$AIDL"

          echo "AIDL FOUND:"
          ls -lh "$AIDL"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROIDAPI=35" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=23" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Verify SDK
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          echo "SDK:"
          echo "$SDK_ROOT"

          echo "SDKMANAGER:"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version

          echo "Build Tools:"
          ls -la "$SDK_ROOT/build-tools"

          echo "AIDL:"
          ls -lh "$SDK_ROOT/build-tools/35.0.0/aidl"

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Check APK
        if: always()
        run: |
          echo "=============================="
          echo "GENERATED APK"
          echo "=============================="

          if ls bin/*.apk >/dev/null 2>&1; then
            ls -lh bin/*.apk
          else
            echo "ERROR: APK WAS NOT GENERATED"
            find . -type f -name "*.apk" -print
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V16-build-log
          path: .buildozer
          if-no-files-found: ignore
