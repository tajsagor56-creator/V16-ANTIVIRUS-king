name: V16 Antivirus APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # ১. Repository Checkout
      # ==========================================
      - name: Repository Checkout
        uses: actions/checkout@v5


      # ==========================================
      # ২. Python Setup
      # ==========================================
      - name: Python Setup
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ==========================================
      # ৩. Java Setup
      # ==========================================
      - name: Java Setup
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"


      # ==========================================
      # ৪. Linux Package
      # ==========================================
      - name: Linux Package ইনস্টল
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake


      # ==========================================
      # ৫. Python Build Package
      # ==========================================
      - name: Buildozer ইনস্টল
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37


      # ==========================================
      # ৬. Project Check
      # ==========================================
      - name: Project পরীক্ষা
        run: |
          echo "=========================================="
          echo "V16 ANTIVIRUS"
          echo "=========================================="

          echo
          echo "Python:"
          python --version

          echo
          echo "Java:"
          java -version

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "Project Files:"
          ls -la


      # ==========================================
      # ৭. main.py Syntax Check
      # ==========================================
      - name: Python Syntax পরীক্ষা
        run: |
          python -m py_compile main.py

          echo
          echo "main.py syntax ঠিক আছে"


      # ==========================================
      # ৮. Android SDK প্রস্তুত
      # ==========================================
      - name: Android SDK প্রস্তুত
        run: |
          echo "=========================================="
          echo "ANDROID SDK প্রস্তুত করা হচ্ছে"
          echo "=========================================="

          SYSTEM_SDK="/usr/local/lib/android/sdk"
          BUILD_SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "System SDK:"
          echo "$SYSTEM_SDK"

          echo "Buildozer SDK:"
          echo "$BUILD_SDK"

          if [ ! -d "$SYSTEM_SDK" ]; then
            echo "ERROR: Android SDK পাওয়া যায়নি।"
            exit 1
          fi

          SDKMANAGER="$SYSTEM_SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager পাওয়া যায়নি।"

            find "$SYSTEM_SDK" \
              -type f \
              -name "sdkmanager" \
              -print || true

            exit 1
          fi

          echo
          echo "sdkmanager পাওয়া গেছে:"
          echo "$SDKMANAGER"

          # ------------------------------------------
          # Android SDK environment
          # ------------------------------------------

          echo "ANDROID_HOME=$SYSTEM_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SYSTEM_SDK" >> "$GITHUB_ENV"

          echo "$SYSTEM_SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SYSTEM_SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          # ------------------------------------------
          # Buildozer SDK directory
          # ------------------------------------------

          mkdir -p "$BUILD_SDK"

          # ------------------------------------------
          # SDK license
          # ------------------------------------------

          mkdir -p "$BUILD_SDK/licenses"

          printf '%s\n' \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            > "$BUILD_SDK/licenses/android-sdk-license"

          # ------------------------------------------
          # Buildozer-এর পুরোনো sdkmanager path ঠিক করা
          # ------------------------------------------

          mkdir -p "$BUILD_SDK/tools/bin"

          ln -sf \
            "$SDKMANAGER" \
            "$BUILD_SDK/tools/bin/sdkmanager"

          echo
          echo "Buildozer sdkmanager:"
          ls -l "$BUILD_SDK/tools/bin/sdkmanager"

          # ------------------------------------------
          # Build-Tools ইনস্টল
          # ------------------------------------------

          echo
          echo "Android SDK components ইনস্টল করা হচ্ছে..."

          "$SDKMANAGER" \
            --sdk_root="$SYSTEM_SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          # ------------------------------------------
          # Build-Tools Buildozer SDK-তে কপি
          # ------------------------------------------

          rm -rf "$BUILD_SDK/build-tools"
          rm -rf "$BUILD_SDK/platforms"
          rm -rf "$BUILD_SDK/platform-tools"

          cp -a \
            "$SYSTEM_SDK/build-tools" \
            "$BUILD_SDK/build-tools"

          cp -a \
            "$SYSTEM_SDK/platforms" \
            "$BUILD_SDK/platforms"

          cp -a \
            "$SYSTEM_SDK/platform-tools" \
            "$BUILD_SDK/platform-tools"

          echo
          echo "=========================================="
          echo "AIDL পরীক্ষা"
          echo "=========================================="

          find "$BUILD_SDK/build-tools" \
            -type f \
            -name "aidl" \
            -print

          if find "$BUILD_SDK/build-tools" \
            -type f \
            -name "aidl" \
            | grep -q "aidl"; then

            echo "AIDL পাওয়া গেছে।"

          else

            echo "ERROR: AIDL পাওয়া যায়নি।"
            exit 1

          fi


      # ==========================================
      # ৯. Android SDK Components পরীক্ষা
      # ==========================================
      - name: Android SDK Components পরীক্ষা
        run: |
          echo "=========================================="
          echo "ANDROID COMPONENTS"
          echo "=========================================="

          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          echo
          echo "SDK:"
          echo "$SDK_ROOT"

          echo
          echo "sdkmanager:"
          ls -l "$SDK_ROOT/tools/bin/sdkmanager"

          echo
          echo "Build-Tools:"
          ls -la "$SDK_ROOT/build-tools"

          echo
          echo "AIDL:"
          find "$SDK_ROOT/build-tools" \
            -type f \
            -name "aidl" \
            -print

          echo
          echo "Platforms:"
          ls -la "$SDK_ROOT/platforms"


      # ==========================================
      # ১০. APK তৈরি
      # ==========================================
      - name: APK তৈরি
        run: |
          echo "=========================================="
          echo "V16 ANTIVIRUS APK BUILD"
          echo "=========================================="

          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          buildozer -v android debug


      # ==========================================
      # ১১. APK পরীক্ষা
      # ==========================================
      - name: APK পরীক্ষা
        if: always()
        run: |
          echo "=========================================="
          echo "GENERATED APK"
          echo "=========================================="

          if [ -d "bin" ] && \
             find bin \
             -maxdepth 1 \
             -type f \
             -name "*.apk" \
             | grep -q ".apk"; then

            echo "APK সফলভাবে তৈরি হয়েছে।"

            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -exec ls -lh {} \;

          else

            echo "ERROR: APK তৈরি হয়নি।"

            echo
            echo "APK খোঁজা হচ্ছে..."

            find . \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print || true

            exit 1

          fi


      # ==========================================
      # ১২. APK Upload
      # ==========================================
      - name: APK Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: "bin/*.apk"
          if-no-files-found: error
