name: V16 Antivirus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      # ======================================================
      # 01 - CHECKOUT
      # ======================================================

      - name: 01 - Checkout
        uses: actions/checkout@v4


      # ======================================================
      # 02 - PYTHON
      # ======================================================

      - name: 02 - Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # 03 - JAVA
      # ======================================================

      - name: 03 - Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ======================================================
      # 04 - SYSTEM PACKAGES
      # ======================================================

      - name: 04 - Install system packages
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            autopoint \
            gettext


      # ======================================================
      # 05 - CREATE VENV
      # ======================================================

      - name: 05 - Create virtual environment
        run: |

          python -m venv .venv

          . .venv/bin/activate

          python -m pip install --upgrade pip


      # ======================================================
      # 06 - BUILD DEPENDENCIES
      # ======================================================

      - name: 06 - Install Buildozer
        run: |

          . .venv/bin/activate

          python -m pip install \
            "setuptools<76" \
            "wheel==0.43.0" \
            "cython<3" \
            "appdirs" \
            "colorama>=0.3.3" \
            "jinja2" \
            "sh>=2,<3.0" \
            "meson" \
            "ninja" \
            "build" \
            "toml" \
            "packaging"

          python -m pip install \
            "buildozer==1.6.0"


      # ======================================================
      # 07 - VERIFY
      # ======================================================

      - name: 07 - Verify environment
        run: |

          . .venv/bin/activate

          echo "===== PYTHON ====="
          python --version

          echo "===== BUILDOZER ====="
          buildozer --version

          echo "===== JAVA ====="
          java -version


      # ======================================================
      # 08 - CLEAN
      # ======================================================

      - name: 08 - Clean old build
        run: |

          rm -rf .buildozer
          rm -rf bin


      # ======================================================
      # 09 - BUILD APK
      # ======================================================

      - name: 09 - Build APK
        run: |

          . .venv/bin/activate

          buildozer -v android debug


      # ======================================================
      # 10 - SHOW APK
      # ======================================================

      - name: 10 - Show APK
        run: |

          echo "========================================"
          echo "V16 APK FILE"
          echo "========================================"

          find bin -type f -name "*.apk" -print


      # ======================================================
      # 11 - UPLOAD APK
      # ======================================================

      - name: 11 - Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-Pro-16.4
          path: bin/*.apk
          if-no-files-found: error
