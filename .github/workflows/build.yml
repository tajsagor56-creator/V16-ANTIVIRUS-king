name: V16 Antivirus APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # ১. GitHub Repository থেকে Project নেওয়া
      # ==========================================
      - name: Repository Checkout
        uses: actions/checkout@v4


      # ==========================================
      # ২. Python 3.11 সেটআপ
      # ==========================================
      - name: Python সেটআপ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"


      # ==========================================
      # ৩. Java 17 সেটআপ
      # ==========================================
      - name: Java সেটআপ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # ৪. Android SDK Command Line Tools সেটআপ
      # ==========================================
      - name: Android SDK সেটআপ
        uses: android-actions/setup-android@v3


      # ==========================================
      # ৫. প্রয়োজনীয় Linux Packages ইনস্টল
      # ==========================================
      - name: System Packages ইনস্টল
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake


      # ==========================================
      # ৬. Android SDK Components ইনস্টল
      # ==========================================
      - name: Android SDK Components ইনস্টল
        run: |

          echo "=========================================="
          echo "ANDROID SDK COMPONENTS"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"

          # Android SDK License গ্রহণ
          yes | sdkmanager --licenses > /dev/null || true

          # Android SDK Platform এবং Build Tools ইনস্টল
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo
          echo "=========================================="
          echo "AIDL পরীক্ষা"
          echo "=========================================="

          find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "aidl" \
            -print

          if find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "aidl" \
            | grep -q "aidl"; then

            echo "AIDL পাওয়া গেছে।"

          else

            echo "ERROR: AIDL পাওয়া যায়নি।"
            exit 1

          fi


      # ==========================================
      # ৭. Python Build Packages ইনস্টল
      # ==========================================
      - name: Build Packages ইনস্টল
        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37 \
            virtualenv


      # ==========================================
      # ৮. Project পরীক্ষা
      # ==========================================
      - name: Project পরীক্ষা
        run: |

          echo "=========================================="
          echo "PROJECT FILES"
          echo "=========================================="

          ls -la

          echo
          echo "=========================================="
          echo "PYTHON VERSION"
          echo "=========================================="

          python --version

          echo
          echo "=========================================="
          echo "JAVA VERSION"
          echo "=========================================="

          java -version

          echo
          echo "=========================================="
          echo "BUILDOZER VERSION"
          echo "=========================================="

          buildozer --version


      # ==========================================
      # ৯. main.py Syntax পরীক্ষা
      # ==========================================
      - name: Python Syntax পরীক্ষা
        run: |

          echo "=========================================="
          echo "MAIN.PY SYNTAX TEST"
          echo "=========================================="

          python -m py_compile main.py

          echo
          echo "main.py Syntax OK"


      # ==========================================
      # ১০. আগের Build পরিষ্কার
      # ==========================================
      - name: পুরোনো Build পরিষ্কার
        run: |

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin


      # ==========================================
      # ১১. Android Environment সেট করা
      # ==========================================
      - name: Android Environment সেটআপ
        run: |

          echo "=========================================="
          echo "ANDROID ENVIRONMENT"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "JAVA_HOME=$JAVA_HOME"

          # Buildozer-কে GitHub Actions-এর Android SDK ব্যবহার করতে বলা
          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "ANDROIDAPI=35" >> "$GITHUB_ENV"

          echo "ANDROIDMINAPI=23" >> "$GITHUB_ENV"

          echo "ANDROIDNDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"


      # ==========================================
      # ১২. Buildozer Android Debug APK Build
      # ==========================================
      - name: APK Build
        run: |

          echo "=========================================="
          echo "BUILDING V16 ANTIVIRUS APK"
          echo "=========================================="

          buildozer -v android debug


      # ==========================================
      # ১৩. APK তৈরি হয়েছে কি না পরীক্ষা
      # ==========================================
      - name: APK পরীক্ষা
        if: always()
        run: |

          echo
          echo "=========================================="
          echo "GENERATED APK"
          echo "=========================================="

          if ls bin/*.apk >/dev/null 2>&1; then

            echo "APK সফলভাবে তৈরি হয়েছে।"

            ls -lh bin/*.apk

          else

            echo "ERROR: APK তৈরি হয়নি।"

            echo
            echo "Project-এর মধ্যে APK খোঁজা হচ্ছে..."

            find . \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print

            exit 1

          fi


      # ==========================================
      # ১৪. APK GitHub Artifact হিসেবে Upload
      # ==========================================
      - name: APK Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: bin/*.apk
          if-no-files-found: error
