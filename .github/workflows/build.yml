name: V16 Antivirus APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      ANDROID_NDK: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.2.13676358

      ANDROIDAPI: "35"
      ANDROIDMINAPI: "23"

    steps:

      # ============================================================
      # 01 — CHECKOUT
      # ============================================================

      - name: Checkout Source
        uses: actions/checkout@v4


      # ============================================================
      # 02 — SETUP PYTHON 3.11
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 03 — SETUP JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 04 — VERIFY ANDROID SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_HOME"

          echo
          echo "SDK directory:"
          ls -ld "$ANDROID_HOME"

          echo
          echo "SDK command line tools:"
          ls -ld "$ANDROID_HOME/cmdline-tools/latest" || true

          echo
          echo "Build tools:"
          ls -ld "$ANDROID_HOME/build-tools/35.0.0" || true

          echo
          echo "Platform:"
          ls -ld "$ANDROID_HOME/platforms/android-35" || true


      # ============================================================
      # 05 — VERIFY NDK 28.2
      # ============================================================

      - name: Verify NDK 28.2
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_NDK"

          echo "=========================================="
          echo "ANDROID NDK"
          echo "=========================================="

          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"

          test -d "$NDK"
          test -f "$NDK/source.properties"

          echo
          echo "NDK directory:"
          ls -ld "$NDK"

          echo
          echo "NDK VERSION:"
          grep "Pkg.Revision" "$NDK/source.properties"

          grep -q "28.2.13676358" "$NDK/source.properties"


      # ============================================================
      # 06 — FORCE NDK PATH
      # ============================================================

      - name: Force Android NDK Environment
        shell: bash
        run: |
          set -e

          SDK="/usr/local/lib/android/sdk"
          NDK="$SDK/ndk/28.2.13676358"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"

          echo "Forced NDK:"
          echo "$NDK"


      # ============================================================
      # 07 — INSTALL SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install System Dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev


      # ============================================================
      # 08 — INSTALL PYTHON BUILD DEPENDENCIES
      # ============================================================

      - name: Install Python Build Dependencies
        shell: bash
        run: |
          set -e

          python --version

          python -m pip install --upgrade pip

          python -m pip install \
            "buildozer==1.5.0" \
            "cython==0.29.34" \
            "setuptools<81" \
            wheel


      # ============================================================
      # 09 — VERIFY BUILDOZER
      # ============================================================

      - name: Verify Buildozer
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PYTHON / BUILDOZER"
          echo "=========================================="

          python --version
          python -m buildozer --version


      # ============================================================
      # 10 — CHECK BUILDOZER SPEC
      # ============================================================

      - name: Check Buildozer Spec
        shell: bash
        run: |
          set -e

          test -f buildozer.spec

          echo "=========================================="
          echo "BUILDOZER SPEC"
          echo "=========================================="

          cat buildozer.spec


      # ============================================================
      # 11 — REMOVE OLD P4A OVERRIDES
      # ============================================================

      - name: Configure P4A
        shell: bash
        run: |
          set -e

          sed -i \
            '/^[[:space:]]*p4a\.branch[[:space:]]*=/d' \
            buildozer.spec || true

          sed -i \
            '/^[[:space:]]*p4a\.commit[[:space:]]*=/d' \
            buildozer.spec || true

          echo "" >> buildozer.spec
          echo "p4a.branch = develop" >> buildozer.spec

          echo
          echo "P4A configuration:"
          grep -E '^p4a\.(branch|commit)' buildozer.spec || true


      # ============================================================
      # 12 — REMOVE OLD BUILD CACHE
      # ============================================================

      - name: Clean Build Cache
        shell: bash
        run: |
          set -e

          echo "Cleaning old Buildozer cache..."

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin


      # ============================================================
      # 13 — FINAL NDK ENVIRONMENT CHECK
      # ============================================================

      - name: Final NDK Check
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FINAL NDK CHECK"
          echo "=========================================="

          echo "ANDROID_NDK:"
          echo "$ANDROID_NDK"

          echo
          echo "ANDROID_NDK_HOME:"
          echo "$ANDROID_NDK_HOME"

          echo
          echo "ANDROID_NDK_ROOT:"
          echo "$ANDROID_NDK_ROOT"

          test "$ANDROID_NDK" = \
            "/usr/local/lib/android/sdk/ndk/28.2.13676358"

          test "$ANDROID_NDK_HOME" = \
            "/usr/local/lib/android/sdk/ndk/28.2.13676358"

          test "$ANDROID_NDK_ROOT" = \
            "/usr/local/lib/android/sdk/ndk/28.2.13676358"

          echo
          echo "NDK VERSION:"
          grep "Pkg.Revision" \
            "$ANDROID_NDK/source.properties"


      # ============================================================
      # 14 — FINAL JAVA CHECK
      # ============================================================

      - name: Final Java Check
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version
          javac -version


      # ============================================================
      # 15 — FINAL SDK CHECK
      # ============================================================

      - name: Final SDK Check
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK CHECK"
          echo "=========================================="

          echo "SDK:"
          echo "$ANDROID_HOME"

          echo
          echo "Available build tools:"
          ls "$ANDROID_HOME/build-tools/" || true

          echo
          echo "Available platforms:"
          ls "$ANDROID_HOME/platforms/" || true


      # ============================================================
      # 16 — BUILD APK
      # ============================================================

      - name: Build APK
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

          ANDROID_NDK: /usr/local/lib/android/sdk/ndk/28.2.13676358
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.2.13676358

          ANDROIDAPI: "35"
          ANDROIDMINAPI: "23"

        run: |
          set -o pipefail

          echo "=========================================="
          echo "STARTING APK BUILD"
          echo "=========================================="

          echo
          echo "Python:"
          python --version

          echo
          echo "Buildozer:"
          python -m buildozer --version

          echo
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo
          echo "ANDROID_NDK:"
          echo "$ANDROID_NDK"

          echo
          echo "NDK VERSION:"
          grep "Pkg.Revision" \
            "$ANDROID_NDK/source.properties"

          echo
          echo "=========================================="
          echo "BUILDOZER BUILD"
          echo "=========================================="

          python -m buildozer -v android debug


      # ============================================================
      # 17 — FIND APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "APK VERIFICATION"
          echo "=========================================="

          echo
          echo "Searching for APK..."

          find . -type f -name "*.apk" -print

          if ! compgen -G "bin/*.apk" > /dev/null; then
            echo
            echo "ERROR: APK NOT FOUND"
            exit 1
          fi

          echo
          echo "APK FOUND:"
          ls -lh bin/*.apk


      # ============================================================
      # 18 — UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-Pro-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30     
      - name: Build Summary
        if: success()
        run: |
          echo "=========================================="
          echo "APK BUILD SUCCESSFUL"
          echo "=========================================="
          echo "APK files:"
          ls -lh bin/*.apk
