name: V16 Antivirus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: 01 - Checkout source
        uses: actions/checkout@v4

      - name: 02 - Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 03 - Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 04 - Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 05 - Install Android SDK
        shell: bash
        run: |
          set -eux

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmdline-tools;latest" \
            "ndk;28.2.13676358"

      - name: 06 - Configure Android environment
        shell: bash
        run: |
          set -eux

          SDK="$ANDROID_HOME"
          NDK="$ANDROID_HOME/ndk/28.2.13676358"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "ANDROIDNDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          echo "ANDROIDAPI=35" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=24" >> "$GITHUB_ENV"
          echo "NDKAPI=24" >> "$GITHUB_ENV"

      - name: 07 - Verify Android environment
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "ANDROID ENVIRONMENT"
          echo "=========================================="

          python --version
          java -version
          sdkmanager --version

          echo
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK=$ANDROID_NDK"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -d "$ANDROID_HOME/ndk/28.2.13676358"

          echo
          echo "NDK VERSION:"
          grep "Pkg.Revision" \
            "$ANDROID_HOME/ndk/28.2.13676358/source.properties"

      - name: 08 - Install Buildozer
        shell: bash
        run: |
          set -eux

          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            setuptools \
            wheel \
            "cython==0.29.34"

      - name: 09 - Verify project
        shell: bash
        run: |
          set -eux

          test -f main.py
          test -f buildozer.spec

          echo "main.py: OK"
          echo "buildozer.spec: OK"

      - name: 10 - Show configuration
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "BUILDOZER SPEC"
          echo "=========================================="

          cat buildozer.spec

      - name: 11 - Clean previous build
        shell: bash
        run: |
          set -eux

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

      - name: 12 - Build APK
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_CACHE_DIR: "1"
        run: |
          set -eux

          echo "=========================================="
          echo "V16 ANTIVIRUS APK BUILD"
          echo "=========================================="

          echo "Python:"
          python --version

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo
          echo "Android NDK:"
          echo "$ANDROID_NDK"

          echo
          echo "=========================================="
          echo "STARTING BUILD"
          echo "=========================================="

          buildozer -v android debug

      - name: 13 - Verify APK
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "APK RESULT"
          echo "=========================================="

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo
          echo "APK FOUND:"
          echo "$APK"

          ls -lh "$APK"

      - name: 14 - Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-Pro-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
