name: V16 Antivirus APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build V16 Antivirus Pro
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install buildozer cython

      - name: Verify project
        run: |
          echo "=============================="
          echo "PROJECT FILES"
          echo "=============================="

          find . -maxdepth 3 -type f | sort

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Checking buildozer.spec..."
          test -f buildozer.spec

          echo ""
          echo "Checking main.py..."
          test -f main.py

      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show build error
        if: failure()
        run: |
          echo "========================================"
          echo "LAST 100 LINES OF BUILD LOG"
          echo "========================================"

          if [ -f build.log ]; then
            tail -n 100 build.log
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V16-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Find APK
        if: success()
        run: |
          echo "=============================="
          echo "GENERATED APK"
          echo "=============================="

          find bin -type f -name "*.apk" -print

          APK="$(find bin -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p release

          cp "$APK" \
            release/V16-Antivirus-Pro.apk

          ls -lh release/V16-Antivirus-Pro.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-Pro
          path: release/V16-Antivirus-Pro.apk
          if-no-files-found: error
          retention-days: 30
