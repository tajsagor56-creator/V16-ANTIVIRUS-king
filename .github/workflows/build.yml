name: V16 Antivirus APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # ১. Repository Checkout
      # ==========================================
      - name: Repository Checkout
        uses: actions/checkout@v5


      # ==========================================
      # ২. Python Setup
      # ==========================================
      - name: Python Setup
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ==========================================
      # ৩. Java Setup
      # ==========================================
      - name: Java Setup
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"


      # ==========================================
      # ৪. Linux Package
      # ==========================================
      - name: Linux Package ইনস্টল
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake


      # ==========================================
      # ৫. Python Build Package
      # ==========================================
      - name: Buildozer ইনস্টল
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37


      # ==========================================
      # ৬. Project Check
      # ==========================================
      - name: Project পরীক্ষা
        run: |
          echo "=========================================="
          echo "V16 ANTIVIRUS"
          echo "=========================================="

          echo
          echo "Python:"
          python --version

          echo
          echo "Java:"
          java -version

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "Project Files:"
          ls -la


      # ==========================================
      # ৭. main.py Syntax Check
      # ==========================================
      - name: Python Syntax পরীক্ষা
        run: |
          python -m py_compile main.py

          echo
          echo "main.py syntax ঠিক আছে"


            # ==========================================
      # ৮. Android SDK প্রস্তুতি
      # ==========================================
      - name: Android SDK প্রস্তুতি
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK প্রস্তুতি"
          echo "=========================================="

          SDK_ROOT="/usr/local/lib/android/sdk"

          echo "SDK ROOT:"
          echo "$SDK_ROOT"

          echo
          echo "sdkmanager পরীক্ষা..."

          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "ERROR: sdkmanager পাওয়া যায়নি।"
            find "$SDK_ROOT" -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "sdkmanager পাওয়া গেছে:"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version

          echo
          echo "Android SDK environment সেট করা হচ্ছে..."

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo
          echo "SDK environment প্রস্তুত হয়েছে।"


      # ==========================================
      # ৯. প্রয়োজনীয় Android Components ইনস্টল
      # ==========================================
      - name: Android Components ইনস্টল
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID COMPONENTS"
          echo "=========================================="

          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "sdkmanager:"
          echo "$SDKMANAGER"

          echo
          echo "Android SDK licenses গ্রহণ..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo
          echo "প্রয়োজনীয় Android packages ইনস্টল..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo
          echo "Installed Build-Tools:"
          ls -la "$SDK_ROOT/build-tools"

          echo
          echo "Installed Platforms:"
          ls -la "$SDK_ROOT/platforms"

          echo
          echo "sdkmanager পরীক্ষা:"
          "$SDKMANAGER" --version


      # ==========================================
      # ১০. Android SDK যাচাই
      # ==========================================
      - name: Android SDK যাচাই
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK যাচাই"
          echo "=========================================="

          SDK_ROOT="/usr/local/lib/android/sdk"

          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo
          echo "ANDROIDSDK:"
          echo "$ANDROIDSDK"

          echo
          echo "sdkmanager:"
          command -v sdkmanager

          echo
          echo "sdkmanager version:"
          sdkmanager --version

          echo
          echo "Build-Tools:"
          ls -la "$SDK_ROOT/build-tools"

          echo
          echo "AIDL:"
          find "$SDK_ROOT/build-tools" \
            -type f \
            -name aidl \
            -print

          echo
          echo "Platform:"
          ls -la "$SDK_ROOT/platforms/android-35"

          echo
          echo "SDK যাচাই সফল হয়েছে।"


      # ==========================================
      # ১১. Buildozer APK Build
      # ==========================================
      - name: APK তৈরি
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "V16 ANTIVIRUS APK BUILD"
          echo "=========================================="

          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          export ANDROIDSDK="/usr/local/lib/android/sdk"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo
          echo "sdkmanager:"
          command -v sdkmanager

          echo
          echo "Buildozer শুরু হচ্ছে..."

          buildozer -v android debug


      # ==========================================
      # ১২. APK পরীক্ষা
      # ==========================================
      - name: APK পরীক্ষা
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "GENERATED APK"
          echo "=========================================="

          if find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | grep -q ".apk"; then

            echo "APK সফলভাবে তৈরি হয়েছে।"

            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -exec ls -lh {} \;

          else

            echo "ERROR: APK তৈরি হয়নি।"

            echo
            echo "APK খোঁজা হচ্ছে..."

            find . \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print || true

            exit 1
          fi


      # ==========================================
      # ১৩. APK Upload
      # ==========================================
      - name: APK Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: "bin/*.apk"
          if-no-files-found: error
