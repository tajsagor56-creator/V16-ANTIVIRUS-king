name: V16 Antivirus APK Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # ১. Repository Checkout
      # ==========================================
      - name: Repository Checkout
        uses: actions/checkout@v4


      # ==========================================
      # ২. Python 3.11 সেটআপ
      # ==========================================
      - name: Python সেটআপ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # ৩. Java 17 সেটআপ
      # ==========================================
      - name: Java সেটআপ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # ৪. Linux Package ইনস্টল
      # ==========================================
      - name: প্রয়োজনীয় Package ইনস্টল
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake


      # ==========================================
      # ৫. Buildozer ইনস্টল
      # ==========================================
      - name: Buildozer ইনস্টল
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37


      # ==========================================
      # ৬. Project পরীক্ষা
      # ==========================================
      - name: Project পরীক্ষা
        run: |

          echo "=========================================="
          echo "PROJECT FILES"
          echo "=========================================="

          ls -la

          echo
          echo "=========================================="
          echo "PYTHON"
          echo "=========================================="

          python --version

          echo
          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          echo
          echo "=========================================="
          echo "BUILDOZER"
          echo "=========================================="

          buildozer --version


      # ==========================================
      # ৭. main.py Syntax পরীক্ষা
      # ==========================================
      - name: Python Syntax পরীক্ষা
        run: |

          python -m py_compile main.py

          echo
          echo "=========================================="
          echo "main.py SYNTAX OK"
          echo "=========================================="


      # ==========================================
      # ৮. GitHub Android SDK অবস্থান পরীক্ষা
      # ==========================================
      - name: Android SDK খোঁজা
        run: |

          echo "=========================================="
          echo "ANDROID SDK খোঁজা হচ্ছে"
          echo "=========================================="

          echo "ANDROID_HOME:"
          echo "${ANDROID_HOME:-নির্ধারিত নয়}"

          echo
          echo "ANDROID_SDK_ROOT:"
          echo "${ANDROID_SDK_ROOT:-নির্ধারিত নয়}"

          echo
          echo "সম্ভাব্য SDK খোঁজা হচ্ছে..."

          find /usr/local/lib/android/sdk \
            -type f \
            -name sdkmanager \
            -print 2>/dev/null || true

          echo
          echo "SDK directory:"

          ls -la /usr/local/lib/android/sdk 2>/dev/null || true


      # ==========================================
      # ৯. Buildozer-এর Android SDK প্রস্তুত
      # ==========================================
      - name: Buildozer SDK প্রস্তুতি
        run: |

          echo "=========================================="
          echo "BUILDOZER SDK প্রস্তুতি"
          echo "=========================================="

          BUILD_SDK="$HOME/.buildozer/android/platform/android-sdk"
          SYSTEM_SDK="/usr/local/lib/android/sdk"

          echo "Buildozer SDK:"
          echo "$BUILD_SDK"

          echo "System SDK:"
          echo "$SYSTEM_SDK"

          # Buildozer SDK directory তৈরি
          mkdir -p "$BUILD_SDK"

          # System SDK থেকে প্রয়োজনীয় directory link করা
          if [ -d "$SYSTEM_SDK/platform-tools" ]; then
            ln -sfn \
              "$SYSTEM_SDK/platform-tools" \
              "$BUILD_SDK/platform-tools"
          fi

          if [ -d "$SYSTEM_SDK/platforms" ]; then
            ln -sfn \
              "$SYSTEM_SDK/platforms" \
              "$BUILD_SDK/platforms"
          fi

          if [ -d "$SYSTEM_SDK/build-tools" ]; then
            ln -sfn \
              "$SYSTEM_SDK/build-tools" \
              "$BUILD_SDK/build-tools"
          fi

          if [ -d "$SYSTEM_SDK/cmdline-tools" ]; then
            ln -sfn \
              "$SYSTEM_SDK/cmdline-tools" \
              "$BUILD_SDK/cmdline-tools"
          fi

          echo
          echo "Buildozer SDK contents:"

          ls -la "$BUILD_SDK"


      # ==========================================
      # ১০. Android SDK License প্রস্তুত
      # ==========================================
      - name: Android License প্রস্তুতি
        run: |

          echo "=========================================="
          echo "ANDROID LICENSE"
          echo "=========================================="

          BUILD_SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$BUILD_SDK/licenses"

          touch "$BUILD_SDK/licenses/android-sdk-license"

          echo "Android SDK license directory প্রস্তুত।"

          ls -la "$BUILD_SDK/licenses"


      # ==========================================
      # ১১. পুরোনো Build পরিষ্কার
      # ==========================================
      - name: Build পরিষ্কার
        run: |

          echo "=========================================="
          echo "BUILD CLEAN"
          echo "=========================================="

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin


      # ==========================================
      # ১২. APK তৈরি
      # ==========================================
      - name: APK তৈরি
        run: |

          echo "=========================================="
          echo "V16 ANTIVIRUS APK BUILD"
          echo "=========================================="

          buildozer -v android debug


      # ==========================================
      # ১৩. APK পরীক্ষা
      # ==========================================
      - name: APK পরীক্ষা
        if: always()
        run: |

          echo
          echo "=========================================="
          echo "GENERATED APK"
          echo "=========================================="

          if [ -d bin ] && \
             find bin \
             -maxdepth 1 \
             -type f \
             -name "*.apk" \
             | grep -q ".apk"; then

            echo "APK সফলভাবে তৈরি হয়েছে।"

            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -exec ls -lh {} \;

          else

            echo "ERROR: APK তৈরি হয়নি।"

            echo
            echo "APK খোঁজা হচ্ছে..."

            find . \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print || true

            exit 1

          fi


      # ==========================================
      # ১৪. APK Upload
      # ==========================================
      - name: APK Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: bin/*.apk
          if-no-files-found: error
