name: Build V16 Antivirus APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build V16 Antivirus APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_API: "35"
      ANDROID_MINAPI: "24"
      ANDROID_NDK_VERSION: "27.3.13750724"
      ANDROID_BUILD_TOOLS: "35.0.0"
      PYTHON_VERSION: "3.11"

    steps:

      # =========================================================
      # 01. Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 02. Python 3.11
      # =========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip


      # =========================================================
      # 03. Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # 04. Show repository
      # =========================================================
      - name: Check repository files
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "REPOSITORY"
          echo "=========================================="

          pwd

          echo
          echo "Files:"
          find . -maxdepth 2 -type f | sort | head -300

          echo
          echo "Checking required files..."

          if [ ! -f "main.py" ]; then
            echo "ERROR: main.py পাওয়া যায়নি।"
            exit 1
          fi

          if [ ! -f "buildozer.spec" ]; then
            echo "ERROR: buildozer.spec পাওয়া যায়নি।"
            exit 1
          fi

          echo
          echo "main.py: OK"
          echo "buildozer.spec: OK"


      # =========================================================
      # 05. Install Buildozer dependencies
      # =========================================================
      - name: Install Build dependencies
        shell: bash
        run: |
          set -eux

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "buildozer>=1.5.0" \
            "cython<3" \
            virtualenv

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "Python:"
          python --version

          echo
          echo "Java:"
          java -version


      # =========================================================
      # 06. Android SDK environment
      # =========================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -eux

          SDK="/usr/local/lib/android/sdk"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK পাওয়া যায়নি:"
            echo "$SDK"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=$SDK/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/$ANDROID_BUILD_TOOLS" >> "$GITHUB_PATH"

          echo
          echo "ANDROID_HOME=$SDK"
          echo "ANDROID_NDK=$SDK/ndk/$ANDROID_NDK_VERSION"


      # =========================================================
      # 07. Check Android SDK
      # =========================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -eux

          SDK="$ANDROID_HOME"

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          echo
          echo "SDK:"
          ls -la "$SDK"

          echo
          echo "Build Tools:"
          ls -la "$SDK/build-tools" || true

          echo
          echo "Platforms:"
          ls -la "$SDK/platforms" || true

          echo
          echo "NDK:"
          ls -la "$SDK/ndk" || true


      # =========================================================
      # 08. Install Android components
      # =========================================================
      - name: Install Android SDK components
        shell: bash
        run: |
          set -eux

          SDK="$ANDROID_HOME"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager পাওয়া যায়নি:"
            echo "$SDKMANAGER"
            exit 1
          fi

          echo "=========================================="
          echo "ANDROID COMPONENTS"
          echo "=========================================="

          echo
          echo "Accepting licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo
          echo "Installing required components..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.3.13750724"

          echo
          echo "Checking components..."

          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"
          test -x "$SDK/build-tools/35.0.0/aidl"
          test -d "$SDK/ndk/27.3.13750724"

          echo
          echo "AIDL:"
          "$SDK/build-tools/35.0.0/aidl" --version || true

          echo
          echo "Android SDK components: OK"


      # =========================================================
      # 09. Show Buildozer configuration
      # =========================================================
      - name: Check Buildozer configuration
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "BUILDOZER CONFIGURATION"
          echo "=========================================="

          sed -n '1,260p' buildozer.spec


      # =========================================================
      # 10. Clean old Buildozer files
      # =========================================================
      - name: Clean Buildozer cache
        shell: bash
        run: |
          set -eux

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin
          mkdir -p build-logs

          echo "Old Buildozer files removed."


      # =========================================================
      # 11. Build APK
      # =========================================================
      - name: Build V16 Antivirus APK
        shell: bash
        run: |
          set -o pipefail

          echo "=========================================="
          echo "V16 ANTIVIRUS APK BUILD"
          echo "=========================================="

          mkdir -p build-logs

          echo
          echo "Build started..."

          buildozer -v android debug 2>&1 | tee build-logs/buildozer-full.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo
          echo "Buildozer exit code: $BUILD_EXIT"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo
            echo "=========================================="
            echo "BUILD FAILED"
            echo "=========================================="

            exit "$BUILD_EXIT"
          fi

          echo
          echo "=========================================="
          echo "BUILD COMMAND FINISHED"
          echo "=========================================="


      # =========================================================
      # 12. Find APK
      # =========================================================
      - name: Find generated APK
        if: always()
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "SEARCHING FOR APK"
          echo "=========================================="

          mkdir -p build-logs

          echo
          echo "bin directory:"
          ls -lah bin 2>&1 || true

          echo
          echo "APK files:"
          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -not -path "./.git/*" \
            -print 2>&1 | tee build-logs/apk-files.txt

          APK_COUNT=$(find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*" \
            2>/dev/null | wc -l)

          echo
          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -gt 0 ]; then
            echo
            echo "=========================================="
            echo "APK FOUND"
            echo "=========================================="

            find . \
              -type f \
              -name "*.apk" \
              -not -path "./.git/*" \
              -print
          else
            echo
            echo "NO APK FOUND"
          fi


      # =========================================================
      # 13. Save Buildozer diagnostic logs
      # =========================================================
      - name: Collect Buildozer logs
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p build-logs

          echo "=========================================="
          echo "COLLECTING BUILD LOGS"
          echo "=========================================="

          if [ -d ".buildozer" ]; then

            echo
            echo "Buildozer directory exists."

            find .buildozer \
              -type f \
              \( \
                -name "*.log" \
                -o -name "*.txt" \
                -o -name "*.json" \
              \) \
              -print > build-logs/buildozer-files.txt 2>&1 || true

          else

            echo "No .buildozer directory."

          fi

          echo
          echo "=========================================="
          echo "IMPORTANT ENVIRONMENT"
          echo "=========================================="

          {
            echo "Python:"
            python --version

            echo
            echo "Buildozer:"
            buildozer --version

            echo
            echo "Java:"
            java -version 2>&1

            echo
            echo "ANDROID_HOME:"
            echo "$ANDROID_HOME"

            echo
            echo "ANDROID_NDK_HOME:"
            echo "$ANDROID_NDK_HOME"

            echo
            echo "SDK:"
            ls -la "$ANDROID_HOME" || true

            echo
            echo "Build Tools:"
            ls -la "$ANDROID_HOME/build-tools" || true

            echo
            echo "Platforms:"
            ls -la "$ANDROID_HOME/platforms" || true

            echo
            echo "NDK:"
            ls -la "$ANDROID_HOME/ndk" || true

          } > build-logs/environment.txt 2>&1

          echo
          echo "Collected logs."


      # =========================================================
      # 14. Upload full Buildozer logs
      # =========================================================
      - name: Upload Buildozer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Buildozer-Full-Logs
          path: |
            build-logs/**
            .buildozer/android/platform/python-for-android/**
          if-no-files-found: warn
          retention-days: 14


      # =========================================================
      # 15. Upload APK
      # =========================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: |
            bin/*.apk
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # 16. Final result
      # =========================================================
      - name: Final build result
        if: always()
        shell: bash
        run: |
          echo
          echo "=========================================="
          echo "FINAL BUILD RESULT"
          echo "=========================================="

          if find bin -maxdepth 1 -type f -name "*.apk" | grep -q .; then

            echo
            echo "SUCCESS: APK তৈরি হয়েছে।"

            echo
            echo "APK:"
            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -exec ls -lh {} \;

          else

            echo
            echo "FAILED: APK তৈরি হয়নি।"
            echo
            echo "Build logs artifact থেকে buildozer-full.log দেখুন."

            exit 1

          fi
