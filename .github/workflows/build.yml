name: V16 Antivirus APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # 3. Java 17
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 4. System packages
      # ==========================================
      - name: Install System Packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake


      # ==========================================
      # 5. Python build packages
      # ==========================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37 \
            virtualenv


      # ==========================================
      # 6. Check environment
      # ==========================================
      - name: Check Environment
        run: |
          echo "=============================="
          echo "PYTHON"
          echo "=============================="
          python --version

          echo
          echo "=============================="
          echo "JAVA"
          echo "=============================="
          java -version

          echo
          echo "=============================="
          echo "BUILDOZER"
          echo "=============================="
          buildozer --version

          echo
          echo "=============================="
          echo "PROJECT FILES"
          echo "=============================="
          ls -la


      # ==========================================
      # 7. Validate Python
      # ==========================================
      - name: Validate main.py
        run: |
          python -m py_compile main.py

          echo "=============================="
          echo "main.py syntax OK"
          echo "=============================="


      # ==========================================
      # 8. Clean previous build
      # ==========================================
      - name: Clean Build
        run: |
          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin


      # ==========================================
      # 9. Preinstall Android SDK
      # ==========================================
      - name: Prepare Android SDK
        run: |
          set -e

          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          echo "=============================="
          echo "ANDROID SDK PREPARATION"
          echo "=============================="

          mkdir -p "$SDK_ROOT"


          # ------------------------------------------
          # Install command line tools
          # ------------------------------------------

          CMDLINE_URL="https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"

          mkdir -p "$HOME/android-cmdline-tools"

          curl -L \
            "$CMDLINE_URL" \
            -o "$HOME/cmdline-tools.zip"

          rm -rf "$HOME/android-cmdline-tools/latest"

          mkdir -p "$HOME/android-cmdline-tools/latest"

          unzip -q \
            "$HOME/cmdline-tools.zip" \
            -d "$HOME/android-cmdline-tools/latest"

          if [ -d "$HOME/android-cmdline-tools/latest/cmdline-tools" ]; then
            mv \
              "$HOME/android-cmdline-tools/latest/cmdline-tools/"* \
              "$HOME/android-cmdline-tools/latest/

            rm -rf \
              "$HOME/android-cmdline-tools/latest/cmdline-tools"
          fi


          # ------------------------------------------
          # Copy SDK command line tools
          # ------------------------------------------

          mkdir -p "$SDK_ROOT/cmdline-tools"

          rm -rf "$SDK_ROOT/cmdline-tools/latest"

          cp -r \
            "$HOME/android-cmdline-tools/latest" \
            "$SDK_ROOT/cmdline-tools/latest"


          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"


          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$SDK_ROOT" -name sdkmanager -print
            exit 1
          fi

          chmod +x "$SDKMANAGER"


          # ------------------------------------------
          # Android licenses
          # ------------------------------------------

          mkdir -p "$SDK_ROOT/licenses"

          printf '%s\n' \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            > "$SDK_ROOT/licenses/android-sdk-license"


          # ------------------------------------------
          # Accept Android SDK licenses
          # ------------------------------------------

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses || true
          # ------------------------------------------
          # Accept licenses
          # ------------------------------------------

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses || true


          # ------------------------------------------
          # Install SDK packages
          # ------------------------------------------

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "build-tools;37.0.0"


          # ------------------------------------------
          # Verify Build Tools
          # ------------------------------------------

          echo
          echo "=============================="
          echo "INSTALLED BUILD TOOLS"
          echo "=============================="

          ls -la "$SDK_ROOT/build-tools" || true


          # ------------------------------------------
          # Verify AIDL
          # ------------------------------------------

          echo
          echo "=============================="
          echo "SEARCHING FOR AIDL"
          echo "=============================="

          find "$SDK_ROOT/build-tools" \
            -type f \
            -name aidl \
            -print


          AIDL_PATH="$(find "$SDK_ROOT/build-tools" \
            -type f \
            -name aidl \
            | sort -V \
            | tail -n 1)"


          if [ -z "$AIDL_PATH" ]; then
            echo "ERROR: AIDL NOT FOUND"
            exit 1
          fi


          echo
          echo "AIDL FOUND:"
          echo "$AIDL_PATH"

          chmod +x "$AIDL_PATH"


          # ------------------------------------------
          # Export SDK variables
          # ------------------------------------------

          echo "ANDROIDSDK=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"


      # ==========================================
      # 10. Build APK
      # ==========================================
      - name: Build APK
        run: |
          set -e

          echo "=============================="
          echo "STARTING BUILDOZER BUILD"
          echo "=============================="

          buildozer -v android debug


      # ==========================================
      # 11. Check APK
      # ==========================================
      - name: Check Generated APK
        if: always()
        run: |
          echo "=============================="
          echo "GENERATED APK"
          echo "=============================="

          if ls bin/*.apk >/dev/null 2>&1; then

            echo "APK FOUND:"
            ls -lh bin/*.apk

          else

            echo "ERROR: APK WAS NOT GENERATED"

            echo
            echo "Searching entire project..."

            find . \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print

            exit 1

          fi


      # ==========================================
      # 12. Upload APK
      # ==========================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: bin/*.apk
          if-no-files-found: error


      # ==========================================
      # 13. Upload build log
      # ==========================================
      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V16-build-log
          path: |
            .buildozer/**/*.log
            .buildozer/**/*.txt
          if-no-files-found: ignore
