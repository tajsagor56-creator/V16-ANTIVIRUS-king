name: V16 Antivirus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout source
        uses: actions/checkout@v4


      # ======================================================
      # 2. PYTHON 3.11
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # 3. JAVA 17
      # ======================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ======================================================
      # 4. ANDROID SDK
      # ======================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ======================================================
      # 5. INSTALL SDK + NDK
      # ======================================================

      - name: Install Android components
        run: |

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmdline-tools;latest" \
            "ndk;28.2.13676358"

          yes | sdkmanager --licenses || true


      # ======================================================
      # 6. ANDROID ENVIRONMENT
      # ======================================================

      - name: Configure Android environment
        run: |

          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

          echo "ANDROID_NDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

          echo "ANDROIDNDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"


      # ======================================================
      # 7. VERIFY ANDROID
      # ======================================================

      - name: Verify Android environment
        run: |

          echo "=========================================="
          echo "ANDROID ENVIRONMENT"
          echo "=========================================="

          echo "SDK:"
          echo "$ANDROID_HOME"

          echo

          echo "SDKMANAGER:"
          which sdkmanager
          sdkmanager --version

          echo

          echo "JAVA:"
          java -version

          echo

          echo "PYTHON:"
          python --version

          echo

          echo "NDK:"
          test -f "$ANDROID_NDK_HOME/source.properties"

          grep Pkg.Revision \
            "$ANDROID_NDK_HOME/source.properties"


      # ======================================================
      # 8. INSTALL BUILD TOOLS
      # ======================================================

      - name: Install Buildozer
        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.5.0 \
            cython==0.29.37


      # ======================================================
      # 9. VERIFY PROJECT
      # ======================================================

      - name: Verify project files
        run: |

          echo "=========================================="
          echo "PROJECT CHECK"
          echo "=========================================="

          test -f main.py
          test -f buildozer.spec

          echo "main.py       : OK"
          echo "buildozer.spec: OK"


      # ======================================================
      # 10. SHOW BUILDOZER CONFIG
      # ======================================================

      - name: Show Buildozer configuration
        run: |

          echo "=========================================="
          echo "BUILDOZER CONFIGURATION"
          echo "=========================================="

          grep -E \
            "^(title|package.name|package.domain|version|requirements|android.api|android.minapi|android.ndk|android.ndk_api)" \
            buildozer.spec || true


      # ======================================================
      # 11. CLEAN OLD BUILD
      # ======================================================

      - name: Clean old Buildozer files
        run: |

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin


      # ======================================================
      # 12. BUILD APK
      # ======================================================

      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ANDROIDNDK: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358

        run: |

          echo "=========================================="
          echo "STARTING V16 ANTIVIRUS BUILD"
          echo "=========================================="

          echo

          echo "Python:"
          python --version

          echo

          echo "Buildozer:"
          buildozer --version

          echo

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo

          echo "Android NDK:"
          echo "$ANDROID_NDK_HOME"

          echo

          echo "NDK VERSION:"
          grep Pkg.Revision \
            "$ANDROID_NDK_HOME/source.properties"

          echo

          echo "=========================================="
          echo "BUILDOZER DEBUG APK"
          echo "=========================================="

          buildozer -v android debug


      # ======================================================
      # 13. VERIFY APK
      # ======================================================

      - name: Verify APK
        run: |

          echo "=========================================="
          echo "APK RESULT"
          echo "=========================================="

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo
          echo "APK GENERATED SUCCESSFULLY"
          echo "Number of APK files: $APK_COUNT"


      # ======================================================
      # 14. UPLOAD APK
      # ======================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-Pro-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
