name: V16 Antivirus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # 01 - Checkout
      # =========================================================
      - name: 01 - Checkout source
        uses: actions/checkout@v4

      # =========================================================
      # 02 - Python
      # =========================================================
      - name: 02 - Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =========================================================
      # 03 - Java 17
      # =========================================================
      - name: 03 - Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 04 - Android SDK
      # =========================================================
      - name: 04 - Setup Android SDK
        uses: android-actions/setup-android@v3

      # =========================================================
      # 05 - Install Android SDK / NDK
      # =========================================================
      - name: 05 - Install Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmdline-tools;latest" \
            "ndk;28.2.13676358"

      # =========================================================
      # 06 - Configure Android Environment
      # =========================================================
      - name: 06 - Configure Android environment
        shell: bash
        run: |
          set -euxo pipefail

          SDK="${ANDROID_HOME}"
          NDK="${ANDROID_HOME}/ndk/28.2.13676358"

          echo "ANDROID_HOME=${SDK}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK}" >> "${GITHUB_ENV}"

          echo "ANDROIDNDK=${NDK}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK=${NDK}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_HOME=${NDK}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${NDK}" >> "${GITHUB_ENV}"

          echo "ANDROIDAPI=35" >> "${GITHUB_ENV}"
          echo "ANDROIDMINAPI=24" >> "${GITHUB_ENV}"
          echo "NDKAPI=24" >> "${GITHUB_ENV}"

          echo "PYTHONUNBUFFERED=1" >> "${GITHUB_ENV}"

      # =========================================================
      # 07 - Verify Environment
      # =========================================================
      - name: 07 - Verify Environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "BUILD ENVIRONMENT"
          echo "=========================================="

          echo
          echo "Python:"
          python --version
          python -m pip --version

          echo
          echo "Java:"
          java -version

          echo
          echo "SDK:"
          sdkmanager --version

          echo
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "ANDROID_NDK=${ANDROID_NDK}"
          echo "ANDROIDAPI=${ANDROIDAPI}"
          echo "ANDROIDMINAPI=${ANDROIDMINAPI}"
          echo "NDKAPI=${NDKAPI}"

          echo
          echo "NDK:"
          test -d "${ANDROID_NDK}"
          echo "NDK directory OK"

      # =========================================================
      # 08 - Install Build Dependencies
      # =========================================================
      - name: 08 - Install Build Dependencies
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install "pip<26" "setuptools<81" "wheel<1"

          python -m pip install \
            buildozer==1.6.0
          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "Pip:"
          python -m pip --version
          
      # =========================================================
      # 09 - Verify Project
      # =========================================================
      - name: 09 - Verify Project
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "VERIFY PROJECT"
          echo "=========================================="

          test -f main.py
          test -f buildozer.spec

          echo "main.py: OK"
          echo "buildozer.spec: OK"

          echo
          echo "=========================================="
          echo "BUILD SPEC"
          echo "=========================================="

          grep -E \
            '^(title|package.name|package.domain|version|requirements|orientation|android.api|android.minapi|android.ndk|android.ndk_api|android.archs|android.permissions|android.private_storage|android.allow_backup)' \
            buildozer.spec || true

      # =========================================================
      # 10 - Verify Buildozer
      # =========================================================
      - name: 10 - Verify Buildozer
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "BUILDOZER"
          echo "=========================================="

          buildozer --version

          echo
          echo "Buildozer location:"
          command -v buildozer

          echo
          echo "Python:"
          python --version

          echo
          echo "Pip:"
          python -m pip --version

      # =========================================================
      # 11 - Show Configuration
      # =========================================================
      - name: 11 - Show Configuration
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "CONFIGURATION"
          echo "=========================================="

          echo
          echo "Python:"
          python --version

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "Android SDK:"
          echo "${ANDROID_HOME}"

          echo
          echo "Android NDK:"
          echo "${ANDROID_NDK}"

          echo
          echo "Android API:"
          echo "${ANDROIDAPI}"

          echo
          echo "Minimum API:"
          echo "${ANDROIDMINAPI}"

          echo
          echo "=========================================="
          echo "REQUIREMENTS"
          echo "=========================================="

          grep '^requirements' buildozer.spec || true

          echo
          echo "=========================================="
          echo "ANDROID SETTINGS"
          echo "=========================================="

          grep -E \
            '^(android.api|android.minapi|android.ndk|android.ndk_api|android.archs)' \
            buildozer.spec || true

          echo
          echo "=========================================="
          echo "NDK CHECK"
          echo "=========================================="

          test -d "${ANDROID_NDK}"
          echo "NDK directory: OK"

          if [ -x "${ANDROID_NDK}/ndk-build" ]; then
            echo "ndk-build: OK"
          else
            echo "WARNING: ndk-build not found"
          fi

      # =========================================================
      # 12 - Clean Previous Build
      # =========================================================
      - name: 12 - Clean previous build
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "CLEAN BUILD"
          echo "=========================================="

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

          echo
          echo "Build cache cleaned."

          echo
          echo "Checking for stale build environments..."

          if [ -d ".buildozer" ]; then
            echo "ERROR: .buildozer still exists."
            exit 1
          fi

          echo ".buildozer: clean"
          echo "bin: ready
          
      # =========================================================
      # 13 - Build APK
      # =========================================================
      - name: 13 - Build APK
        shell: bash
        env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_CACHE_DIR: "1"
          PYTHONUNBUFFERED: "1"

         run: |
          set -euxo pipefail

          echo "=========================================="
          echo "V16 ANTIVIRUS APK BUILD"
          echo "=========================================="

          echo
          echo "Python:"
          python --version

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "Android SDK:"
          echo "${ANDROID_HOME}"

          echo
          echo "Android NDK:"
          echo "${ANDROID_NDK}"

          echo
          echo "Android API:"
          echo "${ANDROIDAPI}"

          echo
          echo "Minimum API:"
          echo "${ANDROIDMINAPI}"

          echo
          echo "=========================================="
          echo "SPEC REQUIREMENTS"
          echo "=========================================="

          grep -E \
          '^(requirements|android.api|android.minapi|android.ndk|android.ndk_api|android.archs)' \
           buildozer.spec || true

           echo
           echo "=========================================="
           echo "PIP COMPATIBILITY"
           echo "=========================================="

           export PIP_VERSION_CHECK=0
           export PIP_DISABLE_PIP_VERSION_CHECK=1

           echo
           echo "System pip:"
           python -m pip --version

           echo
           echo "=========================================="
           echo "STARTING BUILDOZER"
           echo "=========================================="

           buildozer -v android debug
           
     # =========================================================
      # 14 - Verify APK
      # =========================================================
      - name: 14 - Verify APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "APK RESULT"
          echo "=========================================="

          echo
          echo "Files in bin:"
          ls -lah bin || true

          echo
          echo "Searching for APK..."

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"

          if [ -z "${APK}" ]; then
            echo
            echo "ERROR: APK was not generated."
            echo
            echo "Contents of bin:"
            ls -lah bin || true
            exit 1
          fi

          echo
          echo "=========================================="
          echo "APK FOUND"
          echo "=========================================="

          echo "${APK}"

          echo
          echo "APK SIZE:"
          ls -lh "${APK}"

      # =========================================================
      # 15 - Upload APK
      # =========================================================
      - name: 15 - Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-Pro-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
