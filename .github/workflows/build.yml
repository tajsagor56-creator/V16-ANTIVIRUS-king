name: V16 Antivirus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout source
        uses: actions/checkout@v4


      # ======================================================
      # 2. PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # 3. JAVA
      # ======================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ======================================================
      # 4. ANDROID SDK
      # ======================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses


      # ======================================================
      # 5. INSTALL ANDROID COMPONENTS
      # ======================================================

      - name: Install Android SDK components
        run: |

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmdline-tools;latest"

          yes | sdkmanager --licenses || true


      # ======================================================
      # 6. FIX LEGACY SDKMANAGER PATH
      # ======================================================

      - name: Fix legacy sdkmanager path
        run: |

          mkdir -p "$ANDROID_HOME/tools/bin"

          ln -sf \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "$ANDROID_HOME/tools/bin" >> "$GITHUB_PATH"


      # ======================================================
      # 7. INSTALL NDK 28.2
      # ======================================================

      - name: Install Android NDK
        run: |

          sdkmanager \
            "ndk;28.2.13676358"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

          echo "ANDROID_NDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

          echo "ANDROIDNDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"


      # ======================================================
      # 8. VERIFY SDK / NDK
      # ======================================================

      - name: Verify Android environment
        run: |

          echo "=========================================="
          echo "ANDROID ENVIRONMENT"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          echo "ANDROID_NDK=$ANDROID_NDK"

          echo

          echo "SDKMANAGER:"
          which sdkmanager
          sdkmanager --version

          echo

          echo "JAVA:"
          java -version

          echo

          echo "PYTHON:"
          python --version

          echo

          echo "NDK:"
          test -f "$ANDROID_HOME/ndk/28.2.13676358/source.properties"

          grep Pkg.Revision \
            "$ANDROID_HOME/ndk/28.2.13676358/source.properties"


      # ======================================================
      # 9. INSTALL PYTHON BUILD PACKAGES
      # ======================================================

      - name: Install Buildozer
        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.5.0 \
            cython==0.29.37


      # ======================================================
      # 10. VERIFY BUILD CONFIG
      # ======================================================

      - name: Check project files
        run: |

          echo "=========================================="
          echo "PROJECT FILES"
          echo "=========================================="

          test -f main.py

          test -f buildozer.spec

          echo "main.py found"

          echo "buildozer.spec found"


      # ======================================================
      # 11. CLEAN OLD BUILDS
      # ======================================================

      - name: Clean Buildozer
        run: |

          rm -rf .buildozer

          rm -rf bin

          mkdir -p bin


      # ======================================================
      # 12. BUILD APK
      # ======================================================

      - name: Build APK
        run: |
          buildozer android debug

          echo "=========================================="
          echo "STARTING APK BUILD"
          echo "=========================================="

          echo

          echo "Python:"
          python --version

          echo

          echo "Buildozer:"
          python -m buildozer --version

          echo

          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo

          echo "ANDROID_NDK_HOME:"
          echo "$ANDROID_NDK_HOME"

          echo

          echo "NDK VERSION:"

          grep Pkg.Revision \
            "$ANDROID_NDK_HOME/source.properties"

          echo

          echo "=========================================="
          echo "BUILDOZER BUILD"
          echo "=========================================="

          python -m buildozer -v android debug


      # ======================================================
      # 13. SHOW APK
      # ======================================================

      - name: Show APK
        run: |

          echo "=========================================="
          echo "APK FILES"
          echo "=========================================="

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print


      # ======================================================
      # 14. UPLOAD APK
      # ======================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-Pro-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
