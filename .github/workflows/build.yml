name: V16 Antivirus APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build V16 Antivirus APK
    runs-on: ubuntu-22.04

    env:
      # ==========================================================
      # Python
      # ==========================================================
      PYTHON_VERSION: "3.11"

      # ==========================================================
      # Android SDK - GitHub Runner-এর preinstalled SDK
      # ==========================================================
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROIDSDK: /usr/local/lib/android/sdk

      # ==========================================================
      # Android NDK
      # ==========================================================
      ANDROID_NDK_VERSION: "27.3.13750724"
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.3.13750724
      ANDROID_NDK: /usr/local/lib/android/sdk/ndk/27.3.13750724

      # ==========================================================
      # Android API
      # ==========================================================
      ANDROIDAPI: "35"
      ANDROIDMINAPI: "24"

      # ==========================================================
      # Buildozer
      # ==========================================================
      BUILDOZER_WARN_ON_ROOT: "1"

      # ==========================================================
      # Prevent unnecessary pip cache problems
      # ==========================================================
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:

      # ==========================================================
      # 01. Checkout
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # ==========================================================
      # 02. Python 3.11
      # ==========================================================
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      # ==========================================================
      # 03. Java 17
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 04. Check project files
      # ==========================================================
      - name: Check project
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "PROJECT"
          echo "=========================================="

          pwd
          echo

          echo "Repository files:"
          find . -maxdepth 2 -type f | sort | head -200

          echo

          if [ ! -f "buildozer.spec" ]; then
            echo "ERROR: buildozer.spec পাওয়া যায়নি!"
            exit 1
          fi

          if [ ! -f "main.py" ]; then
            echo "ERROR: main.py পাওয়া যায়নি!"
            exit 1
          fi

          echo "buildozer.spec পাওয়া গেছে."
          echo "main.py পাওয়া গেছে."

      # ==========================================================
      # 05. Configure Android environment
      # ==========================================================
      - name: Configure Android environment
        shell: bash
        run: |
          set -eux

          SDK="/usr/local/lib/android/sdk"
          NDK="$SDK/ndk/27.3.13750724"

          echo "=========================================="
          echo "ANDROID ENVIRONMENT"
          echo "=========================================="

          test -d "$SDK"
          test -d "$NDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"

          echo
          echo "SDK:"
          echo "$SDK"

          echo
          echo "NDK:"
          echo "$NDK"

      # ==========================================================
      # 06. Locate sdkmanager
      # ==========================================================
      - name: Locate sdkmanager
        shell: bash
        run: |
          set -eux

          SDK="/usr/local/lib/android/sdk"

          echo "=========================================="
          echo "SDKMANAGER"
          echo "=========================================="

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/tools/bin/sdkmanager"
          else
            echo "ERROR: sdkmanager পাওয়া যায়নি!"
            find "$SDK" -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          "$SDKMANAGER" --version

      # ==========================================================
      # 07. Accept Android licenses
      # ==========================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -eux

          SDK="/usr/local/lib/android/sdk"

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/tools/bin/sdkmanager"
          else
            echo "ERROR: sdkmanager পাওয়া যায়নি!"
            exit 1
          fi

          echo "=========================================="
          echo "ANDROID LICENSES"
          echo "=========================================="

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses >/dev/null 2>&1 || true

          echo "Android SDK licenses processed."

      # ==========================================================
      # 08. Install ONLY required SDK components
      # ==========================================================
      - name: Install required Android components
        shell: bash
        run: |
          set -eux

          SDK="/usr/local/lib/android/sdk"

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/tools/bin/sdkmanager"
          else
            echo "ERROR: sdkmanager পাওয়া যায়নি!"
            exit 1
          fi

          echo "=========================================="
          echo "ANDROID SDK COMPONENTS"
          echo "=========================================="

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo
          echo "Required Android components installed."

      # ==========================================================
      # 09. Verify SDK / AIDL / Platform / NDK
      # ==========================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -eux

          SDK="/usr/local/lib/android/sdk"
          NDK="$SDK/ndk/27.3.13750724"

          echo "=========================================="
          echo "VERIFY ANDROID SDK"
          echo "=========================================="

          echo
          echo "SDK:"
          test -d "$SDK"
          echo "OK: $SDK"

          echo
          echo "Platform 35:"
          test -d "$SDK/platforms/android-35"
          echo "OK"

          echo
          echo "Build Tools:"
          test -d "$SDK/build-tools/35.0.0"
          echo "OK"

          echo
          echo "AIDL:"
          test -x "$SDK/build-tools/35.0.0/aidl"
          "$SDK/build-tools/35.0.0/aidl" --version || true

          echo
          echo "NDK:"
          test -d "$NDK"
          echo "OK: $NDK"

          echo
          echo "NDK version:"
          if [ -f "$NDK/source.properties" ]; then
            cat "$NDK/source.properties"
          fi

          echo
          echo "ADB:"
          "$SDK/platform-tools/adb" version

          echo
          echo "=========================================="
          echo "ANDROID ENVIRONMENT OK"
          echo "=========================================="

      # ==========================================================
      # 10. Install Python build dependencies
      # ==========================================================
      - name: Install Python build dependencies
        shell: bash
        run: |
          set -eux

          python --version
          python -m pip --version

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "buildozer>=1.5.0" \
            "cython<3.0" \
            virtualenv

      # ==========================================================
      # 11. Check Buildozer
      # ==========================================================
      - name: Check Buildozer
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "BUILDOZER"
          echo "=========================================="

          buildozer --version

          echo
          echo "Python:"
          python --version

          echo
          echo "Java:"
          java -version

          echo
          echo "Javac:"
          javac -version

      # ==========================================================
      # 12. Validate buildozer.spec
      # ==========================================================
      - name: Show buildozer.spec
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "BUILDOZER SPEC"
          echo "=========================================="

          sed -n '1,260p' buildozer.spec

      # ==========================================================
      # 13. Clean old Buildozer state
      # ==========================================================
      - name: Clean Buildozer state
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "CLEAN BUILDOZER STATE"
          echo "=========================================="

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin
          mkdir -p build-logs

          echo "Old build state removed."

      # ==========================================================
      # 14. Force Buildozer to use runner Android SDK/NDK
      # ==========================================================
      - name: Configure Buildozer Android paths
        shell: bash
        run: |
          set -eux

          SDK="/usr/local/lib/android/sdk"
          NDK="$SDK/ndk/27.3.13750724"

          echo "=========================================="
          echo "BUILDOZER ANDROID PATHS"
          echo "=========================================="

          mkdir -p "$HOME/.buildozer"

          cat > "$HOME/.buildozer/default.spec" <<EOF
          [buildozer]
          log_level = 2
          warn_on_root = 1

          [app]
          android.sdk_path = $SDK
          android.ndk_path = $NDK
          EOF

          echo
          echo "Buildozer default configuration:"
          cat "$HOME/.buildozer/default.spec"

      # ==========================================================
      # 15. Build APK
      # ==========================================================
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail

          mkdir -p build-logs
          mkdir -p bin

          echo "=========================================="
          echo "V16 ANTIVIRUS APK BUILD"
          echo "=========================================="

          echo
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"

          echo
          echo "Starting Buildozer..."

          buildozer -v android debug 2>&1 | tee \
            build-logs/buildozer-full.log

      # ==========================================================
      # 16. Find generated APK
      # ==========================================================
      - name: Find APK
        if: always()
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "GENERATED APK"
          echo "=========================================="

          echo
          echo "bin directory:"
          ls -lah bin || true

          echo
          echo "Searching APK files..."

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*" \
            -print 2>/dev/null || true

          APK="$(find bin -maxdepth 1 -type f -name "*.apk" 2>/dev/null | head -n 1)"

          if [ -n "$APK" ]; then
            echo
            echo "APK FOUND:"
            echo "$APK"

            mkdir -p apk-output
            cp "$APK" apk-output/V16-Antivirus.apk

            echo
            echo "APK copied to:"
            ls -lh apk-output/V16-Antivirus.apk

            echo "APK_FOUND=true" >> "$GITHUB_ENV"
          else
            echo
            echo "ERROR: APK তৈরি হয়নি।"
            echo "APK_FOUND=false" >> "$GITHUB_ENV"
          fi

      # ==========================================================
      # 17. Collect Buildozer logs
      # ==========================================================
      - name: Collect Buildozer logs
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p build-logs

          echo "=========================================="
          echo "COLLECTING BUILD LOGS"
          echo "=========================================="

          if [ -f build-logs/buildozer-full.log ]; then
            echo "Buildozer full log exists."
          fi

          find .buildozer \
            -type f \
            \( \
              -name "*.log" \
              -o -name "*.txt" \
              -o -name "*.out" \
              -o -name "*.err" \
            \) \
            -print 2>/dev/null \
            | head -500 > build-logs/build-files.txt

          echo
          echo "Build log files:"
          cat build-logs/build-files.txt || true

          echo
          echo "Last 200 lines of Buildozer log:"

          if [ -f build-logs/buildozer-full.log ]; then
            tail -n 200 build-logs/buildozer-full.log || true
          fi

      # ==========================================================
      # 18. Upload APK
      # ==========================================================
      - name: Upload APK artifact
        if: success() && env.APK_FOUND == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: apk-output/V16-Antivirus.apk
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # 19. Upload Buildozer logs
      # ==========================================================
      - name: Upload Buildozer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Buildozer-Full-Logs
          path: |
            build-logs/
          if-no-files-found: warn
          retention-days: 30

      # ==========================================================
      # 20. Upload complete Buildozer directory when failed
      # ==========================================================
      - name: Upload Buildozer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Buildozer-Diagnostics
          path: |
            .buildozer/android/platform/python-for-android/
            .buildozer/android/platform/build-*/build/
          if-no-files-found: warn
          retention-days: 7

      # ==========================================================
      # 21. Final result
      # ==========================================================
      - name: Final build result
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "FINAL BUILD RESULT"
          echo "=========================================="

          if [ -f "apk-output/V16-Antivirus.apk" ]; then
            echo
            echo "SUCCESS: APK তৈরি হয়েছে!"
            ls -lh apk-output/V16-Antivirus.apk
            echo
            echo "APK artifact: V16-Antivirus-APK"
          else
            echo
            echo "FAILED: APK তৈরি হয়নি।"
            echo
            echo "Build logs artifact: V16-Buildozer-Full-Logs"
            echo "Diagnostics artifact: V16-Buildozer-Diagnostics"
            exit 1
          fi
