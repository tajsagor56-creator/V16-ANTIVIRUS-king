name: V16 Antivirus APK Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # ১. Repository Checkout
      # ==========================================
      - name: Repository Checkout
        uses: actions/checkout@v5


      # ==========================================
      # ২. Python সেটআপ
      # ==========================================
      - name: Python Setup
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ==========================================
      # ৩. Java সেটআপ
      # ==========================================
      - name: Java Setup
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # ৪. Linux Package ইনস্টল
      # ==========================================
      - name: Linux Package ইনস্টল
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            curl \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev


      # ==========================================
      # ৫. Buildozer ইনস্টল
      # ==========================================
      - name: Buildozer ইনস্টল
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37


      # ==========================================
      # ৬. Project পরীক্ষা
      # ==========================================
      - name: Project পরীক্ষা
        run: |
          set -e

          echo "=========================================="
          echo "V16 ANTIVIRUS PROJECT"
          echo "=========================================="

          echo
          echo "Python:"
          python --version

          echo
          echo "Java:"
          java -version

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "Project Files:"
          ls -la


      # ==========================================
      # ৭. main.py Syntax পরীক্ষা
      # ==========================================
      - name: Python Syntax পরীক্ষা
        run: |
          set -e

          python -m py_compile main.py

          echo
          echo "main.py syntax ঠিক আছে।"


      # ==========================================
      # ৮. পুরোনো Build cache পরিষ্কার
      # ==========================================
      - name: Build Cache পরিষ্কার
        run: |
          set -e

          echo "=========================================="
          echo "BUILD CACHE CLEAN"
          echo "=========================================="

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

          echo "পুরোনো Build cache পরিষ্কার হয়েছে।"


      # ==========================================
      # ৯. GitHub Actions Android SDK শনাক্ত
      # ==========================================
      - name: Android SDK শনাক্ত
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK শনাক্ত"
          echo "=========================================="

          SDK_ROOT="/usr/local/lib/android/sdk"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK পাওয়া যায়নি।"
            exit 1
          fi

          echo "SDK ROOT:"
          echo "$SDK_ROOT"

          echo
          echo "sdkmanager খোঁজা হচ্ছে..."

          SDKMANAGER="$(find "$SDK_ROOT" \
            -type f \
            -name sdkmanager \
            -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager পাওয়া যায়নি।"
            exit 1
          fi

          echo "sdkmanager পাওয়া গেছে:"
          echo "$SDKMANAGER"

          echo
          echo "SDK directory পরীক্ষা:"
          ls -la "$SDK_ROOT"

          echo
          echo "Command line tools:"
          find "$SDK_ROOT/cmdline-tools" \
            -maxdepth 3 \
            -type f \
            -name sdkmanager \
            -print || true


      # ==========================================
      # ১০. Buildozer SDK Compatibility তৈরি
      # ==========================================
      - name: Buildozer SDK Compatibility
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDOZER SDK COMPATIBILITY"
          echo "=========================================="

          SDK_ROOT="/usr/local/lib/android/sdk"

          CMDLINE="$SDK_ROOT/cmdline-tools/latest/bin"

          if [ ! -f "$CMDLINE/sdkmanager" ]; then
            echo "ERROR: cmdline-tools-এর sdkmanager পাওয়া যায়নি।"
            exit 1
          fi

          echo
          echo "নতুন sdkmanager:"
          echo "$CMDLINE/sdkmanager"

          # ------------------------------------------
          # Buildozer পুরোনো SDK structure চায়
          # tools/bin/sdkmanager
          # ------------------------------------------

          sudo mkdir -p "$SDK_ROOT/tools/bin"

          # ------------------------------------------
          # sdkmanager compatibility link
          # ------------------------------------------

          sudo ln -sf \
            "$CMDLINE/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager"

          # ------------------------------------------
          # avdmanager compatibility link
          # ------------------------------------------

          if [ -f "$CMDLINE/avdmanager" ]; then
            sudo ln -sf \
              "$CMDLINE/avdmanager" \
              "$SDK_ROOT/tools/bin/avdmanager"
          fi

          # ------------------------------------------
          # sdkmanager executable পরীক্ষা
          # ------------------------------------------

          if [ ! -f "$SDK_ROOT/tools/bin/sdkmanager" ]; then
            echo "ERROR: compatibility sdkmanager তৈরি হয়নি।"
            exit 1
          fi

          echo
          echo "Buildozer compatibility path:"
          ls -la "$SDK_ROOT/tools/bin"

          echo
          echo "sdkmanager version:"
          "$SDK_ROOT/tools/bin/sdkmanager" --version


      # ==========================================
      # ১১. Android SDK Environment সেট করা
      # ==========================================
      - name: Android SDK Environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK ENVIRONMENT"
          echo "=========================================="

          SDK_ROOT="/usr/local/lib/android/sdk"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo
          echo "Android SDK environment প্রস্তুত হয়েছে।"


      # ==========================================
      # ১২. Android SDK License
      # ==========================================
      - name: Android SDK License প্রস্তুতি
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK LICENSE"
          echo "=========================================="

          SDK_ROOT="/usr/local/lib/android/sdk"

          mkdir -p "$SDK_ROOT/licenses"

          printf '%s\n' \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            > "$SDK_ROOT/licenses/android-sdk-license"

          echo "Android SDK license প্রস্তুত হয়েছে।"

          cat "$SDK_ROOT/licenses/android-sdk-license"


      # ==========================================
      # ১৩. Android SDK Components ইনস্টল
      # ==========================================
      - name: Android SDK Components ইনস্টল
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK COMPONENTS"
          echo "=========================================="

          SDK_ROOT="/usr/local/lib/android/sdk"

          SDKMANAGER="$SDK_ROOT/tools/bin/sdkmanager"

          echo "sdkmanager:"
          echo "$SDKMANAGER"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: Buildozer sdkmanager পাওয়া যায়নি।"
            exit 1
          fi

          echo
          echo "License গ্রহণ করা হচ্ছে..."

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses || true

          echo
          echo "প্রয়োজনীয় Android components ইনস্টল হচ্ছে..."

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo
          echo "Build-Tools:"
          ls -la "$SDK_ROOT/build-tools"

          echo
          echo "Platforms:"
          ls -la "$SDK_ROOT/platforms"

          echo
          echo "AIDL খোঁজা হচ্ছে..."

          find "$SDK_ROOT/build-tools" \
            -type f \
            -name aidl \
            -print


      # ==========================================
      # ১৪. Buildozer Environment শেষ পরীক্ষা
      # ==========================================
      - name: Buildozer Environment পরীক্ষা
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDOZER ENVIRONMENT CHECK"
          echo "=========================================="

          SDK_ROOT="/usr/local/lib/android/sdk"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROIDSDK="$SDK_ROOT"

          export PATH="$SDK_ROOT/tools/bin:$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          echo
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo
          echo "ANDROIDSDK:"
          echo "$ANDROIDSDK"

          echo
          echo "sdkmanager:"
          command -v sdkmanager

          echo
          echo "sdkmanager version:"
          sdkmanager --version

          echo
          echo "Buildozer compatibility sdkmanager:"
          "$SDK_ROOT/tools/bin/sdkmanager" --version

          echo
          echo "AIDL:"
          find "$SDK_ROOT/build-tools" \
            -type f \
            -name aidl \
            -print


      # ==========================================
      # ১৫. APK তৈরি
      # ==========================================
      - name: APK তৈরি
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "V16 ANTIVIRUS APK BUILD"
          echo "=========================================="

          SDK_ROOT="/usr/local/lib/android/sdk"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROIDSDK="$SDK_ROOT"

          export PATH="$SDK_ROOT/tools/bin:$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          echo
          echo "SDK:"
          echo "$ANDROIDSDK"

          echo
          echo "sdkmanager:"
          command -v sdkmanager

          echo
          echo "Buildozer শুরু হচ্ছে..."

          buildozer -v android debug


      # ==========================================
      # ১৬. APK পরীক্ষা
      # ==========================================
      - name: APK পরীক্ষা
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "GENERATED APK"
          echo "=========================================="

          if find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | grep -q ".apk"; then

            echo
            echo "APK সফলভাবে তৈরি হয়েছে।"

            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -exec ls -lh {} \;

          else

            echo
            echo "ERROR: APK তৈরি হয়নি।"

            echo
            echo "APK খোঁজা হচ্ছে..."

            find . \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print || true

            exit 1

          fi


      # ==========================================
      # ১৭. APK Artifact Upload
      # ==========================================
      - name: APK Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: "bin/*.apk"
          if-no-files-found: error
