name: V16 Antivirus APK Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # ১. GitHub Repository থেকে Project নেওয়া
      # ==========================================
      - name: Repository Checkout
        uses: actions/checkout@v4


      # ==========================================
      # ২. Python 3.11 সেটআপ
      # ==========================================
      - name: Python সেটআপ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"


      # ==========================================
      # ৩. Java 17 সেটআপ
      # ==========================================
      - name: Java সেটআপ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # ৪. প্রয়োজনীয় Linux Package ইনস্টল
      # ==========================================
      - name: System Package ইনস্টল
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake


      # ==========================================
      # ৫. Python Build Package ইনস্টল
      # ==========================================
      - name: Python Build Package ইনস্টল
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37 \
            virtualenv


      # ==========================================
      # ৬. Project পরীক্ষা
      # ==========================================
      - name: Project পরীক্ষা
        run: |
          echo "=========================================="
          echo "PROJECT FILES"
          echo "=========================================="

          ls -la

          echo
          echo "=========================================="
          echo "PYTHON VERSION"
          echo "=========================================="

          python --version

          echo
          echo "=========================================="
          echo "JAVA VERSION"
          echo "=========================================="

          java -version

          echo
          echo "=========================================="
          echo "BUILDOZER VERSION"
          echo "=========================================="

          buildozer --version


      # ==========================================
      # ৭. main.py Syntax পরীক্ষা
      # ==========================================
      - name: Python Syntax পরীক্ষা
        run: |
          python -m py_compile main.py

          echo
          echo "=========================================="
          echo "main.py SYNTAX OK"
          echo "=========================================="


      # ==========================================
      # ৮. পুরোনো Build পরিষ্কার করা
      # ==========================================
      - name: পুরোনো Build পরিষ্কার
        run: |
          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin


      # ==========================================
      # ৯. Buildozer প্রথমবার প্রস্তুত করা
      # ==========================================
      - name: Buildozer প্রস্তুতি
        run: |
          echo "=========================================="
          echo "BUILDOZER PREPARATION"
          echo "=========================================="

          buildozer -v android debug


      # ==========================================
      # ১০. APK পরীক্ষা
      # ==========================================
      - name: APK পরীক্ষা
        if: always()
        run: |
          echo
          echo "=========================================="
          echo "GENERATED APK"
          echo "=========================================="

          if find bin -maxdepth 1 -type f -name "*.apk" | grep -q ".apk"; then

            echo "APK সফলভাবে তৈরি হয়েছে।"

            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -exec ls -lh {} \;

          else

            echo "ERROR: APK তৈরি হয়নি।"

            echo
            echo "পুরো Project-এ APK খোঁজা হচ্ছে..."

            find . \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print

            exit 1

          fi


      # ==========================================
      # ১১. APK Artifact Upload
      # ==========================================
      - name: APK Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: bin/*.apk
          if-no-files-found: error
