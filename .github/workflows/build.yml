name: V16 Antivirus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 01 — CHECKOUT SOURCE
      # ============================================================

      - name: Checkout source
        uses: actions/checkout@v4


      # ============================================================
      # 02 — SETUP PYTHON 3.11
      # ============================================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 03 — SETUP JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 04 — INSTALL SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev


      # ============================================================
      # 05 — INSTALL BUILDOZER
      # ============================================================

      - name: Install Buildozer
        shell: bash
        run: |
          set -e

          python --version

          python -m pip install --upgrade pip

          python -m pip install \
            "buildozer==1.5.0" \
            "cython==0.29.37" \
            "setuptools<81" \
            wheel


      # ============================================================
      # 06 — CONFIGURE ANDROID SDK
      # ============================================================

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          SDK="/usr/local/lib/android/sdk"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          echo "ANDROID_HOME=$SDK"
          echo "ANDROID_SDK_ROOT=$SDK"

          echo
          echo "Checking sdkmanager..."

          if [ -f "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
              echo "sdkmanager FOUND"
          else
              echo "ERROR: sdkmanager NOT FOUND"
              exit 1
          fi


      # ============================================================
      # 07 — INSTALL ANDROID SDK COMPONENTS
      # ============================================================

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          SDK="/usr/local/lib/android/sdk"

          echo "=========================================="
          echo "ANDROID SDK COMPONENTS"
          echo "=========================================="

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ============================================================
      # 08 — CONFIGURE NDK 28.2
      # ============================================================

      - name: Configure Android NDK 28.2
        shell: bash
        run: |
          set -e

          SDK="/usr/local/lib/android/sdk"
          NDK="$SDK/ndk/28.2.13676358"

          echo "=========================================="
          echo "ANDROID NDK"
          echo "=========================================="

          if [ ! -d "$NDK" ]; then
              echo "NDK 28.2 not found."
              echo "Installing NDK 28.2..."

              "$SDK/cmdline-tools/latest/bin/sdkmanager" \
                "ndk;28.2.13676358"
          fi

          test -f "$NDK/source.properties"

          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          echo
          echo "NDK VERSION:"
          grep "Pkg.Revision" "$NDK/source.properties"


      # ============================================================
      # 09 — VERIFY JAVA / PYTHON / BUILDOZER
      # ============================================================

      - name: Verify build environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PYTHON"
          echo "=========================================="

          python --version

          echo
          echo "=========================================="
          echo "BUILDOZER"
          echo "=========================================="

          python -m buildozer --version

          echo
          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version
          javac -version

          echo
          echo "=========================================="
          echo "NDK"
          echo "=========================================="

          echo "$ANDROID_NDK"

          grep "Pkg.Revision" \
            "$ANDROID_NDK/source.properties"


      # ============================================================
      # 10 — CHECK BUILDOZER.SPEC
      # ============================================================

      - name: Check buildozer.spec
        shell: bash
        run: |
          set -e

          if [ ! -f buildozer.spec ]; then
              echo "ERROR: buildozer.spec not found"
              exit 1
          fi

          echo "=========================================="
          echo "BUILDOZER SPEC"
          echo "=========================================="

          cat buildozer.spec


      # ============================================================
      # 11 — CLEAN OLD BUILDOZER CACHE
      # ============================================================

      - name: Clean old Buildozer cache
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CLEANING OLD BUILD"
          echo "=========================================="

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

          echo "Old build cache removed."


      # ============================================================
      # 12 — FINAL ANDROID ENVIRONMENT CHECK
      # ============================================================

      - name: Final Android environment check
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FINAL ANDROID CHECK"
          echo "=========================================="

          echo
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo
          echo "ANDROID_NDK:"
          echo "$ANDROID_NDK"

          echo
          echo "ANDROID_NDK_HOME:"
          echo "$ANDROID_NDK_HOME"

          echo
          echo "ANDROID_NDK_ROOT:"
          echo "$ANDROID_NDK_ROOT"

          echo
          echo "NDK VERSION:"
          grep "Pkg.Revision" \
            "$ANDROID_NDK/source.properties"

          echo
          echo "SDKMANAGER:"
          which sdkmanager || true


      # ============================================================
      # 13 — BUILD APK
      # ============================================================

      - name: Build APK
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

          ANDROID_NDK: /usr/local/lib/android/sdk/ndk/28.2.13676358
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.2.13676358

          ANDROIDAPI: "35"
          ANDROIDMINAPI: "23"

        run: |
          set -o pipefail

          echo "=========================================="
          echo "STARTING APK BUILD"
          echo "=========================================="

          echo
          echo "Python:"
          python --version

          echo
          echo "Buildozer:"
          python -m buildozer --version

          echo
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo
          echo "ANDROID_NDK:"
          echo "$ANDROID_NDK"

          echo
          echo "NDK VERSION:"
          grep "Pkg.Revision" \
            "$ANDROID_NDK/source.properties"

          echo
          echo "=========================================="
          echo "BUILDOZER BUILD"
          echo "=========================================="

          python -m buildozer -v android debug


      # ============================================================
      # 14 — VERIFY APK
      # ============================================================

      - name: Verify generated APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "APK VERIFICATION"
          echo "=========================================="

          if ! compgen -G "bin/*.apk" > /dev/null; then
              echo "ERROR: APK NOT FOUND"
              exit 1
          fi

          echo
          echo "APK FOUND:"
          ls -lh bin/*.apk


      # ============================================================
      # 15 — UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-Pro-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 16 — SUCCESS SUMMARY
      # ============================================================

      - name: Build Summary
        if: success()
        shell: bash
        run: |
          echo "=========================================="
          echo "APK BUILD SUCCESSFUL"
          echo "=========================================="

          echo
          echo "Generated APK:"
          ls -lh bin/*.apk

          echo
          echo "Artifact:"
          echo "V16-Antivirus-Pro-APK"

          echo
          echo "BUILD COMPLETE"
