name: V16 Antivirus APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # PART 01 — Checkout Repository
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # PART 02 — Setup Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # PART 03 — Setup Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # PART 04 — Install System Packages
      # ==========================================
      - name: Install System Packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev


      # ==========================================
      # PART 05 — Install Buildozer
      # ==========================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37 \
            virtualenv


      # ==========================================
      # PART 06 — Check Environment
      # ==========================================
      - name: Check Environment
        run: |
          echo "=============================="
          echo "PROJECT"
          echo "=============================="

          pwd
          ls -la

          echo
          echo "Python:"
          python --version

          echo
          echo "Java:"
          java -version

          echo
          echo "Buildozer:"
          buildozer --version


      # ==========================================
      # PART 07 — Validate Python
      # ==========================================
      - name: Validate Python
        run: |
          echo "=============================="
          echo "CHECKING main.py"
          echo "=============================="

          test -f main.py

          python -m py_compile main.py

          echo "main.py syntax OK"


      # ==========================================
      # PART 08 — Check Buildozer Spec
      # ==========================================
      - name: Check Buildozer Spec
        run: |
          echo "=============================="
          echo "CHECKING buildozer.spec"
          echo "=============================="

          test -f buildozer.spec

          cat buildozer.spec


      # ==========================================
      # PART 09 — Clean Build
      # ==========================================
      - name: Clean Build
        run: |
          echo "=============================="
          echo "CLEAN BUILD"
          echo "=============================="

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin


      # ==========================================
      # PART 10 — Build APK
      # ==========================================
      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
          PIP_NO_INPUT: "1"

        run: |
          echo "=============================="
          echo "STARTING V16 ANTIVIRUS BUILD"
          echo "=============================="

          buildozer -v android debug


      # ==========================================
      # PART 11 — Check APK
      # ==========================================
      - name: Check Generated APK
        if: always()
        run: |
          echo "=============================="
          echo "GENERATED APK"
          echo "=============================="

          if compgen -G "bin/*.apk" > /dev/null; then
            echo "APK FOUND:"
            ls -lh bin/*.apk
          else
            echo "ERROR: APK WAS NOT GENERATED."

            echo
            echo "Searching for APK files..."

            find . \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print || true

            exit 1
          fi


      # ==========================================
      # PART 12 — Upload APK
      # ==========================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: bin/*.apk
          if-no-files-found: error
