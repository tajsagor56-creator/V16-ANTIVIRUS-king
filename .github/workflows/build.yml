name: V16 Antivirus APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # ১. Repository থেকে Project সংগ্রহ
      # ==========================================
      - name: Repository Checkout
        uses: actions/checkout@v4


      # ==========================================
      # ২. Python 3.11 সেটআপ
      # ==========================================
      - name: Python সেটআপ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"


      # ==========================================
      # ৩. Java 17 সেটআপ
      # ==========================================
      - name: Java সেটআপ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # ৪. Android SDK Command Line Tools সেটআপ
      # ==========================================
      - name: Android SDK সেটআপ
        uses: android-actions/setup-android@v3


      # ==========================================
      # ৫. Linux Build Packages ইনস্টল
      # ==========================================
      - name: System Packages ইনস্টল
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake


      # ==========================================
      # ৬. Python Build Packages ইনস্টল
      # ==========================================
      - name: Python Build Packages ইনস্টল
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37 \
            virtualenv


      # ==========================================
      # ৭. Python Source Code পরীক্ষা
      # ==========================================
      - name: main.py Syntax পরীক্ষা
        run: |
          echo "=========================================="
          echo "MAIN.PY SYNTAX TEST"
          echo "=========================================="

          python -m py_compile main.py

          echo "main.py Syntax OK"


      # ==========================================
      # ৮. Project Files পরীক্ষা
      # ==========================================
      - name: Project পরীক্ষা
        run: |
          echo "=========================================="
          echo "PROJECT FILES"
          echo "=========================================="

          ls -la

          echo
          echo "=========================================="
          echo "PYTHON"
          echo "=========================================="

          python --version

          echo
          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          echo
          echo "=========================================="
          echo "BUILDOZER"
          echo "=========================================="

          buildozer --version


      # ==========================================
      # ৯. GitHub Runner-এর Android SDK প্রস্তুত
      # ==========================================
      - name: Android SDK Components ইনস্টল
        run: |

          echo "=========================================="
          echo "ANDROID SDK PREPARATION"
          echo "=========================================="

          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo
          echo "SDK Manager:"
          command -v sdkmanager || true

          echo
          echo "Android SDK License গ্রহণ"

          yes | sdkmanager --licenses > /dev/null || true

          echo
          echo "Android 35 Platform ইনস্টল"

          sdkmanager \
            "platform-tools" \
            "platforms;android-35"

          echo
          echo "Build Tools 37 ইনস্টল"

          sdkmanager \
            "build-tools;37.0.0"

          echo
          echo "=========================================="
          echo "AIDL পরীক্ষা"
          echo "=========================================="

          find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "aidl" \
            -print

          if find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "aidl" \
            | grep -q "aidl"; then

            echo "AIDL FOUND"

          else

            echo "ERROR: AIDL NOT FOUND"
            exit 1

          fi


      # ==========================================
      # ১০. পুরোনো Build Cache পরিষ্কার
      # ==========================================
      - name: Build Cache পরিষ্কার
        run: |

          echo "=========================================="
          echo "CLEANING OLD BUILD"
          echo "=========================================="

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin


      # ==========================================
      # ১১. Buildozer-এর জন্য Android Environment
      # ==========================================
      - name: Android Environment সেটআপ
        run: |

          echo "=========================================="
          echo "ANDROID ENVIRONMENT"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "JAVA_HOME=$JAVA_HOME"

          echo "ANDROIDAPI=35" >> "$GITHUB_ENV"

          echo "ANDROIDMINAPI=23" >> "$GITHUB_ENV"


      # ==========================================
      # ১২. Buildozer প্রথমবার প্রস্তুত করা
      # ==========================================
      - name: Buildozer প্রস্তুতি
        run: |

          echo "=========================================="
          echo "BUILDOZER PREPARATION"
          echo "=========================================="

          buildozer android clean || true

          buildozer -v android debug


      # ==========================================
      # ১৩. APK পরীক্ষা
      # ==========================================
      - name: APK পরীক্ষা
        if: always()
        run: |

          echo
          echo "=========================================="
          echo "GENERATED APK"
          echo "=========================================="

          if ls bin/*.apk >/dev/null 2>&1; then

            echo "APK সফলভাবে তৈরি হয়েছে।"

            ls -lh bin/*.apk

          else

            echo "ERROR: APK তৈরি হয়নি।"

            echo
            echo "পুরো Project-এ APK খোঁজা হচ্ছে..."

            find . \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print

            exit 1

          fi


      # ==========================================
      # ১৪. APK Artifact হিসেবে Upload
      # ==========================================
      - name: APK Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: bin/*.apk
          if-no-files-found: error
