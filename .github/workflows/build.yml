name: V16 Antivirus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      # ======================================================
      # 01 - CHECKOUT
      # ======================================================

      - name: 01 - Checkout
        uses: actions/checkout@v4


      # ======================================================
      # 02 - PYTHON 3.12
      # ======================================================

      - name: 02 - Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # 03 - JAVA 17
      # ======================================================

      - name: 03 - Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ======================================================
      # 04 - SYSTEM PACKAGES
      # ======================================================

      - name: 04 - Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-virtualenv \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            autopoint \
            gettext


      # ======================================================
      # 05 - VERIFY PYTHON / JAVA
      # ======================================================

      - name: 05 - Verify environment
        run: |
          python --version
          python3 --version
          java -version
          javac -version


      # ======================================================
      # 06 - INSTALL BUILD DEPENDENCIES
      # ======================================================

      - name: 06 - Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython<3"
          python -m pip install buildozer


      # ======================================================
      # 07 - CLEAN OLD BUILD
      # ======================================================

      - name: 07 - Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin


      # ======================================================
      # 08 - BUILD APK
      # ======================================================

      - name: 08 - Build APK
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          buildozer -v android debug


      # ======================================================
      # 09 - SHOW APK
      # ======================================================

      - name: 09 - Show APK
        run: |
          echo "===== APK FILES ====="
          find bin -type f -name "*.apk" -print


      # ======================================================
      # 10 - UPLOAD APK
      # ======================================================

      - name: 10 - Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-Pro-APK
          path: bin/*.apk
          if-no-files-found: error
