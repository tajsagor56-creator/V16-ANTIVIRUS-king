name: V16 Antivirus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # 01 CHECKOUT
      - name: 01 - Checkout source
        uses: actions/checkout@v4

      # 02 PYTHON
      - name: 02 - Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 03 JAVA
      - name: 03 - Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 04 ANDROID SDK
      - name: 04 - Setup Android SDK
        uses: android-actions/setup-android@v3

      # 05 SDK COMPONENTS
      - name: 05 - Install Android SDK components
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "cmdline-tools;latest"

      # 06 LEGACY SDKMANAGER FIX
      - name: 06 - Fix legacy sdkmanager path
        shell: bash
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/tools/bin"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/tools/bin" >> "$GITHUB_PATH"

      # 07 NDK
      - name: 07 - Install Android NDK 28.2
        shell: bash
        run: |
          set -e
          sdkmanager "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      # 08 VERIFY ANDROID
      - name: 08 - Verify Android environment
        shell: bash
        run: |
          set -e
          echo "=========================================="
          echo "ANDROID ENVIRONMENT"
          echo "=========================================="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo
          echo "SDKMANAGER:"
          which sdkmanager
          sdkmanager --version
          echo
          echo "JAVA:"
          java -version
          echo
          echo "PYTHON:"
          python --version
          echo
          echo "NDK:"
          test -f "$ANDROID_NDK_HOME/source.properties"
          grep "Pkg.Revision" "$ANDROID_NDK_HOME/source.properties"

      # 09 PYTHON BUILD TOOLS
      - name: 09 - Install Buildozer dependencies
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install \
            buildozer==1.5.0 \
            cython==0.29.37

      # 10 PROJECT CHECK
      - name: 10 - Check project files
        shell: bash
        run: |
          set -e
          echo "=========================================="
          echo "PROJECT FILES"
          echo "=========================================="
          test -f main.py
          test -f buildozer.spec
          echo "main.py found"
          echo "buildozer.spec found"

      # 11 CLEAN
      - name: 11 - Clean old Buildozer files
        shell: bash
        run: |
          set -e
          rm -rf .buildozer
          rm -rf bin
          mkdir -p bin

      # 12 BUILD
      - name: 12 - Build APK
        shell: bash
        env:
          ANDROIDSDK: ${{ env.ANDROID_HOME }}
          ANDROIDNDK: ${{ env.ANDROID_NDK_HOME }}
          ANDROIDAPI: "35"
          ANDROIDMINAPI: "23"
        run: |
          set -e

          echo "=========================================="
          echo "BUILDOZER BUILD"
          echo "=========================================="

          echo "Python:"
          python --version

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo
          echo "ANDROID_NDK_HOME:"
          echo "$ANDROID_NDK_HOME"

          echo
          echo "NDK VERSION:"
          grep "Pkg.Revision" "$ANDROID_NDK_HOME/source.properties"

          echo
          echo "SDKMANAGER:"
          which sdkmanager
          sdkmanager --version

          echo
          echo "Starting APK build..."

          buildozer -v android debug

      # 13 SHOW APK
      - name: 13 - Show APK
        shell: bash
        run: |
          set -e
          echo "=========================================="
          echo "APK FILES"
          echo "=========================================="
          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"

      # 14 UPLOAD APK
      - name: 14 - Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-Pro-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
