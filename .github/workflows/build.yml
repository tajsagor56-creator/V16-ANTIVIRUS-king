name: V16 Antivirus APK Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # ১. Repository থেকে Project নেওয়া
      # ==========================================
      - name: Repository Checkout
        uses: actions/checkout@v4


      # ==========================================
      # ২. Python 3.11 সেটআপ
      # ==========================================
      - name: Python সেটআপ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # ৩. Java 17 সেটআপ
      # ==========================================
      - name: Java সেটআপ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # ৪. Linux প্রয়োজনীয় Package ইনস্টল
      # ==========================================
      - name: প্রয়োজনীয় Package ইনস্টল
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake


      # ==========================================
      # ৫. Buildozer ইনস্টল
      # ==========================================
      - name: Buildozer ইনস্টল
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37


      # ==========================================
      # ৬. Project পরীক্ষা
      # ==========================================
      - name: Project পরীক্ষা
        run: |

          echo "=========================================="
          echo "PROJECT FILES"
          echo "=========================================="

          ls -la

          echo
          echo "=========================================="
          echo "PYTHON"
          echo "=========================================="

          python --version

          echo
          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          echo
          echo "=========================================="
          echo "BUILDOZER"
          echo "=========================================="

          buildozer --version


      # ==========================================
      # ৭. main.py পরীক্ষা
      # ==========================================
      - name: Python Syntax পরীক্ষা
        run: |

          python -m py_compile main.py

          echo
          echo "=========================================="
          echo "main.py ঠিক আছে"
          echo "=========================================="


      # ==========================================
      # ৮. GitHub Runner-এর Android SDK ব্যবহার
      # ==========================================
      - name: Android SDK পরীক্ষা
        run: |

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo
          echo "SDK packages:"

          sdkmanager --list_installed || true

          echo
          echo "Build Tools:"

          ls -la "$ANDROID_HOME/build-tools" || true

          echo
          echo "Platforms:"

          ls -la "$ANDROID_HOME/platforms" || true

          echo
          echo "AIDL:"

          find "$ANDROID_HOME/build-tools" \
            -type f \
            -name aidl \
            -print || true


      # ==========================================
      # ৯. Android SDK License গ্রহণ
      # ==========================================
      - name: Android License গ্রহণ
        run: |

          echo "=========================================="
          echo "ANDROID LICENSE"
          echo "=========================================="

          yes | sdkmanager --licenses || true


      # ==========================================
      # ১০. প্রয়োজনীয় Android SDK Component
      # ==========================================
      - name: Android SDK Component প্রস্তুত
        run: |

          echo "=========================================="
          echo "ANDROID COMPONENTS"
          echo "=========================================="

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo
          echo "Android SDK প্রস্তুত।"


      # ==========================================
      # ১১. পুরোনো Build পরিষ্কার
      # ==========================================
      - name: Build পরিষ্কার
        run: |

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin


      # ==========================================
      # ১২. APK Build
      # ==========================================
      - name: APK তৈরি
        run: |

          echo "=========================================="
          echo "V16 ANTIVIRUS APK BUILD"
          echo "=========================================="

          buildozer -v android debug


      # ==========================================
      # ১৩. APK পরীক্ষা
      # ==========================================
      - name: APK পরীক্ষা
        if: always()
        run: |

          echo
          echo "=========================================="
          echo "GENERATED APK"
          echo "=========================================="

          if find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | grep -q ".apk"; then

            echo "APK সফলভাবে তৈরি হয়েছে।"

            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -exec ls -lh {} \;

          else

            echo "ERROR: APK তৈরি হয়নি।"

            echo
            echo "APK খোঁজা হচ্ছে:"

            find . \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print

            echo
            echo "শেষ Build log-এর গুরুত্বপূর্ণ অংশ:"

            find .buildozer \
              -type f \
              -name "*.log" \
              -print 2>/dev/null | head -n 20 || true

            exit 1

          fi


      # ==========================================
      # ১৪. APK Upload
      # ==========================================
      - name: APK Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: bin/*.apk
          if-no-files-found: error
