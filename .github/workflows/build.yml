name: V16 Antivirus APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. Checkout Repository
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Python 3.11
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'


      # ==========================================
      # 3. Setup Java 17
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 4. Install System Packages
      # ==========================================
      - name: Install System Packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake


      # ==========================================
      # 5. Install Python Build Packages
      # ==========================================
      - name: Install Python Build Packages
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37 \
            virtualenv


      # ==========================================
      # 6. Check Project
      # ==========================================
      - name: Check Project
        run: |
          echo "=============================="
          echo "PROJECT FILES"
          echo "=============================="

          ls -la

          echo
          echo "=============================="
          echo "PYTHON VERSION"
          echo "=============================="

          python --version

          echo
          echo "=============================="
          echo "JAVA VERSION"
          echo "=============================="

          java -version

          echo
          echo "=============================="
          echo "BUILDOZER VERSION"
          echo "=============================="

          buildozer --version


      # ==========================================
      # 7. Validate main.py
      # ==========================================
      - name: Validate Python
        run: |
          python -m py_compile main.py

          echo
          echo "=============================="
          echo "main.py syntax OK"
          echo "=============================="


      # ==========================================
      # 8. Clean Previous Build
      # ==========================================
      - name: Clean Build
        run: |
          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin


      # ==========================================
      # 9. Build Android APK
      # ==========================================
      - name: Build APK
        run: |
          buildozer -v android debug


      # ==========================================
      # 10. Check APK
      # ==========================================
      - name: Check Generated APK
        if: always()
        run: |

          echo
          echo "=============================="
          echo "GENERATED APK"
          echo "=============================="

          if ls bin/*.apk >/dev/null 2>&1; then

            echo "APK FOUND:"
            ls -lh bin/*.apk

          else

            echo "ERROR: APK was not generated."

            echo
            echo "Searching for APK files..."

            find . -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print

            exit 1

          fi


      # ==========================================
      # 11. Upload APK
      # ==========================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: bin/*.apk
          if-no-files-found: error
