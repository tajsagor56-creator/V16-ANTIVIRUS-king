name: V16 Antivirus APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # ১. Repository Checkout
      # ==========================================
      - name: Repository Checkout
        uses: actions/checkout@v5


      # ==========================================
      # ২. Python Setup
      # ==========================================
      - name: Python Setup
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ==========================================
      # ৩. Java Setup
      # ==========================================
      - name: Java Setup
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"


      # ==========================================
      # ৪. Linux Package
      # ==========================================
      - name: Linux Package ইনস্টল
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake


      # ==========================================
      # ৫. Python Build Package
      # ==========================================
      - name: Buildozer ইনস্টল
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37


      # ==========================================
      # ৬. Project Check
      # ==========================================
      - name: Project পরীক্ষা
        run: |
          echo "=========================================="
          echo "V16 ANTIVIRUS"
          echo "=========================================="

          echo
          echo "Python:"
          python --version

          echo
          echo "Java:"
          java -version

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "Project Files:"
          ls -la


      # ==========================================
      # ৭. main.py Syntax Check
      # ==========================================
      - name: Python Syntax পরীক্ষা
        run: |
          python -m py_compile main.py

          echo
          echo "main.py syntax ঠিক আছে"


      # ==========================================
      # ৮. পুরোনো Build পরিষ্কার
      # ==========================================
      - name: Build পরিষ্কার
        run: |
          echo "=========================================="
          echo "BUILD CLEAN"
          echo "=========================================="

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

          echo "Build directory প্রস্তুত হয়েছে"

      # ==========================================
      # ৯. Android SDK License প্রস্তুতি
      # ==========================================
      - name: Android SDK License প্রস্তুতি
        run: |
          echo "=========================================="
          echo "ANDROID SDK LICENSE"
          echo "=========================================="

          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK_ROOT/licenses"

          printf '%s\n' \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            > "$SDK_ROOT/licenses/android-sdk-license"

          echo "Android SDK license প্রস্তুত হয়েছে।"

          cat "$SDK_ROOT/licenses/android-sdk-license"


      # ==========================================
      # ১০. APK তৈরি
      # ==========================================
      - name: APK তৈরি
        run: |
          echo "=========================================="
          echo "V16 ANTIVIRUS APK BUILD"
          echo "=========================================="

          buildozer -v android debug


      # ==========================================
      # ১১. APK পরীক্ষা
      # ==========================================
      - name: APK পরীক্ষা
        if: always()
        run: |
          echo "=========================================="
          echo "GENERATED APK"
          echo "=========================================="

          if [ -d "bin" ] && find bin -maxdepth 1 -type f -name "*.apk" | grep -q ".apk"; then
            echo "APK সফলভাবে তৈরি হয়েছে।"
            find bin -maxdepth 1 -type f -name "*.apk" -exec ls -lh {} \;
          else
            echo "ERROR: APK তৈরি হয়নি."
            echo "APK খোঁজা হচ্ছে..."
            find . -type f \( -name "*.apk" -o -name "*.aab" \) -print || true
            exit 1
          fi


      # ==========================================
      # ১২. APK Upload
      # ==========================================
      - name: APK Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: "bin/*.apk"
          if-no-files-found: error
