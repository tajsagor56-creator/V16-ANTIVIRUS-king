name: V16 Antivirus APK Build

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # ১. Repository Checkout
      # ==========================================
      - name: Repository Checkout
        uses: actions/checkout@v5


      # ==========================================
      # ২. Python 3.11 সেটআপ
      # ==========================================
      - name: Python Setup
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ==========================================
      # ৩. Java 17 সেটআপ
      # ==========================================
      - name: Java Setup
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"


      # ==========================================
      # ৪. Linux Package ইনস্টল
      # ==========================================
      - name: Linux Package ইনস্টল
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      # ==========================================
      # ৫. Python Build Tools ইনস্টল
      # ==========================================
      - name: Python Build Tools
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37

          # ======================================
          # পুরোনো ও স্থিতিশীল python-for-android
          # ব্যবহার করা হচ্ছে
          # ======================================
          python -m pip install \
            python-for-android==2024.1.21

          echo
          echo "Installed Build Tools:"
          python --version
          buildozer --version

          echo
          echo "python-for-android:"
          python -m pythonforandroid.toolchain --version || true


      # ==========================================
      # ৬. Project পরীক্ষা
      # ==========================================
      - name: Project পরীক্ষা
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "V16 ANTIVIRUS PROJECT"
          echo "=========================================="

          echo
          echo "Python:"
          python --version

          echo
          echo "Java:"
          java -version

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "Project Files:"
          ls -la


      # ==========================================
      # ৭. Python Version নিশ্চিত করা
      # ==========================================
      - name: Python Version পরীক্ষা
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PYTHON VERSION CHECK"
          echo "=========================================="

          python --version

          python - <<'PY'
          import sys

          print("Python executable:", sys.executable)
          print("Python version:", sys.version)

          if sys.version_info >= (3, 12):
              print("ERROR: Python 3.12+ পাওয়া গেছে।")
              print("এই build Python 3.11 ব্যবহার করার কথা।")
              raise SystemExit(1)

          print("Python 3.11 environment ঠিক আছে।")
          PY


      # ==========================================
      # ৮. main.py Syntax পরীক্ষা
      # ==========================================
      - name: Python Syntax পরীক্ষা
        shell: bash
        run: |
          set -e

          if [ ! -f "main.py" ]; then
            echo "ERROR: main.py পাওয়া যায়নি।"
            exit 1
          fi

          python -m py_compile main.py

          echo
          echo "main.py syntax ঠিক আছে।"


      # ==========================================
      # ৯. buildozer.spec পরীক্ষা
      # ==========================================
      - name: Buildozer Spec পরীক্ষা
        shell: bash
        run: |
          set -e

          if [ ! -f "buildozer.spec" ]; then
            echo "ERROR: buildozer.spec পাওয়া যায়নি।"
            exit 1
          fi

          echo "buildozer.spec পাওয়া গেছে।"

          echo
          echo "Android configuration:"
          grep -E \
            "android.api|android.minapi|android.archs|android.sdk_path|android.ndk_path" \
            buildozer.spec || true


      # ==========================================
      # ১০. পুরোনো Build Cache পরিষ্কার
      # ==========================================
      - name: Build Cache পরিষ্কার
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILD CACHE CLEAN"
          echo "=========================================="

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

          echo "পুরোনো Build cache পরিষ্কার হয়েছে।"


      # ==========================================
      # ১১. Buildozer Android SDK প্রস্তুতি
      # ==========================================
      - name: Android SDK প্রস্তুতি
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK SETUP"
          echo "=========================================="

          SYSTEM_SDK="/usr/local/lib/android/sdk"

          BUILD_SDK="$HOME/.buildozer/android/platform/android-sdk"


          echo
          echo "System SDK:"
          echo "$SYSTEM_SDK"

          echo
          echo "Buildozer SDK:"
          echo "$BUILD_SDK"


          # ======================================
          # System SDK আছে কিনা পরীক্ষা
          # ======================================
          if [ ! -d "$SYSTEM_SDK" ]; then
            echo "ERROR: System Android SDK পাওয়া যায়নি।"
            exit 1
          fi


          # ======================================
          # System sdkmanager খোঁজা
          # ======================================
          echo
          echo "sdkmanager খোঁজা হচ্ছে..."


          SDKMANAGER=""

          if [ -f "$SYSTEM_SDK/cmdline-tools/latest/bin/sdkmanager" ]; then

            SDKMANAGER="$SYSTEM_SDK/cmdline-tools/latest/bin/sdkmanager"

          else

            SDKMANAGER="$(find "$SYSTEM_SDK" \
              -type f \
              -name "sdkmanager" \
              -print -quit)"

          fi


          if [ -z "$SDKMANAGER" ]; then

            echo "ERROR: sdkmanager পাওয়া যায়নি।"

            find "$SYSTEM_SDK" \
              -type f \
              -name "sdkmanager" \
              -print || true

            exit 1

          fi


          echo
          echo "sdkmanager পাওয়া গেছে:"
          echo "$SDKMANAGER"


          # ======================================
          # Buildozer SDK directory
          # ======================================
          mkdir -p "$BUILD_SDK"

          mkdir -p "$BUILD_SDK/licenses"

          mkdir -p "$BUILD_SDK/tools/bin"


          # ======================================
          # cmdline-tools কপি
          # ======================================
          CMDLINE_DIR="$(dirname "$(dirname "$SDKMANAGER")")"


          rm -rf "$BUILD_SDK/cmdline-tools"

          mkdir -p "$BUILD_SDK/cmdline-tools/latest"

          cp -a \
            "$CMDLINE_DIR/." \
            "$BUILD_SDK/cmdline-tools/latest/"


          # ======================================
          # পুরোনো Buildozer sdkmanager path
          # ======================================
          ln -sfn \
            "$BUILD_SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$BUILD_SDK/tools/bin/sdkmanager"


          # ======================================
          # SDK License
          # ======================================
          printf '%s\n' \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            > "$BUILD_SDK/licenses/android-sdk-license"


          # ======================================
          # GitHub Environment
          # ======================================
          echo "ANDROID_HOME=$BUILD_SDK" >> "$GITHUB_ENV"

          echo "ANDROID_SDK_ROOT=$BUILD_SDK" >> "$GITHUB_ENV"

          echo "ANDROIDSDK=$BUILD_SDK" >> "$GITHUB_ENV"

          echo "$BUILD_SDK/tools/bin" >> "$GITHUB_PATH"

          echo "$BUILD_SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "$BUILD_SDK/platform-tools" >> "$GITHUB_PATH"


          echo
          echo "Buildozer sdkmanager পরীক্ষা:"

          "$BUILD_SDK/tools/bin/sdkmanager" --version


      # ==========================================
      # ১২. Android SDK Components ইনস্টল
      # ==========================================
      - name: Android Components ইনস্টল
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID COMPONENTS"
          echo "=========================================="


          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          SDKMANAGER="$SDK_ROOT/tools/bin/sdkmanager"


          if [ ! -f "$SDKMANAGER" ]; then

            echo "ERROR: sdkmanager পাওয়া যায়নি।"
            exit 1

          fi


          echo
          echo "sdkmanager:"
          echo "$SDKMANAGER"


          # ======================================
          # License গ্রহণ
          # ======================================
          echo
          echo "Android SDK License গ্রহণ করা হচ্ছে..."

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses || true


          # ======================================
          # শুধুমাত্র প্রয়োজনীয় Components
          # ======================================
          echo
          echo "Android API 35 Components ইনস্টল হচ্ছে..."


          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


          # ======================================
          # Build-Tools পরীক্ষা
          # ======================================
          echo
          echo "Installed Build-Tools:"

          ls -la "$SDK_ROOT/build-tools"


          echo
          echo "AIDL খোঁজা হচ্ছে:"

          find "$SDK_ROOT/build-tools" \
            -type f \
            -name "aidl" \
            -print


          if ! find "$SDK_ROOT/build-tools" \
            -type f \
            -name "aidl" \
            | grep -q "aidl"; then

            echo
            echo "ERROR: AIDL পাওয়া যায়নি।"
            exit 1

          fi


          echo
          echo "Android Components প্রস্তুত।"


      # ==========================================
      # ১৩. NDK Environment
      # ==========================================
      - name: Android NDK Environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID NDK"
          echo "=========================================="


          NDK_ROOT="$HOME/.buildozer/android/platform/android-ndk-r28c"


          if [ ! -d "$NDK_ROOT" ]; then

            echo "NDK এখনো পাওয়া যায়নি।"
            echo "Buildozer build-এর সময় NDK প্রস্তুত করবে।"

          else

            echo
            echo "NDK পাওয়া গেছে:"
            echo "$NDK_ROOT"

          fi


          echo
          echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"


      # ==========================================
      # ১৪. Final SDK পরীক্ষা
      # ==========================================
      - name: Final SDK পরীক্ষা
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FINAL SDK CHECK"
          echo "=========================================="


          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"


          export ANDROID_HOME="$SDK_ROOT"

          export ANDROID_SDK_ROOT="$SDK_ROOT"

          export ANDROIDSDK="$SDK_ROOT"

          export PATH="$SDK_ROOT/tools/bin:$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"


          echo
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"


          echo
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"


          echo
          echo "sdkmanager:"
          command -v sdkmanager


          echo
          echo "sdkmanager version:"
          sdkmanager --version


          echo
          echo "AIDL:"
          find "$SDK_ROOT/build-tools" \
            -type f \
            -name "aidl" \
            -print


          echo
          echo "Build-Tools:"
          ls -la "$SDK_ROOT/build-tools"


          echo
          echo "Platforms:"
          ls -la "$SDK_ROOT/platforms"


      # ==========================================
      # ১৫. APK Build
      # ==========================================
      - name: APK তৈরি
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "V16 ANTIVIRUS APK BUILD"
          echo "=========================================="


          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"


          export ANDROID_HOME="$SDK_ROOT"

          export ANDROID_SDK_ROOT="$SDK_ROOT"

          export ANDROIDSDK="$SDK_ROOT"


          export PATH="$SDK_ROOT/tools/bin:$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"


          echo
          echo "Final SDK:"
          echo "$ANDROID_HOME"


          echo
          echo "sdkmanager:"
          command -v sdkmanager


          echo
          echo "AIDL:"
          find "$SDK_ROOT/build-tools" \
            -type f \
            -name "aidl" \
            -print


          echo
          echo "Python:"
          python --version


          echo
          echo "python-for-android:"
          python -m pip show python-for-android


          echo
          echo "Buildozer build শুরু হচ্ছে..."


          buildozer -v android debug


      # ==========================================
      # ১৬. APK পরীক্ষা
      # ==========================================
      - name: APK পরীক্ষা
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "GENERATED APK"
          echo "=========================================="


          if [ -d "bin" ] && \
            find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | grep -q ".apk"; then


            echo
            echo "APK সফলভাবে তৈরি হয়েছে।"


            echo
            echo "APK Files:"


            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -exec ls -lh {} \;


          else


            echo
            echo "ERROR: APK তৈরি হয়নি।"


            echo
            echo "APK খোঁজা হচ্ছে..."


            find . \
              -type f \
              \( \
                -name "*.apk" \
                -o \
                -name "*.aab" \
              \) \
              -print || true


            echo
            echo "bin directory:"


            ls -la bin 2>/dev/null || true


            exit 1

          fi


      # ==========================================
      # ১৭. APK Artifact Upload
      # ==========================================
      - name: APK Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: "bin/*.apk"
          if-no-files-found: error
