name: V16 Antivirus APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # ১. Repository Checkout
      # ==========================================
      - name: Repository Checkout
        uses: actions/checkout@v4

      # ==========================================
      # ২. Python সেটআপ
      # ==========================================
      - name: Python সেটআপ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # ৩. Java সেটআপ
      # ==========================================
      - name: Java সেটআপ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # ৪. Linux Package ইনস্টল
      # ==========================================
      - name: Linux Package ইনস্টল
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            curl \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake

      # ==========================================
      # ৫. Buildozer ইনস্টল
      # ==========================================
      - name: Buildozer ইনস্টল
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37

      # ==========================================
      # ৬. Project পরীক্ষা
      # ==========================================
      - name: Project পরীক্ষা
        run: |
          echo "=========================================="
          echo "PROJECT FILES"
          echo "=========================================="

          ls -la

          echo
          python --version

          echo
          java -version

          echo
          buildozer --version

      # ==========================================
      # ৭. main.py পরীক্ষা
      # ==========================================
      - name: Python Syntax পরীক্ষা
        run: |
          python -m py_compile main.py

          echo "=========================================="
          echo "main.py SYNTAX OK"
          echo "=========================================="

      # ==========================================
      # ৮. Android SDK পরীক্ষা
      # ==========================================
      - name: Android SDK পরীক্ষা
        run: |
          set -e

          SDK="/usr/local/lib/android/sdk"

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          echo "SDK: $SDK"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK পাওয়া যায়নি।"
            exit 1
          fi

          echo
          echo "sdkmanager খোঁজা হচ্ছে..."

          find "$SDK" \
            -type f \
            -name "sdkmanager" \
            -print

      # ==========================================
      # ৯. Android SDK Components
      # ==========================================
      - name: Android Components
        shell: bash
        run: |
          set -e

          SDK="/usr/local/lib/android/sdk"

          echo "=========================================="
          echo "ANDROID COMPONENTS"
          echo "=========================================="

          SDKMANAGER="$(find "$SDK" \
            -type f \
            -name "sdkmanager" \
            -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager পাওয়া যায়নি।"
            exit 1
          fi

          echo "SDKMANAGER:"
          echo "$SDKMANAGER"

          chmod +x "$SDKMANAGER"

          mkdir -p "$SDK/licenses"

          cat > "$SDK/licenses/android-sdk-license" <<'EOF'
24333f8a63b6825ea9c5514f83c2829b004d1fee
d56f5187479451eabf01fb78af6dfcb131a6481e
EOF

          echo
          echo "License গ্রহণ করা হচ্ছে..."

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses || true

          echo
          echo "Android Components ইনস্টল..."

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ==========================================
      # ১০. AIDL পরীক্ষা
      # ==========================================
      - name: AIDL পরীক্ষা
        run: |
          set -e

          SDK="/usr/local/lib/android/sdk"

          echo "=========================================="
          echo "AIDL CHECK"
          echo "=========================================="

          AIDL="$SDK/build-tools/35.0.0/aidl"

          if [ ! -f "$AIDL" ]; then
            echo "ERROR: AIDL পাওয়া যায়নি।"

            find "$SDK/build-tools" \
              -type f \
              -name "aidl" \
              -print || true

            exit 1
          fi

          chmod +x "$AIDL"

          echo "AIDL পাওয়া গেছে।"

          "$AIDL" --version || true

      # ==========================================
      # ১১. Buildozer SDK Path তৈরি
      # ==========================================
      - name: Buildozer SDK Path
        shell: bash
        run: |
          set -e

          SDK="/usr/local/lib/android/sdk"
          BSDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "BUILDOZER SDK PATH"
          echo "=========================================="

          rm -rf "$HOME/.buildozer"

          mkdir -p "$BSDK"

          ln -s "$SDK/platform-tools" \
            "$BSDK/platform-tools"

          ln -s "$SDK/platforms" \
            "$BSDK/platforms"

          ln -s "$SDK/build-tools" \
            "$BSDK/build-tools"

          ln -s "$SDK/cmdline-tools" \
            "$BSDK/cmdline-tools"

          mkdir -p "$BSDK/tools/bin"

          SDKMANAGER="$(find "$SDK" \
            -type f \
            -name "sdkmanager" \
            -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager পাওয়া যায়নি।"
            exit 1
          fi

          ln -s "$SDKMANAGER" \
            "$BSDK/tools/bin/sdkmanager"

          mkdir -p "$BSDK/licenses"

          cat > "$BSDK/licenses/android-sdk-license" <<'EOF'
24333f8a63b6825ea9c5514f83c2829b004d1fee
d56f5187479451eabf01fb78af6dfcb131a6481e
EOF

          echo
          echo "Buildozer sdkmanager পরীক্ষা..."

          "$BSDK/tools/bin/sdkmanager" --version

          echo
          echo "Buildozer SDK প্রস্তুত।"

      # ==========================================
      # ১২. APK Build
      # ==========================================
      - name: APK তৈরি
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "V16 ANTIVIRUS APK BUILD"
          echo "=========================================="

          rm -rf bin
          mkdir -p bin

          buildozer -v android debug

      # ==========================================
      # ১৩. APK পরীক্ষা
      # ==========================================
      - name: APK পরীক্ষা
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "GENERATED APK"
          echo "=========================================="

          if find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | grep -q ".apk"; then

            echo "APK সফলভাবে তৈরি হয়েছে।"

            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -exec ls -lh {} \;

          else

            echo "ERROR: APK তৈরি হয়নি।"

            echo
            echo "APK খোঁজা হচ্ছে..."

            find . \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print || true

            exit 1

          fi

      # ==========================================
      # ১৪. APK Upload
      # ==========================================
      - name: APK Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: bin/*.apk
          if-no-files-found: error
