name: V16 Antivirus APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build V16 Antivirus APK
    runs-on: ubuntu-22.04

    env:
      BUILDOZER_WARN_ON_ROOT: "1"

    steps:

      # ============================================
      # 1. Checkout
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # 2. Python 3.11
      # ============================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================
      # 3. Java 17
      # ============================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================
      # 4. Linux dependencies
      # ============================================
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      # ============================================
      # 5. Install Python build tools
      # ============================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install "buildozer==1.6.0"
          python -m pip install "cython<3"

      # ============================================
      # 6. Verify environment
      # ============================================
      - name: Verify environment
        run: |
          echo "================================"
          echo "PYTHON"
          echo "================================"
          python --version

          echo ""
          echo "================================"
          echo "JAVA"
          echo "================================"
          java -version

          echo ""
          echo "================================"
          echo "BUILDOZER"
          echo "================================"
          buildozer --version

          echo ""
          echo "================================"
          echo "PROJECT FILES"
          echo "================================"
          find . -maxdepth 3 -type f | sort

          echo ""
          echo "================================"
          echo "CHECK MAIN FILE"
          echo "================================"
          test -f main.py

          echo ""
          echo "================================"
          echo "CHECK BUILDOZER SPEC"
          echo "================================"
          test -f buildozer.spec

          echo ""
          echo "Project verification successful."

      # ============================================
      # 7. Initialize Buildozer
      # ============================================
      - name: Initialize Buildozer
        run: |
          buildozer android clean || true

      # ============================================
      # 8. Build APK
      # ============================================
      - name: Build V16 APK
        shell: bash
        run: |
          set -o pipefail

          buildozer -v android debug 2>&1 | tee build.log

      # ============================================
      # 9. Show build log if failed
      # ============================================
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V16-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      # ============================================
      # 10. Find APK
      # ============================================
      - name: Find APK
        run: |
          echo "================================"
          echo "SEARCHING FOR APK"
          echo "================================"

          find . -type f -name "*.apk" -print

          APK="$(find bin -type f -name "*.apk" 2>/dev/null | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK FOUND:"
          ls -lh "$APK"

      # ============================================
      # 11. Prepare release
      # ============================================
      - name: Prepare APK
        run: |
          mkdir -p release

          APK="$(find bin -type f -name "*.apk" | head -n 1)"

          cp "$APK" \
            "release/V16-Antivirus-Pro.apk"

          echo "Final APK:"
          ls -lh \
            "release/V16-Antivirus-Pro.apk"

      # ============================================
      # 12. Upload APK
      # ============================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-Pro
          path: release/V16-Antivirus-Pro.apk
          if-no-files-found: error
          retention-days: 30
