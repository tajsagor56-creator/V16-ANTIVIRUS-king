name: V16 Antivirus APK Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. Checkout Repository
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Python
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # 3. Setup Java 17
      # ==========================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"


      # ==========================================
      # 4. Install System Packages
      # ==========================================

      - name: Install System Packages
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            curl \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake


      # ==========================================
      # 5. Install Buildozer
      # ==========================================

      - name: Install Buildozer
        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37 \
            virtualenv


      # ==========================================
      # 6. Check Environment
      # ==========================================

      - name: Check Environment
        run: |

          echo "=============================="
          echo "PROJECT FILES"
          echo "=============================="

          ls -la

          echo
          echo "=============================="
          echo "PYTHON"
          echo "=============================="

          python --version

          echo
          echo "=============================="
          echo "JAVA"
          echo "=============================="

          java -version

          echo
          echo "=============================="
          echo "BUILDOZER"
          echo "=============================="

          buildozer --version


      # ==========================================
      # 7. Validate main.py
      # ==========================================

      - name: Validate Python
        run: |

          echo "Checking main.py..."

          python -m py_compile main.py

          echo
          echo "=============================="
          echo "main.py syntax OK"
          echo "=============================="


      # ==========================================
      # 8. Clean Previous Build
      # ==========================================

      - name: Clean Build
        run: |

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin


      # ==========================================
      # 9. Prepare Android SDK
      # ==========================================

      - name: Prepare Android SDK
        shell: bash
        run: |

          set -e

          echo "=============================="
          echo "ANDROID SDK PREPARATION"
          echo "=============================="


          # ------------------------------------------
          # SDK location
          # ------------------------------------------

          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          echo "SDK_ROOT:"
          echo "$SDK_ROOT"


          # ------------------------------------------
          # Create SDK directory
          # ------------------------------------------

          mkdir -p "$SDK_ROOT"


          # ------------------------------------------
          # Download Android Command Line Tools
          # ------------------------------------------

          CMDLINE_URL="https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"

          echo
          echo "Downloading Android Command Line Tools..."

          curl -L \
            "$CMDLINE_URL" \
            -o "$HOME/cmdline-tools.zip"


          # ------------------------------------------
          # Extract tools
          # ------------------------------------------

          rm -rf "$HOME/android-cmdline-tools"

          mkdir -p "$HOME/android-cmdline-tools"

          unzip -q \
            "$HOME/cmdline-tools.zip" \
            -d "$HOME/android-cmdline-tools"


          # ------------------------------------------
          # Install cmdline-tools
          # ------------------------------------------

          mkdir -p "$SDK_ROOT/cmdline-tools"

          rm -rf "$SDK_ROOT/cmdline-tools/latest"


          if [ -d "$HOME/android-cmdline-tools/cmdline-tools" ]; then

            mv \
              "$HOME/android-cmdline-tools/cmdline-tools" \
              "$SDK_ROOT/cmdline-tools/latest"

          else

            echo "ERROR: cmdline-tools directory not found."

            find "$HOME/android-cmdline-tools" \
              -maxdepth 4 \
              -type f \
              -name "sdkmanager" \
              -print

            exit 1

          fi


          # ------------------------------------------
          # sdkmanager
          # ------------------------------------------

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo
          echo "SDKMANAGER:"
          echo "$SDKMANAGER"


          if [ ! -f "$SDKMANAGER" ]; then

            echo
            echo "ERROR: sdkmanager not found."

            echo
            echo "Searching..."

            find "$SDK_ROOT" \
              -type f \
              -name "sdkmanager" \
              -print

            exit 1

          fi


          chmod +x "$SDKMANAGER"


          echo
          echo "sdkmanager found successfully."


          # ------------------------------------------
          # Android SDK Licenses
          # ------------------------------------------

          mkdir -p "$SDK_ROOT/licenses"


          printf '%s\n' \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            > "$SDK_ROOT/licenses/android-sdk-license"


          echo
          echo "Android SDK licenses prepared."


          # ------------------------------------------
          # Accept licenses
          # ------------------------------------------

          echo
          echo "Accepting Android SDK licenses..."


          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses || true


          # ------------------------------------------
          # Install SDK packages
          # ------------------------------------------

          echo
          echo "Installing Android SDK components..."


          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "build-tools;37.0.0"


          # ------------------------------------------
          # Check Build Tools
          # ------------------------------------------

          echo
          echo "=============================="
          echo "BUILD TOOLS"
          echo "=============================="


          if [ ! -d "$SDK_ROOT/build-tools" ]; then

            echo "ERROR: build-tools directory not found."

            exit 1

          fi


          ls -la "$SDK_ROOT/build-tools"


          # ------------------------------------------
          # Find AIDL
          # ------------------------------------------

          echo
          echo "=============================="
          echo "CHECKING AIDL"
          echo "=============================="


          find "$SDK_ROOT/build-tools" \
            -type f \
            -name "aidl" \
            -print


          AIDL_PATH="$(find "$SDK_ROOT/build-tools" \
            -type f \
            -name "aidl" \
            | sort -V \
            | tail -n 1)"


          if [ -z "$AIDL_PATH" ]; then

            echo
            echo "ERROR: AIDL NOT FOUND."

            exit 1

          fi


          chmod +x "$AIDL_PATH"


          echo
          echo "AIDL FOUND:"
          echo "$AIDL_PATH"


          # ------------------------------------------
          # Export Android variables
          # ------------------------------------------

          echo "ANDROIDSDK=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"


          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"


          echo
          echo "=============================="
          echo "ANDROID SDK READY"
          echo "=============================="


      # ==========================================
      # 10. Build APK
      # ==========================================

      - name: Build APK
        shell: bash
        run: |

          set -e

          echo "=============================="
          echo "BUILDING V16 ANTIVIRUS APK"
          echo "=============================="


          buildozer -v android debug


      # ==========================================
      # 11. Check APK
      # ==========================================

      - name: Check Generated APK
        if: always()
        shell: bash
        run: |

          echo
          echo "=============================="
          echo "GENERATED APK"
          echo "=============================="


          if ls bin/*.apk >/dev/null 2>&1; then

            echo
            echo "APK FOUND:"

            ls -lh bin/*.apk

          else

            echo
            echo "ERROR: APK WAS NOT GENERATED."

            echo
            echo "Searching for APK files..."

            find . \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print

            exit 1

          fi


      # ==========================================
      # 12. Upload APK
      # ==========================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: bin/*.apk
          if-no-files-found: error


      # ==========================================
      # 13. Upload Build Logs
      # ==========================================

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V16-build-log
          path: |
            .buildozer/**/*.log
            .buildozer/**/*.txt
          if-no-files-found: ignore
