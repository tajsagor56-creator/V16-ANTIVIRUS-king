name: V16 Antivirus APK Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # ১. Repository Checkout
      # ==========================================
      - name: Repository Checkout
        uses: actions/checkout@v4


      # ==========================================
      # ২. Python সেটআপ
      # ==========================================
      - name: Python সেটআপ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # ৩. Java সেটআপ
      # ==========================================
      - name: Java সেটআপ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # ৪. Linux Package ইনস্টল
      # ==========================================
      - name: প্রয়োজনীয় Package ইনস্টল
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake


      # ==========================================
      # ৫. Buildozer ইনস্টল
      # ==========================================
      - name: Buildozer ইনস্টল
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37


      # ==========================================
      # ৬. Project পরীক্ষা
      # ==========================================
      - name: Project পরীক্ষা
        run: |
          echo "=========================================="
          echo "PROJECT FILES"
          echo "=========================================="

          ls -la

          echo
          echo "=========================================="
          echo "PYTHON VERSION"
          echo "=========================================="

          python --version

          echo
          echo "=========================================="
          echo "JAVA VERSION"
          echo "=========================================="

          java -version

          echo
          echo "=========================================="
          echo "BUILDOZER VERSION"
          echo "=========================================="

          buildozer --version


      # ==========================================
      # ৭. main.py Syntax পরীক্ষা
      # ==========================================
      - name: Python Syntax পরীক্ষা
        run: |
          python -m py_compile main.py

          echo
          echo "=========================================="
          echo "main.py SYNTAX OK"
          echo "=========================================="


      # ==========================================
      # ৮. GitHub-এর Android SDK পরীক্ষা
      # ==========================================
      - name: Android SDK পরীক্ষা
        run: |
          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          echo "ANDROID_HOME:"
          echo "${ANDROID_HOME:-নির্ধারিত নয়}"

          echo
          echo "ANDROID_SDK_ROOT:"
          echo "${ANDROID_SDK_ROOT:-নির্ধারিত নয়}"

          echo
          echo "SDKMANAGER খোঁজা হচ্ছে..."

          find /usr/local/lib/android/sdk \
            -type f \
            -name "sdkmanager" \
            -print 2>/dev/null || true

          echo
          echo "AIDL খোঁজা হচ্ছে..."

          find /usr/local/lib/android/sdk \
            -type f \
            -name "aidl" \
            -print 2>/dev/null || true


      # ==========================================
      # ৯. Android SDK Components ইনস্টল
      # ==========================================
      - name: Android Components ইনস্টল
        run: |
          echo "=========================================="
          echo "ANDROID COMPONENTS"
          echo "=========================================="

          SDK_ROOT="/usr/local/lib/android/sdk"

          echo "SDK ROOT:"
          echo "$SDK_ROOT"

          SDKMANAGER=""

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          elif [ -x "$SDK_ROOT/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/bin/sdkmanager"

          elif [ -x "$SDK_ROOT/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/tools/bin/sdkmanager"

          else
            SDKMANAGER="$(find "$SDK_ROOT" \
              -type f \
              -name "sdkmanager" \
              -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager পাওয়া যায়নি।"
            exit 1
          fi

          echo
          echo "SDKMANAGER:"
          echo "$SDKMANAGER"

          chmod +x "$SDKMANAGER"

          echo
          echo "Android license প্রস্তুত করা হচ্ছে..."

          mkdir -p "$SDK_ROOT/licenses"

          cat > "$SDK_ROOT/licenses/android-sdk-license" << 'EOF'
24333f8a63b6825ea9c5514f83c2829b004d1fee
d56f5187479451eabf01fb78af6dfcb131a6481e
EOF

          echo
          echo "SDK license গ্রহণ করা হচ্ছে..."

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses || true

          echo
          echo "প্রয়োজনীয় Android Components ইনস্টল করা হচ্ছে..."

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ==========================================
      # ১০. Android SDK পরীক্ষা
      # ==========================================
      - name: Android SDK যাচাই
        run: |
          echo "=========================================="
          echo "ANDROID SDK VERIFY"
          echo "=========================================="

          SDK_ROOT="/usr/local/lib/android/sdk"

          echo
          echo "Build Tools:"
          ls -la "$SDK_ROOT/build-tools" || true

          echo
          echo "Platforms:"
          ls -la "$SDK_ROOT/platforms" || true

          echo
          echo "AIDL:"
          find "$SDK_ROOT/build-tools" \
            -type f \
            -name "aidl" \
            -print || true

          AIDL="$(find "$SDK_ROOT/build-tools" \
            -type f \
            -name "aidl" \
            -print -quit 2>/dev/null || true)"

          if [ -z "$AIDL" ]; then
            echo
            echo "ERROR: AIDL পাওয়া যায়নি।"
            exit 1
          fi

          echo
          echo "AIDL পাওয়া গেছে:"
          echo "$AIDL"

          "$AIDL" --version || true


      # ==========================================
      # ১১. Build পরিষ্কার
      # ==========================================
      - name: Build পরিষ্কার
        run: |
          echo "=========================================="
          echo "BUILD CLEAN"
          echo "=========================================="

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin


      # ==========================================
      # ১২. Buildozer-এর SDK path নির্ধারণ
      # ==========================================
      - name: Buildozer SDK Path সেট করা
        run: |
          echo "=========================================="
          echo "BUILDOZER SDK PATH"
          echo "=========================================="

          SDK_ROOT="/usr/local/lib/android/sdk"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)"

          if [ -n "$BUILD_TOOLS" ]; then
            echo "$BUILD_TOOLS" >> "$GITHUB_PATH"
            echo "BUILD TOOLS:"
            echo "$BUILD_TOOLS"
          fi

          echo
          echo "ANDROID_HOME:"
          echo "$SDK_ROOT"


      # ==========================================
      # ১৩. Buildozer দিয়ে APK তৈরি
      # ==========================================
      - name: APK তৈরি
        run: |
          echo "=========================================="
          echo "V16 ANTIVIRUS APK BUILD"
          echo "=========================================="

          buildozer -v android debug


      # ==========================================
      # ১৪. APK পরীক্ষা
      # ==========================================
      - name: APK পরীক্ষা
        if: always()
        run: |
          echo
          echo "=========================================="
          echo "GENERATED APK"
          echo "=========================================="

          if [ -d "bin" ] && \
             find "bin" \
             -maxdepth 1 \
             -type f \
             -name "*.apk" \
             | grep -q "."; then

            echo "APK সফলভাবে তৈরি হয়েছে।"

            find "bin" \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -exec ls -lh {} \;

          else

            echo "ERROR: APK তৈরি হয়নি।"

            echo
            echo "Project-এর মধ্যে APK খোঁজা হচ্ছে..."

            find . \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print || true

            echo
            echo "শেষ Build directory:"
            find .buildozer \
              -maxdepth 4 \
              -type d \
              -name "build*" \
              -print 2>/dev/null || true

            exit 1

          fi


      # ==========================================
      # ১৫. APK Artifact Upload
      # ==========================================
      - name: APK Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: bin/*.apk
          if-no-files-found: error
