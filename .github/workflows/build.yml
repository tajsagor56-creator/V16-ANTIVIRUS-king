name: V16 Antivirus APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # ১. Repository Checkout
      # ==========================================
      - name: Repository Checkout
        uses: actions/checkout@v5


      # ==========================================
      # ২. Python Setup
      # ==========================================
      - name: Python Setup
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ==========================================
      # ৩. Java Setup
      # ==========================================
      - name: Java Setup
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"


      # ==========================================
      # ৪. Linux Package
      # ==========================================
      - name: Linux Package ইনস্টল
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake


      # ==========================================
      # ৫. Python Build Package
      # ==========================================
      - name: Buildozer ইনস্টল
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37


      # ==========================================
      # ৬. Project Check
      # ==========================================
      - name: Project পরীক্ষা
        run: |
          echo "=========================================="
          echo "V16 ANTIVIRUS"
          echo "=========================================="

          echo
          echo "Python:"
          python --version

          echo
          echo "Java:"
          java -version

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "Project Files:"
          ls -la


      # ==========================================
      # ৭. main.py Syntax Check
      # ==========================================
      - name: Python Syntax পরীক্ষা
        run: |
          python -m py_compile main.py

          echo
          echo "main.py syntax ঠিক আছে"


            # ==========================================
      # ৮. Android SDK প্রস্তুত করা
      # ==========================================
      - name: Android SDK প্রস্তুত করা
        run: |
          echo "=========================================="
          echo "ANDROID SDK প্রস্তুত করা হচ্ছে"
          echo "=========================================="

          SYSTEM_SDK="/usr/local/lib/android/sdk"

          if [ ! -d "$SYSTEM_SDK" ]; then
            echo "ERROR: Android SDK পাওয়া যায়নি।"
            exit 1
          fi

          echo "System SDK:"
          echo "$SYSTEM_SDK"

          echo
          echo "SDK directory:"
          ls -la "$SYSTEM_SDK"

          echo
          echo "sdkmanager খোঁজা হচ্ছে..."

          SDKMANAGER="$(find "$SYSTEM_SDK" \
            -type f \
            -name "sdkmanager" \
            -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager পাওয়া যায়নি।"
            exit 1
          fi

          echo "sdkmanager:"
          echo "$SDKMANAGER"

          echo
          echo "Android SDK environment সেট করা হচ্ছে..."

          echo "ANDROID_HOME=$SYSTEM_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SYSTEM_SDK" >> "$GITHUB_ENV"

          echo "$SYSTEM_SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SYSTEM_SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo
          echo "SDK পরীক্ষা..."

          "$SDKMANAGER" --version

          echo
          echo "বর্তমান Build-Tools:"
          ls -la "$SYSTEM_SDK/build-tools" || true

          echo
          echo "বর্তমান Platforms:"
          ls -la "$SYSTEM_SDK/platforms" || true


      # ==========================================
      # ৯. Android SDK Components পরীক্ষা
      # ==========================================
      - name: Android SDK Components পরীক্ষা
        run: |
          echo "=========================================="
          echo "ANDROID COMPONENTS"
          echo "=========================================="

          SDK_ROOT="/usr/local/lib/android/sdk"

          echo "SDK:"
          echo "$SDK_ROOT"

          echo
          echo "Build-Tools:"
          find "$SDK_ROOT/build-tools" \
            -maxdepth 2 \
            -type f \
            -name "aidl" \
            -print || true

          echo
          echo "Installed Build-Tools:"
          ls -la "$SDK_ROOT/build-tools" || true

          echo
          echo "Installed Platforms:"
          ls -la "$SDK_ROOT/platforms" || true


      # ==========================================
      # ১০. Buildozer-এর জন্য SDK সেট করা
      # ==========================================
      - name: Buildozer SDK Environment
        run: |
          echo "=========================================="
          echo "BUILDOZER SDK ENVIRONMENT"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo
          echo "SDK environment প্রস্তুত।"


      # ==========================================
      # ১১. APK তৈরি
      # ==========================================
      - name: APK তৈরি
        run: |
          echo "=========================================="
          echo "V16 ANTIVIRUS APK BUILD"
          echo "=========================================="

          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"

          buildozer -v android debug


      # ==========================================
      # ১২. APK পরীক্ষা
      # ==========================================
      - name: APK পরীক্ষা
        if: always()
        run: |
          echo "=========================================="
          echo "GENERATED APK"
          echo "=========================================="

          if [ -d "bin" ] && \
             find bin \
             -maxdepth 1 \
             -type f \
             -name "*.apk" \
             | grep -q ".apk"; then

            echo "APK সফলভাবে তৈরি হয়েছে।"

            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -exec ls -lh {} \;

          else

            echo "ERROR: APK তৈরি হয়নি."

            echo
            echo "APK খোঁজা হচ্ছে..."

            find . \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print || true

            exit 1

          fi


      # ==========================================
      # ১৩. APK Upload
      # ==========================================
      - name: APK Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: "bin/*.apk"
          if-no-files-found: error
