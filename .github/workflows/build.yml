name: V16 Antivirus APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build V16 Antivirus APK
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # 3. Java 17
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # 4. Linux dependencies
      # ==========================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      # ==========================================
      # 5. Android SDK
      # ==========================================
      - name: Configure Android SDK
        shell: bash
        run: |

          SDK="/usr/local/lib/android/sdk"

          if [ ! -d "$SDK" ]; then
            echo "Android SDK not found:"
            echo "$SDK"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      # ==========================================
      # 6. Locate sdkmanager
      # ==========================================
      - name: Locate sdkmanager
        shell: bash
        run: |

          SDKMANAGER="$(find "$ANDROID_HOME" \
            -type f \
            -name sdkmanager \
            -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          chmod +x "$SDKMANAGER"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "sdkmanager:"
          "$SDKMANAGER" --version

      # ==========================================
      # 7. Accept licenses
      # ==========================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |

          yes | "$SDKMANAGER" --licenses || true

      # ==========================================
      # 8. Install EXACT Android 35 components
      # ==========================================
      - name: Install Android SDK components
        shell: bash
        run: |

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ==========================================
      # 9. Verify Build Tools
      # ==========================================
      - name: Verify Android Build Tools
        shell: bash
        run: |

          echo "Installed Build Tools:"
          ls -la "$ANDROID_HOME/build-tools"

          echo ""
          echo "AIDL:"

          test -x \
            "$ANDROID_HOME/build-tools/35.0.0/aidl"

          "$ANDROID_HOME/build-tools/35.0.0/aidl" \
            --version || true

          echo ""
          echo "AIDL successfully found."

      # ==========================================
      # 10. Install Buildozer
      # ==========================================
      - name: Install Buildozer
        shell: bash
        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            setuptools \
            wheel \
            cython \
            buildozer==1.6.0

      # ==========================================
      # 11. Verify project
      # ==========================================
      - name: Verify project
        shell: bash
        run: |

          echo "================================"
          echo "PROJECT FILES"
          echo "================================"

          find . -maxdepth 3 -type f | sort

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Checking main.py:"
          test -f main.py

          echo ""
          echo "Checking buildozer.spec:"
          test -f buildozer.spec

      # ==========================================
      # 12. Clean Buildozer
      # ==========================================
      - name: Clean Buildozer
        shell: bash
        run: |

          rm -rf .buildozer
          rm -rf bin

      # ==========================================
      # 13. Build APK
      # ==========================================
      - name: Build APK
        shell: bash
        env:
          ACCEPT_EULA: Y
        run: |

          buildozer -v android debug

      # ==========================================
      # 14. Find APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |

          echo "APK files:"

          find bin \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find bin \
            -type f \
            -name "*.apk" \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

      # ==========================================
      # 15. Prepare APK
      # ==========================================
      - name: Prepare APK
        shell: bash
        run: |

          mkdir -p release

          APK="$(find bin \
            -type f \
            -name "*.apk" \
            -print -quit)"

          cp "$APK" \
            release/V16-Antivirus-Pro.apk

          ls -lh \
            release/V16-Antivirus-Pro.apk

      # ==========================================
      # 16. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-Pro
          path: release/V16-Antivirus-Pro.apk
          if-no-files-found: error
          retention-days: 30
