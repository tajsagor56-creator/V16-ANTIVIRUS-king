name: V16 Antivirus APK Build

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # ১. Repository Checkout
      # ==========================================
      - name: Repository Checkout
        uses: actions/checkout@v5


      # ==========================================
      # ২. Python সেটআপ
      # ==========================================
      - name: Python Setup
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ==========================================
      # ৩. Java সেটআপ
      # ==========================================
      - name: Java Setup
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"


      # ==========================================
      # ৪. Linux Package ইনস্টল
      # ==========================================
      - name: Linux Package ইনস্টল
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake


      # ==========================================
      # ৫. Python Build Package
      # ==========================================
      - name: Buildozer ইনস্টল
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37


      # ==========================================
      # ৬. Project পরীক্ষা
      # ==========================================
      - name: Project পরীক্ষা
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "V16 ANTIVIRUS PROJECT"
          echo "=========================================="

          echo
          echo "Python:"
          python --version

          echo
          echo "Java:"
          java -version

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "Project Files:"
          ls -la


      # ==========================================
      # ৭. buildozer.spec পরীক্ষা
      # ==========================================
      - name: Buildozer Spec পরীক্ষা
        shell: bash
        run: |
          set -e

          if [ ! -f "buildozer.spec" ]; then
            echo "ERROR: buildozer.spec পাওয়া যায়নি।"
            exit 1
          fi

          echo "buildozer.spec পাওয়া গেছে।"

          echo
          echo "Android configuration:"
          grep -E \
            "android.api|android.minapi|android.sdk_path|android.ndk_path" \
            buildozer.spec || true


      # ==========================================
      # ৮. main.py Syntax পরীক্ষা
      # ==========================================
      - name: Python Syntax পরীক্ষা
        shell: bash
        run: |
          set -e

          if [ ! -f "main.py" ]; then
            echo "ERROR: main.py পাওয়া যায়নি।"
            exit 1
          fi

          python -m py_compile main.py

          echo
          echo "main.py syntax ঠিক আছে।"


      # ==========================================
      # ৯. পুরোনো Build Cache পরিষ্কার
      # ==========================================
      - name: Build Cache পরিষ্কার
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILD CACHE CLEAN"
          echo "=========================================="

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

          echo "পুরোনো Build cache পরিষ্কার হয়েছে।"


      # ==========================================
      # ১০. Buildozer Android SDK প্রস্তুতি
      # ==========================================
      - name: Buildozer Android SDK প্রস্তুতি
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDOZER ANDROID SDK SETUP"
          echo "=========================================="

          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          SYSTEM_SDK="/usr/local/lib/android/sdk"

          echo
          echo "Buildozer SDK:"
          echo "$SDK_ROOT"

          echo
          echo "System SDK:"
          echo "$SYSTEM_SDK"


          # ==========================================
          # Buildozer SDK directory তৈরি
          # ==========================================
          mkdir -p "$SDK_ROOT"

          mkdir -p "$SDK_ROOT/licenses"

          mkdir -p "$SDK_ROOT/tools/bin"

          mkdir -p "$SDK_ROOT/cmdline-tools"


          # ==========================================
          # System sdkmanager খোঁজা
          # ==========================================
          echo
          echo "sdkmanager খোঁজা হচ্ছে..."

          SDKMANAGER_SOURCE=""

          if [ -f "$SYSTEM_SDK/cmdline-tools/latest/bin/sdkmanager" ]; then

            SDKMANAGER_SOURCE="$SYSTEM_SDK/cmdline-tools/latest/bin/sdkmanager"

          else

            SDKMANAGER_SOURCE="$(find "$SYSTEM_SDK" \
              -type f \
              -name sdkmanager \
              -print -quit)"

          fi


          if [ -z "$SDKMANAGER_SOURCE" ]; then

            echo
            echo "ERROR: System sdkmanager পাওয়া যায়নি।"

            echo
            echo "বর্তমান Android SDK:"
            find "$SYSTEM_SDK" \
              -maxdepth 5 \
              -type f \
              -name sdkmanager \
              -print || true

            exit 1

          fi


          echo
          echo "sdkmanager পাওয়া গেছে:"
          echo "$SDKMANAGER_SOURCE"


          # ==========================================
          # cmdline-tools source directory নির্ধারণ
          # ==========================================
          CMDLINE_SOURCE="$(dirname "$(dirname "$SDKMANAGER_SOURCE")")"

          echo
          echo "Command Line Tools:"
          echo "$CMDLINE_SOURCE"


          # ==========================================
          # Buildozer SDK-তে cmdline-tools কপি
          # ==========================================
          rm -rf "$SDK_ROOT/cmdline-tools/latest"

          mkdir -p "$SDK_ROOT/cmdline-tools/latest"

          cp -a \
            "$CMDLINE_SOURCE/." \
            "$SDK_ROOT/cmdline-tools/latest/"


          # ==========================================
          # Buildozer পুরোনো SDK path compatibility
          # ==========================================
          ln -sfn \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager"


          if [ -f "$SDK_ROOT/cmdline-tools/latest/bin/avdmanager" ]; then

            ln -sfn \
              "$SDK_ROOT/cmdline-tools/latest/bin/avdmanager" \
              "$SDK_ROOT/tools/bin/avdmanager"

          fi


          # ==========================================
          # SDK Environment
          # ==========================================
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "ANDROIDSDK=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/tools/bin" >> "$GITHUB_PATH"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"


          # ==========================================
          # Android SDK License
          # ==========================================
          printf '%s\n' \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            > "$SDK_ROOT/licenses/android-sdk-license"


          echo
          echo "SDK structure:"
          find "$SDK_ROOT" \
            -maxdepth 4 \
            -type f \
            -name "sdkmanager" \
            -print


          echo
          echo "Buildozer sdkmanager পরীক্ষা:"

          "$SDK_ROOT/tools/bin/sdkmanager" --version


          echo
          echo "Buildozer Android SDK প্রস্তুত হয়েছে।"


      # ==========================================
      # ১১. Android SDK Components ইনস্টল
      # ==========================================
      - name: Android Components ইনস্টল
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK COMPONENTS"
          echo "=========================================="

          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          SDKMANAGER="$SDK_ROOT/tools/bin/sdkmanager"


          if [ ! -f "$SDKMANAGER" ]; then

            echo "ERROR: Buildozer sdkmanager পাওয়া যায়নি।"
            exit 1

          fi


          echo
          echo "sdkmanager:"
          echo "$SDKMANAGER"


          echo
          echo "sdkmanager version:"
          "$SDKMANAGER" --version


          # ==========================================
          # License গ্রহণ
          # ==========================================
          echo
          echo "Android SDK license গ্রহণ করা হচ্ছে..."

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses || true


          # ==========================================
          # প্রয়োজনীয় Android Components
          # ==========================================
          echo
          echo "Android components ইনস্টল হচ্ছে..."

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


          # ==========================================
          # Build-Tools পরীক্ষা
          # ==========================================
          echo
          echo "Installed Build-Tools:"

          ls -la "$SDK_ROOT/build-tools"


          echo
          echo "AIDL খোঁজা হচ্ছে:"

          find "$SDK_ROOT/build-tools" \
            -type f \
            -name "aidl" \
            -print


          # ==========================================
          # AIDL অবশ্যই থাকতে হবে
          # ==========================================
          if ! find "$SDK_ROOT/build-tools" \
            -type f \
            -name "aidl" \
            | grep -q "aidl"; then

            echo
            echo "ERROR: AIDL পাওয়া যায়নি।"
            exit 1

          fi


          echo
          echo "Android SDK components প্রস্তুত।"


      # ==========================================
      # ১২. Buildozer Environment চূড়ান্ত পরীক্ষা
      # ==========================================
      - name: Buildozer Environment পরীক্ষা
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FINAL BUILDOZER ENVIRONMENT"
          echo "=========================================="

          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"


          export ANDROID_HOME="$SDK_ROOT"

          export ANDROID_SDK_ROOT="$SDK_ROOT"

          export ANDROIDSDK="$SDK_ROOT"

          export PATH="$SDK_ROOT/tools/bin:$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"


          echo
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo
          echo "ANDROIDSDK:"
          echo "$ANDROIDSDK"


          echo
          echo "sdkmanager:"
          command -v sdkmanager


          echo
          echo "sdkmanager version:"
          sdkmanager --version


          echo
          echo "AIDL:"
          find "$SDK_ROOT/build-tools" \
            -type f \
            -name "aidl" \
            -print


          echo
          echo "Build-Tools:"
          ls -la "$SDK_ROOT/build-tools"


          echo
          echo "Platforms:"
          ls -la "$SDK_ROOT/platforms"


      # ==========================================
      # ১৩. APK Build
      # ==========================================
      - name: APK তৈরি
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "V16 ANTIVIRUS APK BUILD"
          echo "=========================================="

          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"


          export ANDROID_HOME="$SDK_ROOT"

          export ANDROID_SDK_ROOT="$SDK_ROOT"

          export ANDROIDSDK="$SDK_ROOT"

          export PATH="$SDK_ROOT/tools/bin:$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"


          echo
          echo "Final Android SDK:"
          echo "$ANDROID_HOME"


          echo
          echo "sdkmanager:"
          command -v sdkmanager


          echo
          echo "AIDL:"
          find "$SDK_ROOT/build-tools" \
            -type f \
            -name "aidl" \
            -print


          echo
          echo "Buildozer build শুরু হচ্ছে..."


          buildozer -v android debug


      # ==========================================
      # ১৪. APK পরীক্ষা
      # ==========================================
      - name: APK পরীক্ষা
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "GENERATED APK"
          echo "=========================================="


          if [ -d "bin" ] && \
            find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | grep -q ".apk"; then


            echo
            echo "APK সফলভাবে তৈরি হয়েছে।"


            echo
            echo "APK Files:"

            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -exec ls -lh {} \;


          else


            echo
            echo "ERROR: APK তৈরি হয়নি।"


            echo
            echo "APK খোঁজা হচ্ছে..."


            find . \
              -type f \
              \( \
                -name "*.apk" \
                -o \
                -name "*.aab" \
              \) \
              -print || true


            echo
            echo "Build directory:"
            ls -la bin 2>/dev/null || true


            exit 1

          fi


      # ==========================================
      # ১৫. APK Artifact Upload
      # ==========================================
      - name: APK Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: "bin/*.apk"
          if-no-files-found: error
