name: V16 Antivirus APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # ১. Repository Checkout
      # ==========================================
      - name: Repository Checkout
        uses: actions/checkout@v5

      # ==========================================
      # ২. Python সেটআপ
      # ==========================================
      - name: Python সেটআপ
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # ==========================================
      # ৩. Java সেটআপ
      # ==========================================
      - name: Java সেটআপ
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      # ==========================================
      # ৪. প্রয়োজনীয় Linux Package
      # ==========================================
      - name: Linux Package ইনস্টল
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake

      # ==========================================
      # ৫. Buildozer ইনস্টল
      # ==========================================
      - name: Buildozer ইনস্টল
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37

      # ==========================================
      # ৬. Project পরীক্ষা
      # ==========================================
      - name: Project পরীক্ষা
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "V16 ANTIVIRUS PROJECT"
          echo "=========================================="

          echo
          echo "Python:"
          python --version

          echo
          echo "Java:"
          java -version

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "Project Files:"
          ls -la

      # ==========================================
      # ৭. Python Syntax পরীক্ষা
      # ==========================================
      - name: Python Syntax পরীক্ষা
        shell: bash
        run: |
          set -e

          python -m py_compile main.py

          echo
          echo "main.py syntax ঠিক আছে।"

      # ==========================================
      # ৮. System Android SDK নির্ধারণ
      # ==========================================
      - name: Android SDK প্রস্তুতি
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK PREPARATION"
          echo "=========================================="

          SDK_ROOT="/usr/local/lib/android/sdk"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK পাওয়া যায়নি।"
            exit 1
          fi

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager পাওয়া যায়নি।"

            find "$SDK_ROOT" \
              -type f \
              -name sdkmanager \
              -print || true

            exit 1
          fi

          echo "System SDK:"
          echo "$SDK_ROOT"

          echo
          echo "sdkmanager:"
          echo "$SDKMANAGER"

          echo
          echo "sdkmanager version:"
          "$SDKMANAGER" --version

          # পরবর্তী GitHub Actions step-এ SDK path ব্যবহার হবে
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      # ==========================================
      # ৯. Android SDK License প্রস্তুতি
      # ==========================================
      - name: Android SDK License প্রস্তুতি
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK LICENSE"
          echo "=========================================="

          SDK_ROOT="/usr/local/lib/android/sdk"

          mkdir -p "$SDK_ROOT/licenses"

          printf '%s\n' \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            > "$SDK_ROOT/licenses/android-sdk-license"

          echo "License file প্রস্তুত হয়েছে।"

          cat "$SDK_ROOT/licenses/android-sdk-license"

      # ==========================================
      # ১০. Android SDK Components ইনস্টল
      # ==========================================
      - name: Android SDK Components ইনস্টল
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID COMPONENTS"
          echo "=========================================="

          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo
          echo "SDK License গ্রহণ করা হচ্ছে..."

          yes | "$SDKMANAGER" --licenses || true

          echo
          echo "Required Android Components ইনস্টল হচ্ছে..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

          echo
          echo "Build-Tools:"
          ls -la "$SDK_ROOT/build-tools"

          echo
          echo "Platforms:"
          ls -la "$SDK_ROOT/platforms"

          echo
          echo "AIDL পরীক্ষা..."

          AIDL="$SDK_ROOT/build-tools/37.0.0/aidl"

          if [ ! -f "$AIDL" ]; then
            echo "ERROR: Build-Tools 37.0.0-এর AIDL পাওয়া যায়নি।"
            exit 1
          fi

          echo "AIDL পাওয়া গেছে:"
          echo "$AIDL"

          "$AIDL" --version || true

      # ==========================================
      # ১১. Buildozer Cache পরিষ্কার
      # ==========================================
      - name: Buildozer Cache পরিষ্কার
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDOZER CACHE CLEAN"
          echo "=========================================="

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

          echo "পুরোনো Build cache পরিষ্কার হয়েছে।"

      # ==========================================
      # ১২. Buildozer Environment নিশ্চিত করা
      # ==========================================
      - name: Buildozer Environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDOZER ENVIRONMENT"
          echo "=========================================="

          SDK_ROOT="/usr/local/lib/android/sdk"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROIDSDK="$SDK_ROOT"

          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROIDSDK=$ANDROIDSDK"

          echo
          echo "sdkmanager:"
          command -v sdkmanager

          echo
          echo "AIDL:"
          find "$SDK_ROOT/build-tools" \
            -type f \
            -name aidl \
            -print

          echo
          echo "Build-Tools:"
          ls -la "$SDK_ROOT/build-tools"

      # ==========================================
      # ১৩. Buildozer Configuration পরীক্ষা
      # ==========================================
      - name: Buildozer Configuration পরীক্ষা
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDOZER CONFIGURATION"
          echo "=========================================="

          grep -E \
            "android.sdk_path|android.api|android.minapi|android.archs|requirements" \
            buildozer.spec || true

      # ==========================================
      # ১৪. APK তৈরি
      # ==========================================
      - name: APK তৈরি
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "V16 ANTIVIRUS APK BUILD"
          echo "=========================================="

          SDK_ROOT="/usr/local/lib/android/sdk"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROIDSDK="$SDK_ROOT"

          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          echo
          echo "Final Android SDK:"
          echo "$ANDROID_HOME"

          echo
          echo "sdkmanager:"
          command -v sdkmanager

          echo
          echo "Build-Tools:"
          ls -la "$SDK_ROOT/build-tools"

          echo
          echo "AIDL:"
          find "$SDK_ROOT/build-tools" \
            -type f \
            -name aidl \
            -print

          echo
          echo "Buildozer শুরু হচ্ছে..."

          buildozer -v android debug

      # ==========================================
      # ১৫. APK পরীক্ষা
      # ==========================================
      - name: APK পরীক্ষা
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "GENERATED APK"
          echo "=========================================="

          if find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | grep -q ".apk"; then

            echo "APK সফলভাবে তৈরি হয়েছে।"

            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -exec ls -lh {} \;

          else

            echo "ERROR: APK তৈরি হয়নি।"

            echo
            echo "APK খোঁজা হচ্ছে..."

            find . \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print || true

            exit 1
          fi

      # ==========================================
      # ১৬. APK Artifact Upload
      # ==========================================
      - name: APK Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: "bin/*.apk"
          if-no-files-found: error
