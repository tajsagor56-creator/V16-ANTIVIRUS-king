name: V16 Antivirus APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.3.13750724
      ANDROID_NDK: /usr/local/lib/android/sdk/ndk/27.3.13750724

    steps:

      # =====================================================
      # 1. Checkout
      # =====================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # 2. Python 3.11
      # =====================================================
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # =====================================================
      # 3. Java 17
      # =====================================================
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # =====================================================
      # 4. Verify Python + Java
      # =====================================================
      - name: Verify Python and Java
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "PYTHON"
          echo "=========================================="

          python --version
          which python

          echo
          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          JAVA_HOME_CHECK="$JAVA_HOME"

          echo
          echo "JAVA_HOME:"
          echo "$JAVA_HOME_CHECK"

          if ! java -version 2>&1 | grep -q '"17'; then
            echo "ERROR: Java 17 active হয়নি."
            exit 1
          fi

          echo "Java 17 OK."


      # =====================================================
      # 5. Install Buildozer
      # =====================================================
      - name: Install Buildozer
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "INSTALLING BUILDOZER"
          echo "=========================================="

          python -m pip install --upgrade pip

          python -m pip install \
            "buildozer==1.5.0" \
            "cython<3" \
            "virtualenv"

          echo
          echo "Installed packages:"
          python -m pip list


      # =====================================================
      # 6. Buildozer Test
      # =====================================================
      - name: Test Buildozer
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "BUILDOZER TEST"
          echo "=========================================="

          python -m pip show buildozer

          echo
          echo "Python module:"
          python -c "import buildozer; print(buildozer.__file__)"

          echo
          echo "Buildozer version:"
          python -m buildozer --version

          echo
          echo "Buildozer module works."


      # =====================================================
      # 7. Android SDK
      # =====================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -eux

          SDK="/usr/local/lib/android/sdk"
          NDK="$SDK/ndk/27.3.13750724"

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          test -d "$SDK"
          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"
          test -x "$SDK/build-tools/35.0.0/aidl"

          echo
          echo "ANDROID_HOME:"
          echo "$SDK"

          echo
          echo "ANDROID NDK:"
          echo "$NDK"

          test -d "$NDK"

          echo
          echo "AIDL:"
          "$SDK/build-tools/35.0.0/aidl" --version || true

          echo
          echo "NDK:"
          "$NDK/ndk-build" --version | head -n 5


      # =====================================================
      # 8. Configure Android Environment
      # =====================================================
      - name: Configure Android Environment
        shell: bash
        run: |
          set -eux

          SDK="/usr/local/lib/android/sdk"
          NDK="$SDK/ndk/27.3.13750724"

          echo "=========================================="
          echo "ANDROID ENVIRONMENT"
          echo "=========================================="

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"

          echo
          echo "Environment configured."


      # =====================================================
      # 9. Final Android Environment Test
      # =====================================================
      - name: Final Android Environment Test
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "FINAL ANDROID TEST"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          echo
          echo "AIDL:"
          command -v aidl || true
          aidl --version || true

          echo
          echo "SDK:"
          test -d "$ANDROID_HOME"

          echo
          echo "NDK:"
          test -d "$ANDROID_NDK_HOME"

          echo
          echo "Android environment OK."


      # =====================================================
      # 10. Buildozer APK
      # =====================================================
      - name: Build V16 Antivirus APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "BUILD V16 ANTIVIRUS APK"
          echo "=========================================="

          python -m buildozer --version

          python -m buildozer -v android debug


      # =====================================================
      # 11. Find APK
      # =====================================================
      - name: Find APK
        if: always()
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "APK FILES"
          echo "=========================================="

          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print


      # =====================================================
      # 12. Upload APK
      # =====================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error


      # =====================================================
      # 13. Upload Build Logs
      # =====================================================
      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Buildozer-Logs
          path: |
            .buildozer/android/platform/python-for-android/
            .buildozer/android/platform/build-*/build/
            .buildozer/android/platform/*/build/
            buildozer.spec
          if-no-files-found: warn
