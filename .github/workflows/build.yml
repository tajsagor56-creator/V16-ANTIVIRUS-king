name: V16 Antivirus APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # ১. Repository Checkout
      # ==========================================
      - name: Repository Checkout
        uses: actions/checkout@v5

      # ==========================================
      # ২. Python সেটআপ
      # ==========================================
      - name: Python Setup
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # ==========================================
      # ৩. Java সেটআপ
      # ==========================================
      - name: Java Setup
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      # ==========================================
      # ৪. Linux Package ইনস্টল
      # ==========================================
      - name: Linux Package ইনস্টল
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake

      # ==========================================
      # ৫. Python Build Package ইনস্টল
      # ==========================================
      - name: Buildozer ইনস্টল
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37

      # ==========================================
      # ৬. Project পরীক্ষা
      # ==========================================
      - name: Project পরীক্ষা
        run: |
          set -e

          echo "=========================================="
          echo "V16 ANTIVIRUS"
          echo "=========================================="

          echo
          echo "Python:"
          python --version

          echo
          echo "Java:"
          java -version

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "Project Files:"
          ls -la

      # ==========================================
      # ৭. main.py Syntax পরীক্ষা
      # ==========================================
      - name: Python Syntax পরীক্ষা
        run: |
          set -e

          python -m py_compile main.py

          echo
          echo "main.py syntax ঠিক আছে।"

      # ==========================================
      # ৮. পুরোনো Build Cache পরিষ্কার
      # ==========================================
      - name: Build Cache পরিষ্কার
        run: |
          set -e

          echo "=========================================="
          echo "BUILD CACHE CLEAN"
          echo "=========================================="

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

          echo "পুরোনো Build cache পরিষ্কার হয়েছে।"

      # ==========================================
      # ৯. System Android SDK নির্ধারণ
      # ==========================================
      - name: System Android SDK সেটআপ
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK SETUP"
          echo "=========================================="

          SDK_ROOT="/usr/local/lib/android/sdk"

          echo "SDK ROOT:"
          echo "$SDK_ROOT"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK পাওয়া যায়নি।"
            exit 1
          fi

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager পাওয়া যায়নি।"

            echo
            echo "sdkmanager খোঁজা হচ্ছে..."

            find "$SDK_ROOT" \
              -type f \
              -name sdkmanager \
              -print || true

            exit 1
          fi

          echo
          echo "sdkmanager পাওয়া গেছে:"
          echo "$SDKMANAGER"

          echo
          echo "sdkmanager version:"
          "$SDKMANAGER" --version

          # GitHub Actions-এর পরবর্তী step-গুলোর জন্য SDK path স্থায়ী করা
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo
          echo "Android SDK environment প্রস্তুত হয়েছে।"

      # ==========================================
      # ১০. Android SDK Components প্রস্তুত
      # ==========================================
      - name: Android SDK Components প্রস্তুত
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID COMPONENTS"
          echo "=========================================="

          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "SDK:"
          echo "$SDK_ROOT"

          echo
          echo "License গ্রহণ করা হচ্ছে..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo
          echo "Android API 35 এবং Build-Tools ইনস্টল করা হচ্ছে..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo
          echo "Installed Build-Tools:"
          ls -la "$SDK_ROOT/build-tools"

          echo
          echo "Installed Platforms:"
          ls -la "$SDK_ROOT/platforms"

      # ==========================================
      # ১১. Buildozer-কে System SDK ব্যবহার করতে বাধ্য করা
      # ==========================================
      - name: Buildozer SDK Environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDOZER SDK ENVIRONMENT"
          echo "=========================================="

          SDK_ROOT="/usr/local/lib/android/sdk"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROIDSDK="$SDK_ROOT"

          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROIDSDK=$ANDROIDSDK"

          echo
          echo "sdkmanager:"
          command -v sdkmanager

          echo
          echo "sdkmanager version:"
          sdkmanager --version

          echo
          echo "AIDL:"
          find "$SDK_ROOT/build-tools" \
            -type f \
            -name aidl \
            -print

          echo
          echo "System SDK প্রস্তুত।"

      # ==========================================
      # ১২. APK Build
      # ==========================================
      - name: APK তৈরি
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "V16 ANTIVIRUS APK BUILD"
          echo "=========================================="

          SDK_ROOT="/usr/local/lib/android/sdk"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROIDSDK="$SDK_ROOT"

          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          echo
          echo "Final SDK:"
          echo "$ANDROID_HOME"

          echo
          echo "sdkmanager:"
          command -v sdkmanager

          echo
          echo "Buildozer শুরু হচ্ছে..."

          buildozer -v android debug

      # ==========================================
      # ১৩. APK পরীক্ষা
      # ==========================================
      - name: APK পরীক্ষা
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "GENERATED APK"
          echo "=========================================="

          if find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | grep -q ".apk"; then

            echo "APK সফলভাবে তৈরি হয়েছে।"

            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -exec ls -lh {} \;

          else

            echo "ERROR: APK তৈরি হয়নি।"

            echo
            echo "APK খোঁজা হচ্ছে..."

            find . \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print || true

            exit 1
          fi

      # ==========================================
      # ১৪. APK Artifact Upload
      # ==========================================
      - name: APK Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: "bin/*.apk"
          if-no-files-found: error
