name: V16 Antivirus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # 01 - Checkout
      # =========================================================
      - name: 01 - Checkout source
        uses: actions/checkout@v4

      # =========================================================
      # 02 - Python
      # =========================================================
      - name: 02 - Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =========================================================
      # 03 - Java 17
      # =========================================================
      - name: 03 - Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 04 - Android SDK
      # =========================================================
      - name: 04 - Setup Android SDK
        uses: android-actions/setup-android@v3

      # =========================================================
      # 05 - Install Android SDK / NDK
      # =========================================================
      - name: 05 - Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmdline-tools;latest" \
            "ndk;28.2.13676358"

      # =========================================================
      # 06 - Android Environment
      # =========================================================
      - name: 06 - Configure Android environment
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$ANDROID_HOME"
          NDK="$ANDROID_HOME/ndk/28.2.13676358"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "ANDROIDNDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          echo "ANDROIDAPI=35" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=24" >> "$GITHUB_ENV"
          echo "NDKAPI=24" >> "$GITHUB_ENV"

      # =========================================================
      # 07 - Verify Environment
      # =========================================================
      - name: 07 - Verify Environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "BUILD ENVIRONMENT"
          echo "=========================================="

          python --version
          python -m pip --version
          java -version
          sdkmanager --version

          echo
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"
          echo "NDKAPI=$NDKAPI"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -d "$ANDROID_HOME/ndk/28.2.13676358"

      # =========================================================
      # 08 - Install Buildozer
      # =========================================================
      - name: 08 - Install Build Dependencies
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            setuptools \
            wheel

      # =========================================================
      # 09 - Verify p4a version
      # =========================================================
      - name: 09 - Verify python-for-android
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install \
            python-for-android==2026.5.9

          python -m pythonforandroid.toolchain --help >/dev/null

          echo "python-for-android:"
          python -m pip show python-for-android

      # =========================================================
      # 10 - Verify Project
      # =========================================================
      - name: 10 - Verify project
        shell: bash
        run: |
          set -euxo pipefail

          test -f main.py
          test -f buildozer.spec

          echo "main.py: OK"
          echo "buildozer.spec: OK"

      # =========================================================
      # 11 - Show Configuration
      # =========================================================
      - name: 11 - Show configuration
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "PYTHON"
          echo "=========================================="

          python --version
          python -m pip --version

          echo
          echo "=========================================="
          echo "BUILDOZER"
          echo "=========================================="

          buildozer --version

          echo
          echo "=========================================="
          echo "P4A"
          echo "=========================================="

          python -m pip show python-for-android

          echo
          echo "=========================================="
          echo "SPEC"
          echo "=========================================="

          cat buildozer.spec

      # =========================================================
      # 12 - Clean
      # =========================================================
      - name: 12 - Clean previous build
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

      # =========================================================
      # 13 - Build APK
      # =========================================================
      - name: 13 - Build APK
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_CACHE_DIR: "1"

        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "V16 ANTIVIRUS APK BUILD"
          echo "=========================================="

          echo
          echo "Python:"
          python --version

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "P4A:"
          python -m pip show python-for-android

          echo
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo
          echo "Android NDK:"
          echo "$ANDROID_NDK"

          echo
          echo "Android API:"
          echo "$ANDROIDAPI"

          echo
          echo "Minimum API:"
          echo "$ANDROIDMINAPI"

          echo
          echo "=========================================="
          echo "SPEC REQUIREMENTS"
          echo "=========================================="

          grep -E \
            '^(requirements|android.api|android.minapi|android.ndk|android.ndk_api|android.archs|p4a.branch|p4a.commit)' \
            buildozer.spec || true

          echo
          echo "=========================================="
          echo "START BUILD"
          echo "=========================================="

          buildozer -v android debug

      # =========================================================
      # 14 - Verify APK
      # =========================================================
      - name: 14 - Verify APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "APK RESULT"
          echo "=========================================="

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo
          echo "APK FOUND:"
          echo "$APK"

          echo
          echo "APK SIZE:"
          ls -lh "$APK"

      # =========================================================
      # 15 - Upload APK
      # =========================================================
      - name: 15 - Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-Pro-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
