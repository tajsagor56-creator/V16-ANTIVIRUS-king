name: V16 Antivirus APK Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # ১. Repository Checkout
      # ==========================================
      - name: Repository Checkout
        uses: actions/checkout@v4


      # ==========================================
      # ২. Python 3.11 সেটআপ
      # ==========================================
      - name: Python সেটআপ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # ৩. Java 17 সেটআপ
      # ==========================================
      - name: Java সেটআপ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # ৪. প্রয়োজনীয় Linux Package ইনস্টল
      # ==========================================
      - name: Linux Package ইনস্টল
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            curl \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake


      # ==========================================
      # ৫. Buildozer ইনস্টল
      # ==========================================
      - name: Buildozer ইনস্টল
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37


      # ==========================================
      # ৬. Project পরীক্ষা
      # ==========================================
      - name: Project পরীক্ষা
        run: |
          echo "=========================================="
          echo "PROJECT FILES"
          echo "=========================================="

          ls -la

          echo
          echo "=========================================="
          echo "PYTHON"
          echo "=========================================="

          python --version

          echo
          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          echo
          echo "=========================================="
          echo "BUILDOZER"
          echo "=========================================="

          buildozer --version


      # ==========================================
      # ৭. main.py Syntax পরীক্ষা
      # ==========================================
      - name: Python Syntax পরীক্ষা
        run: |
          python -m py_compile main.py

          echo
          echo "=========================================="
          echo "main.py SYNTAX OK"
          echo "=========================================="


      # ==========================================
      # ৮. Android SDK পরীক্ষা
      # ==========================================
      - name: Android SDK পরীক্ষা
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK পরীক্ষা"
          echo "=========================================="

          SYSTEM_SDK="/usr/local/lib/android/sdk"

          echo "SYSTEM SDK:"
          echo "$SYSTEM_SDK"

          if [ ! -d "$SYSTEM_SDK" ]; then
            echo "ERROR: Android SDK পাওয়া যায়নি।"
            exit 1
          fi

          echo
          echo "SDK DIRECTORY:"
          ls -la "$SYSTEM_SDK"

          echo
          echo "SDKMANAGER খোঁজা হচ্ছে..."

          find "$SYSTEM_SDK" \
            -type f \
            -name "sdkmanager" \
            -print || true


      # ==========================================
      # ৯. Android SDK Components ইনস্টল
      # ==========================================
      - name: Android SDK Components
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID COMPONENTS"
          echo "=========================================="

          SYSTEM_SDK="/usr/local/lib/android/sdk"

          SDKMANAGER="$(find "$SYSTEM_SDK" \
            -type f \
            -name "sdkmanager" \
            -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager পাওয়া যায়নি।"
            exit 1
          fi

          echo "SDKMANAGER:"
          echo "$SDKMANAGER"

          chmod +x "$SDKMANAGER"

          mkdir -p "$SYSTEM_SDK/licenses"

          cat > "$SYSTEM_SDK/licenses/android-sdk-license" << 'EOF'
24333f8a63b6825ea9c5514f83c2829b004d1fee
d56f5187479451eabf01fb78af6dfcb131a6481e
EOF

          yes | "$SDKMANAGER" \
            --sdk_root="$SYSTEM_SDK" \
            --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$SYSTEM_SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo
          echo "=========================================="
          echo "AIDL পরীক্ষা"
          echo "=========================================="

          AIDL="$SYSTEM_SDK/build-tools/35.0.0/aidl"

          if [ ! -f "$AIDL" ]; then
            echo "ERROR: AIDL পাওয়া যায়নি।"

            find "$SYSTEM_SDK/build-tools" \
              -type f \
              -name "aidl" \
              -print || true

            exit 1
          fi

          chmod +x "$AIDL"

          echo "AIDL পাওয়া গেছে:"
          "$AIDL" --version || true


      # ==========================================
      # ১০. Buildozer-এর SDK Path প্রস্তুত
      # ==========================================
      - name: Buildozer SDK Path প্রস্তুতি
        run: |
          set -e

          echo "=========================================="
          echo "BUILDOZER SDK PATH"
          echo "=========================================="

          SYSTEM_SDK="/usr/local/lib/android/sdk"
          BUILD_SDK="$HOME/.buildozer/android/platform/android-sdk"

          rm -rf "$HOME/.buildozer"

          mkdir -p "$BUILD_SDK"

          echo "Buildozer SDK:"
          echo "$BUILD_SDK"

          echo
          echo "System SDK:"
          echo "$SYSTEM_SDK"


          # ==========================================
          # System SDK-এর অংশগুলো Buildozer SDK-তে link
          # ==========================================

          ln -s \
            "$SYSTEM_SDK/platform-tools" \
            "$BUILD_SDK/platform-tools"

          ln -s \
            "$SYSTEM_SDK/platforms" \
            "$BUILD_SDK/platforms"

          ln -s \
            "$SYSTEM_SDK/build-tools" \
            "$BUILD_SDK/build-tools"

          ln -s \
            "$SYSTEM_SDK/cmdline-tools" \
            "$BUILD_SDK/cmdline-tools"


          # ==========================================
          # Buildozer পুরোনো tools path আশা করে
          # তাই tools directory তৈরি করা হচ্ছে
          # ==========================================

          mkdir -p "$BUILD_SDK/tools"

          ln -s \
            "$SYSTEM_SDK/cmdline-tools/latest" \
            "$BUILD_SDK/tools/latest"

          mkdir -p "$BUILD_SDK/tools/bin"

          ln -s \
            "$SYSTEM_SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$BUILD_SDK/tools/bin/sdkmanager"


          # ==========================================
          # License
          # ==========================================

          mkdir -p "$BUILD_SDK/licenses"

          cat > "$BUILD_SDK/licenses/android-sdk-license" << 'EOF'
24333f8a63b6825ea9c5514f83c2829b004d1fee
d56f5187479451eabf01fb78af6dfcb131a6481e
EOF


          # ==========================================
          # sdkmanager পরীক্ষা
          # ==========================================

          echo
          echo "=========================================="
          echo "BUILDOZER SDK CHECK"
          echo "=========================================="

          if [ ! -x "$BUILD_SDK/tools/bin/sdkmanager" ]; then
            echo "ERROR: Buildozer sdkmanager তৈরি হয়নি।"

            find "$BUILD_SDK" \
              -type f \
              -name "sdkmanager" \
              -print || true

            exit 1
          fi

          echo "Buildozer sdkmanager:"
          "$BUILD_SDK/tools/bin/sdkmanager" --version


          # ==========================================
          # AIDL পরীক্ষা
          # ==========================================

          echo
          echo "AIDL:"

          "$BUILD_SDK/build-tools/35.0.0/aidl" \
            --version || true


      # ==========================================
      # ১১. Build Cache পরিষ্কার
      # ==========================================
      - name: Build Cache পরিষ্কার
        run: |
          echo "=========================================="
          echo "BUILD CACHE CLEAN"
          echo "=========================================="

          rm -rf bin

          mkdir -p bin


      # ==========================================
      # ১২. Buildozer APK তৈরি
      # ==========================================
      - name: APK তৈরি
        run: |
          set -e

          echo "=========================================="
          echo "V16 ANTIVIRUS APK BUILD"
          echo "=========================================="

          buildozer -v android debug


      # ==========================================
      # ১৩. APK পরীক্ষা
      # ==========================================
      - name: APK পরীক্ষা
        if: always()
        run: |
          echo
          echo "=========================================="
          echo "GENERATED APK"
          echo "=========================================="

          if [ -d bin ] && \
             find bin \
             -maxdepth 1 \
             -type f \
             -name "*.apk" \
             | grep -q ".apk"; then

            echo "APK সফলভাবে তৈরি হয়েছে।"

            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -exec ls -lh {} \;

          else

            echo "ERROR: APK তৈরি হয়নি।"

            echo
            echo "পুরো Project-এ APK খোঁজা হচ্ছে..."

            find . \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print || true

            echo
            echo "Build directory:"
            find .buildozer \
              -maxdepth 4 \
              -type d \
              -print 2>/dev/null || true

            exit 1

          fi


      # ==========================================
      # ১৪. APK Upload
      # ==========================================
      - name: APK Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: bin/*.apk
          if-no-files-found: error
