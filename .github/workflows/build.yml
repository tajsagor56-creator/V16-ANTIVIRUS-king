name: V16 Antivirus APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      # ==========================================
      # 3. Java 17
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 4. System packages
      # ==========================================
      - name: Install System Packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake


      # ==========================================
      # 5. Python build tools
      # ==========================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37 \
            virtualenv


      # ==========================================
      # 6. Validate project
      # ==========================================
      - name: Validate Project
        run: |
          echo "=============================="
          echo "PROJECT FILES"
          echo "=============================="

          ls -la

          echo
          echo "Python:"
          python --version

          echo
          echo "Java:"
          java -version

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "Checking main.py..."

          python -m py_compile main.py

          echo
          echo "main.py syntax OK"


      # ==========================================
      # 7. Clean Build
      # ==========================================
      - name: Clean Build
        run: |
          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin


      # ==========================================
      # 8. Build APK
      # ==========================================
      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |
          echo "=============================="
          echo "STARTING BUILDOZER"
          echo "=============================="

          buildozer -v android debug


      # ==========================================
      # 9. Check APK
      # ==========================================
      - name: Check APK
        if: always()
        run: |

          echo "=============================="
          echo "GENERATED APK"
          echo "=============================="

          if compgen -G "bin/*.apk" > /dev/null; then

            echo "APK FOUND:"
            ls -lh bin/*.apk

          else

            echo "ERROR: APK was not generated."

            echo
            echo "Searching entire project..."

            find . \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print || true

            exit 1

          fi


      # ==========================================
      # 10. Upload APK
      # ==========================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: bin/*.apk
          if-no-files-found: error
