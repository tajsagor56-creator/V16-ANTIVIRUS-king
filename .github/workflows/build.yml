name: V16 Antivirus APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # ১. Repository Checkout
      # ==========================================
      - name: Repository Checkout
        uses: actions/checkout@v5


      # ==========================================
      # ২. Python Setup
      # ==========================================
      - name: Python Setup
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ==========================================
      # ৩. Java Setup
      # ==========================================
      - name: Java Setup
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"


      # ==========================================
      # ৪. Linux Package
      # ==========================================
      - name: Linux Package ইনস্টল
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake


      # ==========================================
      # ৫. Python Build Package
      # ==========================================
      - name: Buildozer ইনস্টল
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37


      # ==========================================
      # ৬. Project Check
      # ==========================================
      - name: Project পরীক্ষা
        run: |
          echo "=========================================="
          echo "V16 ANTIVIRUS"
          echo "=========================================="

          echo
          echo "Python:"
          python --version

          echo
          echo "Java:"
          java -version

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "Project Files:"
          ls -la


      # ==========================================
      # ৭. main.py Syntax Check
      # ==========================================
      - name: Python Syntax পরীক্ষা
        run: |
          python -m py_compile main.py

          echo
          echo "main.py syntax ঠিক আছে"


      # ==========================================
      # ৮. পুরোনো Build পরিষ্কার
      # ==========================================
      - name: Build পরিষ্কার
        run: |
          echo "=========================================="
          echo "BUILD CLEAN"
          echo "=========================================="

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

          echo "Build directory প্রস্তুত হয়েছে"

                  # ==========================================
      # ৯. Android SDK প্রস্তুত করা
      # ==========================================
      - name: Android SDK প্রস্তুত করা
        run: |
          echo "=========================================="
          echo "ANDROID SDK প্রস্তুত করা হচ্ছে"
          echo "=========================================="

          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SYSTEM_SDK="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SYSTEM_SDK="$ANDROID_SDK_ROOT"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SYSTEM_SDK="/usr/local/lib/android/sdk"
          else
            echo "ERROR: Android SDK পাওয়া যায়নি।"
            exit 1
          fi

          echo "System SDK:"
          echo "$SYSTEM_SDK"

          echo
          echo "sdkmanager খোঁজা হচ্ছে..."

          SDKMANAGER="$(find "$SYSTEM_SDK" \
            -type f \
            -name "sdkmanager" \
            -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager পাওয়া যায়নি।"
            exit 1
          fi

          echo "sdkmanager পাওয়া গেছে:"
          echo "$SDKMANAGER"

          echo
          echo "Android SDK license প্রস্তুত করা হচ্ছে..."

          mkdir -p "$SYSTEM_SDK/licenses"

          printf '%s\n' \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            > "$SYSTEM_SDK/licenses/android-sdk-license"

          echo
          echo "SDK license গ্রহণ করা হচ্ছে..."

          yes | "$SDKMANAGER" \
            --sdk_root="$SYSTEM_SDK" \
            --licenses || true

          echo
          echo "Android components ইনস্টল করা হচ্ছে..."

          "$SDKMANAGER" \
            --sdk_root="$SYSTEM_SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;37.0.0"

          echo
          echo "Build-Tools পরীক্ষা..."

          ls -la "$SYSTEM_SDK/build-tools" || true

          echo
          echo "AIDL খোঁজা হচ্ছে..."

          find "$SYSTEM_SDK/build-tools" \
            -type f \
            -name "aidl" \
            -print || true



      # ==========================================
      # ১০. Build Tools যাচাই
      # ==========================================
      - name: Build Tools যাচাই
        run: |
          echo "=========================================="
          echo "BUILD TOOLS যাচাই"
          echo "=========================================="

          SYSTEM_SDK="/usr/local/lib/android/sdk"

          echo
          echo "Build Tools:"
          ls -la "$SYSTEM_SDK/build-tools" || true

          echo
          echo "AIDL:"
          find "$SYSTEM_SDK/build-tools" \
            -type f \
            -name "aidl" \
            -print || true

          if find "$SYSTEM_SDK/build-tools" \
            -type f \
            -name "aidl" \
            | grep -q "aidl"; then

            echo
            echo "AIDL পাওয়া গেছে।"

          else

            echo
            echo "ERROR: AIDL পাওয়া যায়নি।"
            exit 1

          fi


      # ==========================================
      # ১১. APK তৈরি
      # ==========================================
      - name: APK তৈরি
        run: |
          echo "=========================================="
          echo "V16 ANTIVIRUS APK BUILD"
          echo "=========================================="

          buildozer -v android debug


      # ==========================================
      # ১২. APK পরীক্ষা
      # ==========================================
      - name: APK পরীক্ষা
        if: always()
        run: |
          echo "=========================================="
          echo "GENERATED APK"
          echo "=========================================="

          if [ -d "bin" ] && \
             find bin \
             -maxdepth 1 \
             -type f \
             -name "*.apk" \
             | grep -q ".apk"; then

            echo "APK সফলভাবে তৈরি হয়েছে।"

            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -exec ls -lh {} \;

          else

            echo "ERROR: APK তৈরি হয়নি."

            echo
            echo "APK খোঁজা হচ্ছে..."

            find . \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print || true

            exit 1

          fi


      # ==========================================
      # ১৩. APK Upload
      # ==========================================
      - name: APK Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: "bin/*.apk"
          if-no-files-found: error
