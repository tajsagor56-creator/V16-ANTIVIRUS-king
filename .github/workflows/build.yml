name: V16 Antivirus APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.3.13750724
      ANDROID_NDK: /usr/local/lib/android/sdk/ndk/27.3.13750724

    steps:

      # =====================================================
      # 1. Checkout
      # =====================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # 2. Python 3.11
      # =====================================================
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # =====================================================
      # 3. Java 17
      # =====================================================
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # =====================================================
      # 4. Verify Python + Java
      # =====================================================
      - name: Verify Python and Java
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "PYTHON"
          echo "=========================================="

          python --version
          which python

          echo
          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          JAVA_HOME_CHECK="$JAVA_HOME"

          echo
          echo "JAVA_HOME:"
          echo "$JAVA_HOME_CHECK"

          if ! java -version 2>&1 | grep -q '"17'; then
            echo "ERROR: Java 17 active হয়নি."
            exit 1
          fi

          echo "Java 17 OK."


      # =====================================================
      # 5. Install Buildozer
      # =====================================================
      - name: Install Buildozer
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "INSTALLING BUILDOZER"
          echo "=========================================="

          python -m pip install --upgrade pip

          python -m pip install \
            "buildozer==1.5.0" \
            "cython<3" \
            "virtualenv"

          echo
          echo "Installed packages:"
          python -m pip list


      # =====================================================
      # 6. Verify Buildozer WITHOUT PATH dependency
      # =====================================================
      - name: Verify Buildozer
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "BUILDOZER TEST"
          echo "=========================================="

          python -m pip show buildozer

          echo
          echo "Python module:"
          python -c "import buildozer; print(buildozer.__file__)"

          echo
          echo "Buildozer version:"
          python -m buildozer --version

          echo
          echo "Buildozer module works."


      # =====================================================
      # 7. Android SDK
      # =====================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -eux

          SDK="$ANDROID_HOME"

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          test -d "$SDK"

          echo
          echo "SDK:"
          echo "$SDK"

          echo
          echo "Build Tools:"
          ls -la "$SDK/build-tools"

          echo
          echo "Platforms:"
          ls -la "$SDK/platforms"

          echo
          echo "NDK:"
          ls -la "$SDK/ndk"


      # =====================================================
      # 8. Verify required Android components
      # =====================================================
      - name: Verify Android Components
        shell: bash
        run: |
          set -eux

          SDK="$ANDROID_HOME"

          echo "=========================================="
          echo "ANDROID COMPONENT CHECK"
          echo "=========================================="

          test -d "$SDK/platforms/android-35"

          test -d "$SDK/build-tools/35.0.0"

          test -x "$SDK/build-tools/35.0.0/aidl"

          test -d "$SDK/ndk/27.3.13750724"

          echo
          echo "Android 35: OK"
          echo "Build Tools 35.0.0: OK"
          echo "AIDL: OK"
          echo "NDK 27.3.13750724: OK"


      # =====================================================
      # 9. Check project
      # =====================================================
      - name: Check project
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "PROJECT"
          echo "=========================================="

          pwd

          echo
          echo "Repository files:"
          find . -maxdepth 2 -type f | sort

          echo
          echo "Checking main.py..."

          test -f main.py

          echo "main.py OK."

          echo
          echo "Checking buildozer.spec..."

          test -f buildozer.spec

          echo "buildozer.spec OK."


      # =====================================================
      # 10. Show buildozer.spec
      # =====================================================
      - name: Show Buildozer configuration
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "BUILDOZER SPEC"
          echo "=========================================="

          cat buildozer.spec


      # =====================================================
      # 11. Prepare log directory
      # =====================================================
      - name: Prepare build
        shell: bash
        run: |
          set -eux

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin
          mkdir -p build-logs

          echo "Build directory prepared."


      # =====================================================
      # 12. BUILD APK
      # =====================================================
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail

          echo "=========================================="
          echo "V16 ANTIVIRUS APK BUILD"
          echo "=========================================="

          mkdir -p build-logs

          echo
          echo "Python:"
          python --version

          echo
          echo "Java:"
          java -version 2>&1

          echo
          echo "Buildozer:"
          python -m buildozer --version

          echo
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo
          echo "ANDROID_NDK:"
          echo "$ANDROID_NDK"

          echo
          echo "=========================================="
          echo "START BUILD"
          echo "=========================================="

          python -m buildozer -v android debug \
            2>&1 | tee build-logs/buildozer-full.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo
          echo "Build exit code: $BUILD_EXIT"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo
            echo "=========================================="
            echo "BUILD FAILED"
            echo "=========================================="

            exit "$BUILD_EXIT"
          fi

          echo
          echo "BUILD COMMAND SUCCESSFUL."


      # =====================================================
      # 13. Find APK
      # =====================================================
      - name: Find APK
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p build-logs

          echo "=========================================="
          echo "APK SEARCH"
          echo "=========================================="

          echo
          echo "BIN:"
          ls -lah bin 2>&1 || true

          echo
          echo "All APK files:"

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*" \
            -print \
            2>&1 | tee build-logs/apk-list.txt

          echo
          echo "APK count:"

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*" \
            2>/dev/null | wc -l


      # =====================================================
      # 14. Diagnostic information
      # =====================================================
      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p build-logs

          {
            echo "========== PYTHON =========="
            python --version
            which python

            echo
            echo "========== BUILDOZER =========="
            python -m pip show buildozer

            echo
            python -m buildozer --version

            echo
            echo "========== JAVA =========="
            java -version 2>&1

            echo
            echo "JAVA_HOME=$JAVA_HOME"

            echo
            echo "========== ANDROID =========="
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_NDK=$ANDROID_NDK"

            echo
            echo "========== SDK =========="
            ls -la "$ANDROID_HOME"

            echo
            echo "========== BUILD TOOLS =========="
            ls -la "$ANDROID_HOME/build-tools"

            echo
            echo "========== PLATFORMS =========="
            ls -la "$ANDROID_HOME/platforms"

            echo
            echo "========== NDK =========="
            ls -la "$ANDROID_HOME/ndk"

          } > build-logs/environment.txt 2>&1


      # =====================================================
      # 15. Upload logs
      # =====================================================
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Build-Logs
          path: |
            build-logs/**
          if-no-files-found: warn
          retention-days: 14


      # =====================================================
      # 16. Upload APK
      # =====================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: |
            bin/*.apk
          if-no-files-found: error
          retention-days: 30


      # =====================================================
      # 17. Final result
      # =====================================================
      - name: Final result
        if: always()
        shell: bash
        run: |
          echo
          echo "=========================================="
          echo "FINAL RESULT"
          echo "=========================================="

          if find bin -maxdepth 1 -type f -name "*.apk" | grep -q .; then

            echo
            echo "=========================================="
            echo "SUCCESS"
            echo "APK তৈরি হয়েছে।"
            echo "=========================================="

            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -exec ls -lh {} \;

          else

            echo
            echo "=========================================="
            echo "FAILED"
            echo "APK তৈরি হয়নি।"
            echo "=========================================="

          fi
