name: V16 Antivirus APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.6.0"
          python -m pip install "Cython<3"

      - name: Check project
        run: |
          echo "=============================="
          echo "PROJECT FILES"
          echo "=============================="
          find . -maxdepth 3 -type f \
            ! -path './.git/*' \
            -print

          echo
          echo "=============================="
          echo "PYTHON"
          echo "=============================="
          python --version

          echo
          echo "=============================="
          echo "JAVA"
          echo "=============================="
          java -version

          echo
          echo "=============================="
          echo "BUILDOZER"
          echo "=============================="
          buildozer --version

          echo
          echo "=============================="
          echo "CHECK MAIN.PY"
          echo "=============================="
          test -f main.py
          python -m py_compile main.py

          echo "main.py syntax OK"

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin
          mkdir -p bin

      - name: Build APK
        env:
          PIP_NO_INPUT: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=============================="
          echo "STARTING BUILDOZER"
          echo "=============================="

          buildozer -v android debug

      - name: Inspect Build Output
        if: always()
        run: |
          echo
          echo "=============================="
          echo "BUILD DIRECTORY"
          echo "=============================="

          find . -maxdepth 4 -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print || true

          echo
          echo "=============================="
          echo "BIN DIRECTORY"
          echo "=============================="

          ls -lah bin || true

          echo
          echo "=============================="
          echo "BUILDOZER LOG FILES"
          echo "=============================="

          find .buildozer -type f \
            \( -name "*.log" -o -name "*.txt" \) \
            -print 2>/dev/null | head -50 || true

      - name: Verify APK
        if: success()
        run: |
          echo "=============================="
          echo "GENERATED APK"
          echo "=============================="

          APK=$(find bin -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          ls -lh "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-Pro-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload Build Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Build-Diagnostics
          path: |
            buildozer.spec
            main.py
            .buildozer/
          if-no-files-found: ignore
