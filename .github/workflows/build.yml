name: V16 Antivirus APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux packages
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            build-essential

      - name: Install Python build tools
        run: |
          set -eux

          python -m pip install --upgrade pip

          python -m pip install \
            "buildozer==1.6.0" \
            "cython==0.29.37" \
            "sh<2.0,>=1.10" \
            "setuptools<70"

      - name: Check project
        run: |
          set -eux

          echo "=========================================="
          echo "PROJECT CHECK"
          echo "=========================================="

          python --version
          java -version
          buildozer --version

          test -f main.py
          test -f buildozer.spec

          python -m py_compile main.py

          echo "main.py syntax OK"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -eux

          SDK="/usr/local/lib/android/sdk"

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          test -d "$SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "SDK=$SDK"

          find "$SDK" \
            -maxdepth 4 \
            -type f \
            \( -name sdkmanager -o -name aidl \) \
            -print || true

      - name: Install Android SDK components
        shell: bash
        run: |
          set -eux

          SDK="/usr/local/lib/android/sdk"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.3.13750724"

          echo "=========================================="
          echo "SDK COMPONENTS"
          echo "=========================================="

          test -d "$SDK/build-tools/35.0.0"
          test -x "$SDK/build-tools/35.0.0/aidl"

          test -d "$SDK/platforms/android-35"
          test -d "$SDK/ndk/27.3.13750724"

          "$SDK/build-tools/35.0.0/aidl" --version || true

      - name: Configure Android environment
        shell: bash
        run: |
          set -eux

          SDK="/usr/local/lib/android/sdk"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=$SDK/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$SDK/ndk/27.3.13750724" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Verify Android environment
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "ANDROID ENVIRONMENT"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          command -v adb || true
          command -v sdkmanager || true
          command -v aidl || true

          test -x "$ANDROID_HOME/build-tools/35.0.0/aidl"
          test -d "$ANDROID_NDK_HOME"

          echo "AIDL:"
          "$ANDROID_HOME/build-tools/35.0.0/aidl" --version || true

      - name: Clean Buildozer
        run: |
          set -eux

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail

          echo "=========================================="
          echo "V16 ANTIVIRUS APK BUILD"
          echo "=========================================="

          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          export ANDROIDSDK="/usr/local/lib/android/sdk"

          export ANDROID_NDK_HOME="/usr/local/lib/android/sdk/ndk/27.3.13750724"
          export ANDROID_NDK_ROOT="/usr/local/lib/android/sdk/ndk/27.3.13750724"
          export ANDROID_NDK="/usr/local/lib/android/sdk/ndk/27.3.13750724"

          export PATH="/usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:/usr/local/lib/android/sdk/build-tools/35.0.0:$PATH"

          buildozer -v android debug 2>&1 | tee buildozer-build.log

      - name: Show APK
        if: always()
        run: |
          echo "=========================================="
          echo "APK RESULT"
          echo "=========================================="

          find bin \
            -maxdepth 1 \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload Buildozer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Buildozer-Log
          path: |
            buildozer-build.log
            .buildozer/android/platform/python-for-android/*.log
            .buildozer/android/platform/build-*/**/*.log
          if-no-files-found: warn
