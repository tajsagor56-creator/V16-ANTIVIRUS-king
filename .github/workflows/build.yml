name: V16 Antivirus APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.3.13750724
      ANDROID_NDK: /usr/local/lib/android/sdk/ndk/27.3.13750724

    steps:

      # =====================================================
      # 1. Checkout
      # =====================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # 2. Python 3.11
      # =====================================================
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # =====================================================
      # 3. Java 17
      # =====================================================
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # =====================================================
      # 4. Verify Python + Java
      # =====================================================
      - name: Verify Python and Java
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "PYTHON"
          echo "=========================================="

          python --version
          which python

          echo
          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          JAVA_HOME_CHECK="$JAVA_HOME"

          echo
          echo "JAVA_HOME:"
          echo "$JAVA_HOME_CHECK"

          if ! java -version 2>&1 | grep -q '"17'; then
            echo "ERROR: Java 17 active হয়নি."
            exit 1
          fi

          echo "Java 17 OK."


      # =====================================================
      # 5. Install Buildozer
      # =====================================================
      - name: Install Buildozer
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "INSTALLING BUILDOZER"
          echo "=========================================="

          python -m pip install --upgrade pip

          python -m pip install \
            "buildozer==1.5.0" \
            "cython<3" \
            "virtualenv"

          echo
          echo "Installed packages:"
          python -m pip list

      # =====================================================
      # 6. Buildozer Test
      # =====================================================
      - name: Test Buildozer
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "BUILDOZER TEST"
          echo "=========================================="

          python -m pip show buildozer

          echo
          echo "Python module:"
          python -c "import buildozer; print(buildozer.__file__)"

          echo
          echo "Buildozer version:"
          python -m buildozer --version

          echo
          echo "Buildozer executable:"
          command -v buildozer || true

          echo
          echo "Buildozer module works."


      # =====================================================
      # 7. Verify Android SDK + NDK
      # =====================================================
      - name: Verify Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail

          SDK="/usr/local/lib/android/sdk"
          NDK="$SDK/ndk/27.3.13750724"

          echo "=========================================="
          echo "ANDROID SDK / NDK"
          echo "=========================================="

          test -d "$SDK"
          test -d "$SDK/platform-tools"
          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"
          test -x "$SDK/build-tools/35.0.0/aidl"

          echo
          echo "SDK:"
          echo "$SDK"

          echo
          echo "Build Tools:"
          ls -la "$SDK/build-tools/35.0.0"

          echo
          echo "AIDL:"
          "$SDK/build-tools/35.0.0/aidl" --version || true

          echo
          echo "NDK:"
          echo "$NDK"

          test -d "$NDK"
          test -x "$NDK/ndk-build"

          echo
          echo "NDK version:"
          cat "$NDK/source.properties"

          echo
          echo "NDK Build:"
          "$NDK/ndk-build" --version | head -n 5 || true

          echo
          echo "Android SDK and NDK are ready."


      # =====================================================
      # 8. Configure Android Environment
      # =====================================================
      - name: Configure Android Environment
        shell: bash
        run: |
          set -euxo pipefail

          SDK="/usr/local/lib/android/sdk"
          NDK="$SDK/ndk/27.3.13750724"

          echo "=========================================="
          echo "CONFIGURE ANDROID ENVIRONMENT"
          echo "=========================================="

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"

          echo
          echo "Environment variables configured."


      # =====================================================
      # 9. Install / Verify Android SDK Licenses
      # =====================================================
      - name: Verify Android SDK Licenses
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$ANDROID_HOME"

          echo "=========================================="
          echo "ANDROID SDK LICENSES"
          echo "=========================================="

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK/cmdline-tools/bin/sdkmanager"
          fi

          if [ -x "$SDKMANAGER" ]; then
            echo "sdkmanager:"
            "$SDKMANAGER" --version

            echo
            echo "Accepting Android SDK licenses..."

            yes | "$SDKMANAGER" \
              --sdk_root="$SDK" \
              --licenses || true
          else
            echo "sdkmanager not found."
            echo "Continuing because required SDK components already exist."
          fi

          echo
          echo "License check completed."


      # =====================================================
      # 10. Final Android Environment Test
      # =====================================================
      - name: Final Android Environment Test
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "FINAL ANDROID TEST"
          echo "=========================================="

          echo
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo
          echo "ANDROID_NDK_HOME:"
          echo "$ANDROID_NDK_HOME"

          echo
          echo "Java:"
          java -version

          echo
          echo "Python:"
          python --version

          echo
          echo "Buildozer:"
          python -m buildozer --version

          echo
          echo "AIDL:"
          command -v aidl || true

          "$ANDROID_HOME/build-tools/35.0.0/aidl" \
            --version || true

          echo
          echo "SDK check:"
          test -d "$ANDROID_HOME"

          echo
          echo "Platform check:"
          test -d "$ANDROID_HOME/platforms/android-35"

          echo
          echo "Build Tools check:"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo
          echo "NDK check:"
          test -d "$ANDROID_NDK_HOME"

          echo
          echo "=========================================="
          echo "ANDROID ENVIRONMENT OK"
          echo "=========================================="


      # =====================================================
      # 11. Check Project Files
      # =====================================================
      - name: Check Project Files
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "PROJECT FILE CHECK"
          echo "=========================================="

          echo
          echo "Current directory:"
          pwd

          echo
          echo "Project files:"
          ls -lah

          echo
          echo "buildozer.spec:"
          test -f buildozer.spec

          echo
          echo "main.py:"
          test -f main.py

          echo
          echo "requirements:"
          if [ -f requirements.txt ]; then
            cat requirements.txt
          else
            echo "No requirements.txt found."
            echo "Using requirements from buildozer.spec."
          fi

          echo
          echo "Project files OK."


      # =====================================================
      # 12. Validate Buildozer Configuration
      # =====================================================
      - name: Validate Buildozer Configuration
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "BUILDOZER CONFIGURATION"
          echo "=========================================="

          echo
          echo "Important Buildozer settings:"

          grep -E \
            '^(title|package.name|package.domain|source.include_exts|requirements|android.api|android.minapi|android.ndk|android.arch)' \
            buildozer.spec || true

          echo
          echo "Buildozer configuration detected."


      # =====================================================
      # 13. Build V16 Antivirus APK
      # =====================================================
      - name: Build V16 Antivirus APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "BUILD V16 ANTIVIRUS APK"
          echo "=========================================="

          python -m buildozer --version

          echo
          echo "Starting Buildozer..."

          python -m buildozer -v android debug

          echo
          echo "=========================================="
          echo "BUILD COMMAND FINISHED"
          echo "=========================================="


      # =====================================================
      # 14. Search APK / AAB
      # =====================================================
      - name: Find APK
        if: always()
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "SEARCHING APK / AAB"
          echo "=========================================="

          echo
          echo "bin directory:"
          ls -lah bin/ 2>/dev/null || true

          echo
          echo "All APK/AAB files:"

          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

          echo
          echo "APK search completed."


      # =====================================================
      # 15. Upload APK
      # =====================================================
      - name: Upload V16 Antivirus APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error


      # =====================================================
      # 16. Upload Build Logs
      # =====================================================
      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Buildozer-Full-Logs
          path: |
            .buildozer/
            buildozer.spec
            main.py
          if-no-files-found: warn
