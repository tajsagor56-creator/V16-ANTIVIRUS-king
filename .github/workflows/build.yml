name: V16 Antivirus APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build V16 Antivirus APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROIDSDK: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.3.13750724
      ANDROID_NDK: /usr/local/lib/android/sdk/ndk/27.3.13750724
      P4A_RELEASE: master

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # 3. Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # 4. Android Environment
      # ==========================================
      - name: Configure Android environment
        shell: bash
        run: |
          set -eux

          SDK="/usr/local/lib/android/sdk"
          NDK="$SDK/ndk/27.3.13750724"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"

      # ==========================================
      # 5. Check Android SDK
      # ==========================================
      - name: Check Android SDK
        shell: bash
        run: |
          set -eux

          SDK="/usr/local/lib/android/sdk"

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          test -d "$SDK"
          test -d "$SDK/platform-tools"

          echo
          echo "SDK:"
          ls -la "$SDK"

          echo
          echo "Build Tools:"
          ls -la "$SDK/build-tools" || true

          echo
          echo "Platforms:"
          ls -la "$SDK/platforms" || true

          echo
          echo "NDK:"
          ls -la "$SDK/ndk" || true

      # ==========================================
      # 6. Install/verify Android components
      # ==========================================
      - name: Install Android SDK components
        shell: bash
        run: |
          set -eux

          SDK="/usr/local/lib/android/sdk"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager পাওয়া যায়নি:"
            echo "$SDKMANAGER"
            exit 1
          fi

          echo "=========================================="
          echo "ANDROID SDK COMPONENTS"
          echo "=========================================="

          echo
          echo "sdkmanager:"
          "$SDKMANAGER" --version

          echo
          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses || true

          echo
          echo "Installing required components..."

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "platforms;android-35" \
            "build-tools;33.0.2" \
            "build-tools;35.0.0"

          echo
          echo "SDK components:"
          ls -la "$SDK/build-tools"
          ls -la "$SDK/platforms"

      # ==========================================
      # 7. Verify AIDL
      # ==========================================
      - name: Verify AIDL
        shell: bash
        run: |
          set -eux

          SDK="/usr/local/lib/android/sdk"

          echo "=========================================="
          echo "AIDL CHECK"
          echo "=========================================="

          FOUND_AIDL=""

          if [ -x "$SDK/build-tools/35.0.0/aidl" ]; then
            FOUND_AIDL="$SDK/build-tools/35.0.0/aidl"
          elif [ -x "$SDK/build-tools/33.0.2/aidl" ]; then
            FOUND_AIDL="$SDK/build-tools/33.0.2/aidl"
          fi

          if [ -z "$FOUND_AIDL" ]; then
            echo "ERROR: AIDL পাওয়া যায়নি।"
            find "$SDK/build-tools" -type f -name aidl -print || true
            exit 1
          fi

          echo "AIDL found:"
          echo "$FOUND_AIDL"

          "$FOUND_AIDL" --version || true

      # ==========================================
      # 8. Verify NDK
      # ==========================================
      - name: Verify Android NDK
        shell: bash
        run: |
          set -eux

          NDK="/usr/local/lib/android/sdk/ndk/27.3.13750724"

          echo "=========================================="
          echo "NDK CHECK"
          echo "=========================================="

          if [ ! -d "$NDK" ]; then
            echo "ERROR: NDK 27.3.13750724 পাওয়া যায়নি।"
            ls -la "/usr/local/lib/android/sdk/ndk" || true
            exit 1
          fi

          echo "NDK found:"
          echo "$NDK"

          ls -la "$NDK"

      # ==========================================
      # 9. Install Buildozer dependencies
      # ==========================================
      - name: Install Buildozer dependencies
        shell: bash
        run: |
          set -eux

          python -m pip install --upgrade pip

          python -m pip install \
            "buildozer>=1.5.0" \
            "cython<3.1" \
            virtualenv \
            setuptools \
            wheel

          # p4a requires sh < 2
          python -m pip install "sh<2.0,>=1.10"

      # ==========================================
      # 10. Verify buildozer.spec
      # ==========================================
      - name: Verify buildozer.spec
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "BUILDOZER SPEC"
          echo "=========================================="

          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec পাওয়া যায়নি।"
            exit 1
          fi

          cat buildozer.spec

      # ==========================================
      # 11. Clean old Buildozer cache
      # ==========================================
      - name: Clean Buildozer cache
        shell: bash
        run: |
          set -eux

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

      # ==========================================
      # 12. Build APK
      # ==========================================
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail

          echo "=========================================="
          echo "V16 ANTIVIRUS APK BUILD"
          echo "=========================================="

          mkdir -p build-logs

          buildozer -v android debug 2>&1 | tee build-logs/buildozer-full.log

      # ==========================================
      # 13. Show APK
      # ==========================================
      - name: Find generated APK
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "GENERATED APK"
          echo "=========================================="

          echo
          echo "bin directory:"
          ls -lah bin || true

          echo
          echo "Searching APK files..."

          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print || true

      # ==========================================
      # 14. Copy APK to output
      # ==========================================
      - name: Prepare APK artifact
        if: success()
        shell: bash
        run: |
          set -eux

          mkdir -p apk-output

          APK_FILE="$(find bin -maxdepth 1 -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK তৈরি হয়নি।"
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          cp "$APK_FILE" apk-output/V16-Antivirus.apk

          ls -lah apk-output

      # ==========================================
      # 15. Upload APK
      # ==========================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: apk-output/V16-Antivirus.apk
          if-no-files-found: error

      # ==========================================
      # 16. Collect Buildozer logs
      # ==========================================
      - name: Collect Buildozer logs
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p build-logs

          if [ -f build-logs/buildozer-full.log ]; then
            echo "Buildozer full log already exists."
          else
            echo "Buildozer log was not created."
          fi

          echo
          echo "Build log files:"
          find .buildozer -type f 2>/dev/null | head -n 500 \
            >> build-logs/buildozer-files.txt || true

          echo
          echo "Last 300 lines of Buildozer log:"
          if [ -f build-logs/buildozer-full.log ]; then
            tail -n 300 build-logs/buildozer-full.log \
              > build-logs/buildozer-last-300-lines.log
          fi

      # ==========================================
      # 17. Upload logs
      # ==========================================
      - name: Upload Buildozer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V16-Buildozer-Full-Logs
          path: |
            build-logs/
            .buildozer/android/platform/python-for-android/*.log
            .buildozer/android/platform/build-*/build/*.log
          if-no-files-found: warn
